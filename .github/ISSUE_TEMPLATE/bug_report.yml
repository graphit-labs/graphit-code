name: Bug Report
description: Report reproducible incorrect behavior in Graphit Code
title: "[Bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for helping improve Graphit. Search existing issues first, then include the smallest reproducible case. Remove credentials, bearer keys, private source, bucket names, and personal paths from all output.
  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      description: Where did the problem occur?
      options:
        - CLI or setup
        - AST indexing, graph, or retrieval
        - Knowledge or wiki
        - Memory
        - Task coordination
        - Hub or shared storage
        - Daemon, hooks, or filesystem watcher
        - MCP endpoint or client integration
        - Observatory UI or Live Search
        - Build, release, or container
        - Documentation
    validations:
      required: true
  - type: dropdown
    id: environment
    attributes:
      label: Operating system
      options: [Linux, macOS, Windows, Container]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Graphit version
      description: Paste `graphit version` or the exact commit SHA.
      placeholder: v1.4.0 or 0123456789abcdef
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Agent or MCP client
      description: Include the client and version when hooks, adapters, Live Search, or MCP are involved.
      placeholder: Codex, Claude Code, Cursor, custom MCP client, or not applicable
  - type: textarea
    id: configuration
    attributes:
      label: Relevant configuration
      description: List only relevant keys, modules, environment overrides, storage mode, and special paths. Redact every secret.
      placeholder: |
        modules.ast=true
        ai.embedding.provider=local
        storage=local
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Minimal reproduction
      description: Include initial state, exact commands or tool calls, and the smallest files needed to reproduce the behavior.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized evidence
      description: Paste concise logs, stack traces, screenshots, or task IDs. Never include secrets, MCP bearer keys, private code, or complete configuration dumps.
      render: shell
