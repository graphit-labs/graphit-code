name: CI

on:
  push:
    branches: [main, develop, github, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  lint:
    name: Lint & Vet
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Create UI dist placeholder
        run: mkdir -p internal/ui/dist && touch internal/ui/dist/.gitkeep

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache LanceDB native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/lancedb-native-cache
          key: lancedb-linux-amd64-${{ hashFiles('Makefile') }}
          restore-keys: |
            lancedb-linux-amd64-

      - name: Validate workflow files
        run: make actionlint

      - name: Vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  test:
    name: Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Create UI dist placeholder
        run: mkdir -p internal/ui/dist && touch internal/ui/dist/.gitkeep

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache LanceDB native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/lancedb-native-cache
          key: lancedb-linux-amd64-${{ hashFiles('Makefile') }}
          restore-keys: |
            lancedb-linux-amd64-

      - name: Cache ONNX Runtime and embedding model
        uses: actions/cache@v4
        with:
          path: |
            /tmp/onnxruntime-cache
            /tmp/graphit-model-cache
          key: test-deps-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            test-deps-${{ runner.os }}-

      - name: Run tests
        run: make test

      - name: Convert coverage to Cobertura XML
        run: go run github.com/boumenot/gocover-cobertura@v1.5.0 < coverage.out > coverage.xml

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: go
          name: code-coverage/go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  platform-semantics:
    name: Platform semantics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Watcher and ignore rules
        run: go test -race -count=1 -timeout 10m ./internal/fswatch/... ./internal/ignorer/...
      - name: Store path resolution
        run: go test -race -count=1 -timeout 5m ./internal/store/...

  security:
    name: Security Scan
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Create UI dist placeholder
        run: mkdir -p internal/ui/dist && touch internal/ui/dist/.gitkeep

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache LanceDB native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/lancedb-native-cache
          key: lancedb-linux-amd64-${{ hashFiles('Makefile') }}
          restore-keys: |
            lancedb-linux-amd64-

      - name: Run govulncheck
        run: make vulncheck

  build-check:
    name: Build Check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/ui/package-lock.json

      - name: Install CGO and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Cache ONNX Runtime and liblbug
        uses: actions/cache@v4
        with:
          path: |
            /tmp/onnxruntime-cache
            /tmp/lbug-cache
          key: build-deps-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            build-deps-${{ runner.os }}-

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache LanceDB native build
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            /tmp/lancedb-native-cache
          key: lancedb-linux-amd64-${{ hashFiles('Makefile') }}
          restore-keys: |
            lancedb-linux-amd64-

      - name: Build
        run: make build-linux
        env:
          VERSION: ci-${{ github.sha }}

  ui-build:
    name: UI Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/ui/package-lock.json

      - name: Build UI
        run: make ui

      - name: Lint UI
        run: make ui-lint
