name: CI

on:
  push:
    branches: [main, develop, github, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  native-linux:
    name: Linux Native Dependency
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Cache verified native bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/graphit/native
          key: graphit-native-linux-amd64-${{ hashFiles('native-deps.env') }}

      - name: Install verified native dependencies
        run: make lancedb-native

      - name: Upload LanceDB native library
        uses: actions/upload-artifact@v4
        with:
          name: lancedb-native-linux-amd64
          path: .native
          include-hidden-files: true
          retention-days: 1

  lint:
    name: Lint & Vet
    needs: native-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download LanceDB native library
        uses: actions/download-artifact@v4
        with:
          name: lancedb-native-linux-amd64
          path: .native

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore verified native bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/graphit/native
          key: graphit-native-linux-amd64-${{ hashFiles('native-deps.env') }}

      - name: Install CGO dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Create UI dist placeholder
        run: mkdir -p internal/ui/dist && touch internal/ui/dist/.gitkeep

      - name: Validate workflow files
        run: make actionlint

      - name: Vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.12.2

  test:
    name: Tests
    needs: [native-linux, ui-build]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download LanceDB native library
        uses: actions/download-artifact@v4
        with:
          name: lancedb-native-linux-amd64
          path: .native

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore verified native bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/graphit/native
          key: graphit-native-linux-amd64-${{ hashFiles('native-deps.env') }}

      - name: Install CGO dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Download built UI
        uses: actions/download-artifact@v4
        with:
          name: ui-dist
          path: internal/ui/dist

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Cache embedding model
        uses: actions/cache@v4
        with:
          path: /tmp/graphit-model-cache
          key: embedding-model-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            embedding-model-${{ runner.os }}-

      - name: Run tests
        run: make test-full
        env:
          GRAPHIT_HEAVY_TEST_ISOLATED: "1"

      - name: Convert coverage to Cobertura XML
        run: go run github.com/boumenot/gocover-cobertura@v1.5.0 < coverage.out > coverage.xml
        env:
          GOFLAGS: "-tags=lancedb"

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: go
          name: code-coverage/go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  platform-semantics:
    name: Platform semantics (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Watcher and ignore rules
        run: go test -race -count=1 -timeout 10m ./internal/fswatch/... ./internal/ignorer/...
      - name: Store path resolution
        run: go test -race -count=1 -timeout 5m ./internal/store/...

  security:
    name: Security Scan
    needs: native-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download LanceDB native library
        uses: actions/download-artifact@v4
        with:
          name: lancedb-native-linux-amd64
          path: .native

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Restore verified native bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/graphit/native
          key: graphit-native-linux-amd64-${{ hashFiles('native-deps.env') }}

      - name: Install CGO dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Create UI dist placeholder
        run: mkdir -p internal/ui/dist && touch internal/ui/dist/.gitkeep

      - name: Run govulncheck
        run: make vulncheck

  build-check:
    name: Build Check
    needs: native-linux
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download LanceDB native library
        uses: actions/download-artifact@v4
        with:
          name: lancedb-native-linux-amd64
          path: .native

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/ui/package-lock.json

      - name: Restore verified native bundle
        uses: actions/cache@v4
        with:
          path: ~/.cache/graphit/native
          key: graphit-native-linux-amd64-${{ hashFiles('native-deps.env') }}

      - name: Install CGO and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Build
        run: make build-linux
        env:
          VERSION: ci-${{ github.sha }}

  ui-build:
    name: UI Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/ui/package-lock.json

      - name: Build UI
        run: make ui

      - name: Lint UI
        run: make ui-lint

      - name: Upload built UI
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: internal/ui/dist
          retention-days: 1
