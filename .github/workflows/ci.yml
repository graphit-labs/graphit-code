name: CI

on:
  push:
    branches: [main, develop, github, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:

  rust-contracts:
    name: Rust contracts (${{ matrix.os }})
    defaults:
      run:
        working-directory: graphit-code
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-15, windows-2022]
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: "2"
      RUST_TEST_THREADS: "2"
      GRAPHIT_BROKER_REF: ${{ vars.GRAPHIT_BROKER_REF }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: graphit-code
      - name: Free Linux runner space for Rust test artifacts
        if: runner.os == 'Linux'
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Free macOS runner space for Rust test artifacts
        if: runner.os == 'macOS'
        run: |
          df -h .
          sudo xcrun simctl runtime delete all
          df -h .
          echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)" >> "$GITHUB_ENV"
      - name: Require explicit Broker source ref
        shell: bash
        run: |
          if [ -z "$GRAPHIT_BROKER_REF" ]; then
            echo "Set repository variable GRAPHIT_BROKER_REF to the Broker source ref paired with this Code revision." >&2
            exit 1
          fi
      - name: Checkout Broker wire producer
        uses: actions/checkout@v4
        with:
          repository: graphit-labs/graphit-broker
          ref: ${{ env.GRAPHIT_BROKER_REF }}
          path: graphit-broker
          persist-credentials: false
          token: ${{ secrets.GRAPHIT_BROKER_READ_TOKEN || github.token }}
      - name: Record paired Broker revision
        run: git -C ../graphit-broker rev-parse --verify HEAD
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install current Git on Linux (native hooks/reftable required)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes git
      - name: Install current Git on macOS (native hooks/reftable required)
        if: runner.os == 'macOS'
        run: |
          brew install git
          echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"
      - name: Install current Git on Windows (native hooks/reftable required)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade git --yes --no-progress
          "${env:ProgramFiles}\Git\cmd" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          git config --global core.longpaths true
      - name: Verify Git native hooks and shell on PATH (2.54+)
        run: |
          git --version
          git var GIT_SHELL_PATH
          git -c hook.graphit-ci-native.event=pre-commit -c hook.graphit-ci-native.command='exit 0' hook run pre-commit
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes build-essential gcc-13 g++-13 cmake clang llvm libclang-dev libssl-dev pkg-config protobuf-compiler libprotobuf-dev patchelf
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl@3 protobuf pkg-config llvm
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Install Windows native build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc unzip llvm ninja --yes --no-progress
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - name: Install Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows pkgconf:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
          "PKG_CONFIG=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/pkgconf/pkgconf.exe" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Set up compiler for external S3 test tools
        if: runner.os == 'Linux'
        uses: actions/setup-go@v5
        with:
          go-version: '1.25.9'
          cache: false
      - name: Prepare pinned S3 test tools
        if: runner.os == 'Linux'
        shell: bash
        run: |
          tools="$RUNNER_TEMP/broker-s3-test-tools"
          GOBIN="$tools" sh ../graphit-broker/scripts/prepare-s3-test-tools.sh
          go clean -cache -modcache
          df -h .
          echo "$tools" >> "$GITHUB_PATH"
      - name: Build owned Broker Hub storage fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked --manifest-path ../graphit-broker/Cargo.toml -p broker-presence --example hub_storage_fixture --target-dir target
          fixture_bin="$PWD/target/debug/examples/hub_storage_fixture"
          test -f "$fixture_bin"
          test -x "$fixture_bin"
          echo "GRAPHIT_BROKER_HUB_STORAGE_FIXTURE_BIN=$fixture_bin" >> "$GITHUB_ENV"
      - name: Build model-server executable for Linux contract tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo xtask cargo build --locked -p graphit-daemon --bin graphit-model-server
          model_server="$PWD/target/debug/graphit-model-server"
          test -s "$model_server"
          test -x "$model_server"
          echo "GRAPHIT_TEST_MODEL_SERVER=$model_server" >> "$GITHUB_ENV"
      - name: Prepare pinned embedding GGUF for the Linux native NN gate
        if: runner.os == 'Linux'
        shell: bash
        env:
          EMBEDDING_MODEL_URL: https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/bfcd298762cc34d0357ece5ebdd31791a3a374d8/embeddinggemma-2-BF16.gguf
          EMBEDDING_MODEL_SHA256: 68bae29d62fb8c7d23e98d21fd4662753ddd636e6b62b8a70dfe059a9844f216
          EMBEDDING_MODEL_BYTES: '557950176'
        run: |
          model_file="$RUNNER_TEMP/embeddinggemma-2-BF16.gguf"
          curl --fail --location --show-error --silent "$EMBEDDING_MODEL_URL" --output "$model_file"
          printf '%s  %s\n' "$EMBEDDING_MODEL_SHA256" "$model_file" | sha256sum --check
          test "$(wc -c < "$model_file")" -eq "$EMBEDDING_MODEL_BYTES"
          echo "GRAPHIT_EMBEDDINGGEMMA2_MODEL=$model_file" >> "$GITHUB_ENV"
      - name: Prepare pinned reranker GGUF for Linux model lifecycle tests
        if: runner.os == 'Linux'
        shell: bash
        env:
          RERANK_MODEL_URL: https://huggingface.co/sinjab/bge-reranker-v2-m3-F16-GGUF/resolve/1458e3304258a8a11773000c7d0c192abfe78291/bge-reranker-v2-m3-F16.gguf
          RERANK_MODEL_SHA256: 3c2de408d2c0a85a9472dc09f9d5a22c9b73743c6343952c15053299c777c298
          RERANK_MODEL_BYTES: '1159774912'
        run: |
          model_file="$RUNNER_TEMP/bge-reranker-v2-m3-F16.gguf"
          curl --fail --location --show-error --silent "$RERANK_MODEL_URL" --output "$model_file"
          printf '%s  %s\n' "$RERANK_MODEL_SHA256" "$model_file" | sha256sum --check
          test "$(wc -c < "$model_file")" -eq "$RERANK_MODEL_BYTES"
          echo "GRAPHIT_BGE_RERANKER_V2_M3_MODEL=$model_file" >> "$GITHUB_ENV"
      - name: Check Rust contracts and quality
        run: cargo xtask gate

  workflow-lint:
    name: Workflow lint
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Validate workflow files
        run: actionlint -no-color .github/workflows/*.yml


  ui-build:
    name: UI Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Build UI shipped with Rust
        run: |
          npm --prefix ui ci
          node scripts/build-rust-ui.mjs
          git diff --exit-code -- crates/graphit-app/assets/ui/index.html crates/graphit-app/assets/ui/logo.svg crates/graphit-app/assets/ui/favicon.svg

      - name: Lint UI
        run: make ui-lint

      - name: Test UI
        run: make ui-test

      - name: Upload built UI
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  native-packaging:
    name: Native packaging contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check affected shell scripts and package contracts
        run: |
          shellcheck -x install.sh scripts/package-release.sh scripts/graphit-entrypoint.sh
          node scripts/test-native-packaging.mjs
          node scripts/test-package-platform-runtime.mjs
