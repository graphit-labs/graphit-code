name: CI

on:
  push:
    branches: [main, develop, github, "feature/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read
  code-quality: write

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── Code Quality ───────────────────────────────────────────────────────────
  lint:
    name: Lint & Vet
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create UI dist placeholder
        run: mkdir -p internal/ui/dist && touch internal/ui/dist/.gitkeep

      - name: Vet
        run: make vet

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v8
        with:
          version: v2.12.2
          args: --timeout=5m

  # ── Tests ──────────────────────────────────────────────────────────────────
  test:
    name: Tests
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install CGO dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Create UI dist placeholder
        run: mkdir -p internal/ui/dist && touch internal/ui/dist/.gitkeep

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Run tests
        run: make test

      - name: Convert coverage to Cobertura XML
        run: |
          go install github.com/boumenot/gocover-cobertura@latest
          gocover-cobertura < coverage.out > coverage.xml

      - name: Upload coverage report
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: codecov/codecov-action@v5
        with:
          files: coverage.xml
          flags: go
          name: code-coverage/go
          token: ${{ secrets.CODECOV_TOKEN }}
          fail_ci_if_error: false

  # ── Cross-platform ────────────────────────────────────────────────────────
  # The filesystem watcher is the one component whose behaviour is supplied by
  # the operating system: inotify on Linux, kqueue on macOS,
  # ReadDirectoryChangesW on Windows. It replaced a git-status poll that behaved
  # identically everywhere, and until this job existed it had only ever been
  # executed on Linux — the Tests job above is ubuntu-only, and the macOS and
  # Windows runners in this repository build releases without running tests.
  #
  # Only the packages that need no CGO, no ICU and no LadybugDB are run here, so
  # the job needs no platform-specific dependency setup and stays fast. That is
  # exactly the watcher and the ignore rules it consults.
  watcher-cross-platform:
    name: Watcher (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, macos-14, windows-2022]
    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      # Timing-sensitive by nature: the watcher debounces, and a shared runner
      # is slower and noisier than a workstation. -count=1 defeats the test
      # cache so a green result means it actually ran on this platform.
      - name: Watcher and ignore rules
        run: go test -race -count=1 -timeout 10m ./internal/fswatch/... ./internal/ignorer/...

  # ── Security ──────────────────────────────────────────────────────────────
  security:
    name: Security Scan
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Create UI dist placeholder
        run: mkdir -p internal/ui/dist && touch internal/ui/dist/.gitkeep

      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest

      - name: Run govulncheck
        run: govulncheck ./...

  # ── Build verification ─────────────────────────────────────────────────────
  build-check:
    name: Build Check
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/ui/package-lock.json

      - name: Install CGO and build dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Set up Zig
        run: |
          ZIG_VERSION=0.16.0
          curl -sSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> $GITHUB_PATH

      # The build pulls a 132 MB model, the ONNX Runtime and liblbug from three
      # different external hosts. None of that changes between runs, and one CDN
      # timing out failed the whole job — which is exactly what happened. Cached,
      # the usual run touches none of them.
      #
      # The key carries the versions the Makefile pins, so bumping ORT or the
      # model repository invalidates it instead of serving a stale artifact.
      - name: Cache model, ONNX Runtime and liblbug
        uses: actions/cache@v4
        with:
          path: |
            /tmp/coderankembed-cache
            /tmp/onnxruntime-cache
            /tmp/lbug-cache
          key: build-deps-${{ runner.os }}-${{ hashFiles('Makefile') }}
          restore-keys: |
            build-deps-${{ runner.os }}-

      - name: Build
        run: make build-linux
        env:
          VERSION: ci-${{ github.sha }}

  # ── UI Build ───────────────────────────────────────────────────────────────
  ui-build:
    name: UI Build
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/ui/package-lock.json

      - name: Build UI
        run: make ui

      - name: Lint UI
        run: cd internal/ui && npm run lint
