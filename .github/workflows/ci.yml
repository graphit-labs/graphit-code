name: CI

on:
  push:
    branches: [main, develop, github, "feature/**"]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      suite:
        description: Validation suite
        type: choice
        required: true
        default: standard
        options:
          - standard
          - core-fs
      platform:
        description: Native validation platform
        type: choice
        required: true
        default: all
        options:
          - all
          - linux-amd64
          - darwin-arm64
          - windows-amd64

permissions:
  contents: read

jobs:

  select-platforms:
    name: Validate suite and platform
    runs-on: ubuntu-22.04
    outputs:
      suite: ${{ steps.select.outputs.suite }}
      platform: ${{ steps.select.outputs.platform }}
      matrix: ${{ steps.select.outputs.matrix }}
    steps:
      - name: Select native matrix
        id: select
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          SUITE: ${{ inputs.suite }}
          PLATFORM: ${{ inputs.platform }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" != workflow_dispatch ]]; then
            SUITE=standard
            PLATFORM=all
          fi
          case "$SUITE" in
            standard|core-fs) ;;
            *) echo 'Unsupported suite: choose standard or core-fs' >&2; exit 1 ;;
          esac
          case "$PLATFORM" in
            all|linux-amd64|darwin-arm64|windows-amd64) ;;
            *) echo 'Unsupported platform: choose all, linux-amd64, darwin-arm64 or windows-amd64' >&2; exit 1 ;;
          esac
          selection_platform=$PLATFORM
          if [[ "$SUITE" == core-fs ]]; then
            case "$PLATFORM" in
              all|windows-amd64) PLATFORM=windows-amd64 ;;
              *) echo 'The core-fs suite supports only all or windows-amd64' >&2; exit 1 ;;
            esac
          fi
          case "$PLATFORM" in
            all) matrix='{"include":[{"os":"ubuntu-22.04","build-jobs":4},{"os":"macos-15","build-jobs":2},{"os":"windows-2022","build-jobs":4}]}' ;;
            linux-amd64) matrix='{"include":[{"os":"ubuntu-22.04","build-jobs":4}]}' ;;
            darwin-arm64) matrix='{"include":[{"os":"macos-15","build-jobs":2}]}' ;;
            windows-amd64) matrix='{"include":[{"os":"windows-2022","build-jobs":4}]}' ;;
          esac
          printf 'suite=%s\nplatform=%s\nmatrix=%s\n' "$SUITE" "$selection_platform" "$matrix" >> "$GITHUB_OUTPUT"

  rust-contracts:
    name: Rust contracts (${{ matrix.os }})
    needs: select-platforms
    if: ${{ needs.select-platforms.outputs.suite == 'standard' }}
    concurrency:
      group: ci-${{ github.ref }}:${{ needs.select-platforms.outputs.suite }}:${{ needs.select-platforms.outputs.platform }}:rust-contracts:${{ matrix.os }}
      cancel-in-progress: true
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.select-platforms.outputs.matrix) }}
    runs-on: ${{ matrix.os }}
    env:
      CARGO_BUILD_JOBS: ${{ matrix.build-jobs }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Free Linux runner space for Rust test artifacts
        if: runner.os == 'Linux'
        run: |
          df -h .
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc
          df -h .
      - name: Free macOS runner space for Rust test artifacts
        if: runner.os == 'macOS'
        run: |
          df -h .
          sudo xcrun simctl runtime delete all
          df -h .
          echo "TMPDIR=$(cd "$RUNNER_TEMP" && pwd -P)" >> "$GITHUB_ENV"
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install current Git on Linux (native hooks/reftable required)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes git
      - name: Install current Git on macOS (native hooks/reftable required)
        if: runner.os == 'macOS'
        run: |
          brew install git
          echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"
      - name: Install current Git on Windows (native hooks/reftable required)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade git --yes --no-progress
          "${env:ProgramFiles}\Git\cmd" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          git config --global core.longpaths true
      - name: Verify Git native hooks and shell on PATH (2.54+)
        run: |
          git --version
          git var GIT_SHELL_PATH
          git -c hook.graphit-ci-native.event=pre-commit -c hook.graphit-ci-native.command='exit 0' hook run pre-commit
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes build-essential gcc-13 g++-13 cmake clang llvm libclang-dev libssl-dev pkg-config protobuf-compiler libprotobuf-dev patchelf
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl@3 protobuf pkg-config llvm
          echo "OPENSSL_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib" >> "$GITHUB_ENV"
      - name: Install Windows native build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco install protoc unzip llvm ninja --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
      - name: Select Windows compiler
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - name: Identify Windows native ABI
        if: runner.os == 'Windows'
        id: windows-abi
        shell: python
        run: |
          import hashlib, json, os, pathlib, subprocess
          vcpkg = os.environ["VCPKG_INSTALLATION_ROOT"]
          revision = subprocess.check_output(["git", "-C", vcpkg, "rev-parse", "HEAD"], text=True).strip()
          identity = {name: os.environ[name] for name in ("ImageOS", "ImageVersion", "VCToolsVersion", "WindowsSDKVersion")}
          identity.update(vcpkg=revision, triplet="x64-windows", ports=["openssl", "pkgconf"])
          digest = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          cache = pathlib.Path(os.environ["RUNNER_TEMP"]) / "vcpkg-binary-cache"
          cache.mkdir(exist_ok=True)
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"digest={digest}", file=output)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print(f"VCPKG_DEFAULT_BINARY_CACHE={cache}", file=output)
              print(f"VCPKG_BINARY_SOURCES=clear;files,{cache},readwrite", file=output)
              print(f"GRAPHIT_CI_VCPKG_REVISION={revision}", file=output)
      - name: Restore Windows native binary packages
        if: runner.os == 'Windows'
        id: vcpkg-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: code-vcpkg-v1-${{ runner.arch }}-${{ steps.windows-abi.outputs.digest }}-${{ hashFiles('.github/workflows/ci.yml') }}
      - name: Prepare OpenSSL for the native Windows build
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $vcpkg = $env:VCPKG_INSTALLATION_ROOT
          & "$vcpkg/vcpkg.exe" install openssl:x64-windows pkgconf:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_DIR=$vcpkg/installed/x64-windows" >> $env:GITHUB_ENV
          "$vcpkg/installed/x64-windows/bin" >> $env:GITHUB_PATH
          "PKG_CONFIG=$vcpkg/installed/x64-windows/tools/pkgconf/pkgconf.exe" >> $env:GITHUB_ENV
      - name: Save Windows native binary packages
        if: runner.os == 'Windows' && steps.vcpkg-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ runner.temp }}/vcpkg-binary-cache
          key: ${{ steps.vcpkg-cache.outputs.cache-primary-key }}
      - name: Identify compiled cache ABI and runner resources
        id: build-abi
        shell: python
        run: |
          import hashlib, json, os, platform, subprocess
          def version(*args, accepted=(0,)):
              result = subprocess.run(args, stdout=subprocess.PIPE, stderr=subprocess.STDOUT, text=True)
              if result.returncode not in accepted:
                  raise RuntimeError(f"{args}: {result.stdout}")
              return result.stdout.strip()
          tools = {name: version(name, flag) for name, flag in (("rustc", "-vV"), ("cargo", "-vV"), ("cmake", "--version"), ("protoc", "--version"), ("clang", "--version"))}
          if platform.system() == "Windows":
              tools["compiler"] = version("cl", "/Bv", accepted=(0, 2))
              tools["ninja"] = version("ninja", "--version")
              memory = version("pwsh", "-NoProfile", "-Command", "(Get-CimInstance Win32_ComputerSystem).TotalPhysicalMemory")
          else:
              tools["cc"] = version(os.environ.get("CC", "cc"), "--version")
              tools["cxx"] = version(os.environ.get("CXX", "c++"), "--version")
              if platform.system() == "Darwin":
                  tools["sdk"] = version("xcrun", "--show-sdk-version")
                  tools["libraries"] = version("brew", "list", "--versions", "openssl@3", "protobuf", "llvm", "cmake")
                  memory = version("sysctl", "-n", "hw.memsize")
              else:
                  tools["libraries"] = version("dpkg-query", "-W", "libc6-dev", "libstdc++-13-dev", "libssl-dev", "libclang-dev", "libprotobuf-dev")
                  memory = os.sysconf("SC_PAGE_SIZE") * os.sysconf("SC_PHYS_PAGES")
          names = ("ImageOS", "ImageVersion", "CC", "CXX", "CFLAGS", "CPPFLAGS", "CXXFLAGS", "LDFLAGS", "RUSTFLAGS", "RUSTDOCFLAGS", "CARGO_ENCODED_RUSTFLAGS", "CARGO_BUILD_TARGET", "CARGO_INCREMENTAL", "CARGO_PROFILE_DEV_DEBUG", "CARGO_PROFILE_TEST_DEBUG", "CMAKE_GENERATOR", "CMAKE_TOOLCHAIN_FILE", "CMAKE_PLATFORM_NO_VERSIONED_SONAME", "OPENSSL_DIR", "OPENSSL_ROOT_DIR", "PKG_CONFIG", "LIBCLANG_PATH", "VCToolsVersion", "WindowsSDKVersion", "GRAPHIT_CI_VCPKG_REVISION")
          options = {name: os.environ.get(name, "") for name in names}
          prefixes = ("CC_", "CXX_", "GGML_", "LLAMA_", "CMAKE_", "CARGO_PROFILE_", "CUDA", "CUDNN", "LBUG_")
          options.update({name: value for name, value in os.environ.items() if name.startswith(prefixes) or name in ("HOST_CC", "HOST_CXX", "TARGET_CC", "TARGET_CXX")})
          identity = dict(tools=tools, architecture=platform.machine(), options=options)
          digest = hashlib.sha256(json.dumps(identity, sort_keys=True).encode()).hexdigest()
          print(json.dumps(dict(tools=tools, architecture=platform.machine(), option_names=sorted(options)), sort_keys=True, indent=2))
          print(f"Runner CPUs={os.cpu_count()}, RAM bytes={memory}, CARGO_BUILD_JOBS={os.environ['CARGO_BUILD_JOBS']}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as output:
              print(f"digest={digest}", file=output)
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install pinned native test runner
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest@0.9.151
          checksum: true
          fallback: none
      - name: Restore locked Cargo sources
        id: cargo-sources
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: code-sources-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: code-sources-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Save locked Cargo sources before compilation
        if: steps.cargo-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-sources.outputs.cache-primary-key }}
      - name: Restore native engine preparation
        id: native-cache
        uses: actions/cache/restore@v4
        with:
          path: target/native/ladybug
          key: code-native-v2-${{ matrix.os }}-${{ runner.arch }}-${{ steps.build-abi.outputs.digest }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/graphit-ast/Cargo.toml', 'xtask/Cargo.toml', 'xtask/src/ladybug.rs', 'rust-toolchain.toml', '.cargo/config.toml') }}
      - name: Restore compiled Rust artifacts
        id: rust-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.d
            target/debug/deps/*.so
            target/debug/deps/*.dylib
            target/debug/deps/*.dll
            target/debug/deps/*.lib
            target/debug/deps/*.a
            target/debug/deps/xtask-*
            target/debug/xtask
            target/debug/xtask.exe
          key: code-rust-v2-${{ matrix.os }}-${{ runner.arch }}-${{ steps.build-abi.outputs.digest }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/graphit-ast/Cargo.toml', 'crates/*/build.rs', 'xtask/Cargo.toml', 'xtask/src/ladybug.rs', 'rust-toolchain.toml', '.cargo/config.toml', '.github/workflows/ci.yml') }}-${{ hashFiles('crates/*/Cargo.toml') }}-${{ github.sha }}
          restore-keys: code-rust-v2-${{ matrix.os }}-${{ runner.arch }}-${{ steps.build-abi.outputs.digest }}-${{ hashFiles('Cargo.lock', 'Cargo.toml', 'crates/graphit-ast/Cargo.toml', 'crates/*/build.rs', 'xtask/Cargo.toml', 'xtask/src/ladybug.rs', 'rust-toolchain.toml', '.cargo/config.toml', '.github/workflows/ci.yml') }}-
      - name: Test OpenCode plugin runtime contracts offline
        run: node --test scripts/test-opencode-plugin.mjs
      - name: Check offline Rust sources
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo xtask check
      - name: Prepare native engine offline
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo xtask native --offline
      - name: Save completed native engine before Rust checks
        if: steps.native-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: target/native/ladybug
          key: ${{ steps.native-cache.outputs.cache-primary-key }}
      - name: Run offline Rust Clippy
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo xtask cargo clippy --workspace --all-targets --locked --offline --keep-going -- -D warnings
      - name: Build offline Rust test executables and subprocess fixtures
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo xtask cargo test --workspace --no-run --locked --offline
      - name: Save compiled Rust artifacts before tests
        if: steps.rust-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            target/debug/.fingerprint
            target/debug/build
            target/debug/deps/*.rlib
            target/debug/deps/*.rmeta
            target/debug/deps/*.d
            target/debug/deps/*.so
            target/debug/deps/*.dylib
            target/debug/deps/*.dll
            target/debug/deps/*.lib
            target/debug/deps/*.a
            target/debug/deps/xtask-*
            target/debug/xtask
            target/debug/xtask.exe
          key: ${{ steps.rust-cache.outputs.cache-primary-key }}
      - name: Run offline Rust workspace tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo xtask tests

  core-fs-windows:
    name: Core and FS native Windows
    needs: select-platforms
    if: ${{ needs.select-platforms.outputs.suite == 'core-fs' }}
    concurrency:
      group: ci-${{ github.ref }}:${{ needs.select-platforms.outputs.suite }}:${{ needs.select-platforms.outputs.platform }}:core-fs-windows
      cancel-in-progress: true
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      CARGO_BUILD_JOBS: "4"
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    steps:
      - name: Validate fixed manual suite
        shell: pwsh
        env:
          SUITE: ${{ inputs.suite }}
        run: |
          if ($env:SUITE -ne 'core-fs') { throw 'Unsupported manual suite' }
      - name: Checkout Code
        uses: actions/checkout@v4
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Install current Git on Windows (native hooks/reftable required)
        shell: pwsh
        run: |
          choco upgrade git --yes --no-progress
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "${env:ProgramFiles}\Git\cmd" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          git config --global core.longpaths true
      - name: Verify Git native hooks and shell on PATH (2.54+)
        run: |
          git --version
          git var GIT_SHELL_PATH
          git -c hook.graphit-ci-native.event=pre-commit -c hook.graphit-ci-native.command='exit 0' hook run pre-commit
      - name: Select Windows compiler
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - name: Restore locked Cargo sources
        id: cargo-sources
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: code-sources-v2-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: code-sources-v2-${{ runner.os }}-${{ runner.arch }}-
      - name: Fetch locked Rust dependencies
        run: cargo fetch --locked
      - name: Save locked Cargo sources before compilation
        if: steps.cargo-sources.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: ${{ steps.cargo-sources.outputs.cache-primary-key }}
      - name: Run offline Core and FS tests
        env:
          CARGO_NET_OFFLINE: "true"
        run: cargo xtask cargo test -p graphit-core -p graphit-fs --locked --offline --no-fail-fast

  workflow-lint:
    name: Workflow lint
    needs: select-platforms
    if: ${{ needs.select-platforms.outputs.suite == 'standard' }}
    concurrency:
      group: ci-${{ github.ref }}:${{ needs.select-platforms.outputs.suite }}:${{ needs.select-platforms.outputs.platform }}:workflow-lint
      cancel-in-progress: true
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install actionlint
        run: |
          mkdir -p "$RUNNER_TEMP/actionlint"
          curl --fail --silent --show-error --location \
            --output "$RUNNER_TEMP/actionlint.tar.gz" \
            https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz
          echo "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8  $RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP/actionlint" actionlint
          echo "$RUNNER_TEMP/actionlint" >> "$GITHUB_PATH"

      - name: Validate workflow files
        run: actionlint -no-color .github/workflows/*.yml


  ui-build:
    name: UI Build
    needs: select-platforms
    if: ${{ needs.select-platforms.outputs.suite == 'standard' }}
    concurrency:
      group: ci-${{ github.ref }}:${{ needs.select-platforms.outputs.suite }}:${{ needs.select-platforms.outputs.platform }}:ui-build
      cancel-in-progress: true
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ui/package-lock.json

      - name: Prepare locked UI dependencies
        run: npm --prefix ui ci

      - name: Build UI shipped with Rust
        env:
          npm_config_offline: "true"
        run: |
          node scripts/build-rust-ui.mjs
          git diff --exit-code -- crates/graphit-app/assets/ui/index.html crates/graphit-app/assets/ui/logo.svg crates/graphit-app/assets/ui/favicon.svg

      - name: Lint UI
        env:
          npm_config_offline: "true"
        run: make ui-lint

      - name: Test UI
        env:
          npm_config_offline: "true"
        run: make ui-test

      - name: Upload built UI
        uses: actions/upload-artifact@v4
        with:
          name: ui-dist
          path: ui/dist
          retention-days: 1

  native-packaging:
    name: Native packaging contracts
    needs: select-platforms
    if: ${{ needs.select-platforms.outputs.suite == 'standard' }}
    concurrency:
      group: ci-${{ github.ref }}:${{ needs.select-platforms.outputs.suite }}:${{ needs.select-platforms.outputs.platform }}:native-packaging
      cancel-in-progress: true
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check affected shell scripts and package contracts
        run: |
          shellcheck -x install.sh scripts/package-release.sh scripts/graphit-entrypoint.sh
          node scripts/test-native-packaging.mjs
          node scripts/test-package-platform-runtime.mjs
