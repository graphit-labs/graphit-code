name: Release

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  # ── CI Gate ─────────────────────────────────────────────────────────────────
  # All builds depend on CI passing. Prevents releasing broken code.
  ci:
    name: CI Gate
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/ui/package-lock.json

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends libicu-dev pkg-config

      - name: Create UI dist placeholder
        run: mkdir -p internal/ui/dist && touch internal/ui/dist/.gitkeep

      - name: Vet
        run: make vet

      - name: Lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.12.2
          args: --timeout=5m

      - name: Configure git identity
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Test
        run: make test

      - name: UI Build
        run: make ui

      - name: UI Lint
        run: make ui-lint

  # ── WASM Grammars (platform-independent) ────────────────────────────────────
  # Tree-sitter grammars compile to WASM which is platform-independent.
  # Build once in a clean container to avoid zig cache issues on GH runners.
  build-grammars:
    name: Build WASM Grammars (Tree-sitter)
    needs: [ci]
    runs-on: ubuntu-22.04
    container: ubuntu:22.04

    steps:
      - name: Install tools
        run: |
          apt-get update -qq
          apt-get install -y --no-install-recommends curl xz-utils make ca-certificates

      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Zig
        run: |
          ZIG_VERSION=0.16.0
          curl -sSL "https://ziglang.org/download/${ZIG_VERSION}/zig-x86_64-linux-${ZIG_VERSION}.tar.xz" | tar -xJ -C /tmp
          echo "/tmp/zig-x86_64-linux-${ZIG_VERSION}" >> $GITHUB_PATH

      - name: Build grammars
        run: make build-grammars

      - name: Upload grammars
        uses: actions/upload-artifact@v4
        with:
          name: wasm-grammars
          path: internal/ast/grammars/*.wasm
          retention-days: 1

  # ── ANTLR v4 Grammars (C++ WASM via wasi-sdk) ──────────────────────────────
  # ANTLR grammars are compiled to platform-independent WASM binaries.
  # Requires wasi-sdk >= 33 and CMake.
  build-antlr-grammars:
    name: Build Grammars (ANTLR v4)
    needs: [ci]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install build tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends make curl xz-utils

      - name: Set up wasi-sdk
        run: |
          WASI_SDK_VERSION=33
          curl -sSL "https://github.com/aspect-build/aspect-wasi-sdk/releases/download/wasi-sdk-${WASI_SDK_VERSION}/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux.tar.gz" | tar xz -C /tmp
          echo "WASI_SDK_PREFIX=/tmp/wasi-sdk-${WASI_SDK_VERSION}.0-x86_64-linux" >> $GITHUB_ENV

      - name: Build ANTLR grammars
        run: make build-antlr-grammars

      - name: Upload ANTLR grammars
        uses: actions/upload-artifact@v4
        with:
          name: antlr-grammars
          path: internal/ast/grammars/antlr-*.wasm
          retention-days: 1

  # ── Linux amd64 ────────────────────────────────────────────────────────────
  build-linux:
    name: Build (linux-amd64)
    needs: [ci, build-grammars, build-antlr-grammars]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM grammars (Tree-sitter)
        uses: actions/download-artifact@v4
        with:
          name: wasm-grammars
          path: internal/ast/grammars

      - name: Download ANTLR grammars
        uses: actions/download-artifact@v4
        with:
          name: antlr-grammars
          path: internal/ast/grammars

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/ui/package-lock.json

      - name: Install system dependencies (CGO)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            libicu-dev \
            pkg-config \
            curl \
            unzip

      - name: Cache ONNX Runtime
        uses: actions/cache@v4
        with:
          path: /tmp/onnxruntime-cache
          key: onnxruntime-linux-x64-${{ env.ORT_VERSION }}
        env:
          ORT_VERSION: "1.25.0"

      - name: Cache CodeRankEmbed model
        uses: actions/cache@v4
        with:
          path: /tmp/coderankembed-cache
          key: coderankembed-int8-model-v1

      - name: Cache LadybugDB native library
        uses: actions/cache@v4
        with:
          path: /tmp/lbug-cache
          key: liblbug-linux-amd64-v0.13.1

      - name: Build (Linux)
        run: |
          make build-linux \
            SKIP_GRAMMARS=1 \
            SKIP_ANTLR_GRAMMARS=1 \
            VERSION="${{ github.ref_name }}" \
            BRAND="graphit" \
            DISPLAY_NAME="Graphit Code: AI Harness for Collaborative and Progressive Knowledge" \
            LBUG_PLATFORMS="linux-amd64"

      - name: Generate SHA-256 checksum
        run: |
          cd .build
          sha256sum graphit-linux-amd64 > graphit-linux-amd64.sha256

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: linux-amd64
          path: |
            .build/graphit-linux-amd64
            .build/graphit-linux-amd64.sha256
          retention-days: 1

  # ── macOS arm64 (Apple Silicon) ────────────────────────────────────────────
  build-darwin:
    name: Build (darwin-arm64)
    needs: [ci, build-grammars, build-antlr-grammars]
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM grammars (Tree-sitter)
        uses: actions/download-artifact@v4
        with:
          name: wasm-grammars
          path: internal/ast/grammars

      - name: Download ANTLR grammars
        uses: actions/download-artifact@v4
        with:
          name: antlr-grammars
          path: internal/ast/grammars

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/ui/package-lock.json

      - name: Install system dependencies (Homebrew)
        run: |
          brew install icu4c pkg-config

      - name: Cache ONNX Runtime (macOS)
        uses: actions/cache@v4
        with:
          path: /tmp/onnxruntime-cache
          key: onnxruntime-osx-arm64-${{ env.ORT_VERSION }}
        env:
          ORT_VERSION: "1.25.0"

      - name: Cache CodeRankEmbed model
        uses: actions/cache@v4
        with:
          path: /tmp/coderankembed-cache
          key: coderankembed-int8-model-v1

      - name: Cache LadybugDB native library (macOS)
        uses: actions/cache@v4
        with:
          path: /tmp/lbug-cache
          key: liblbug-darwin-v0.13.1

      - name: Build (macOS)
        run: |
          make build-darwin \
            SKIP_GRAMMARS=1 \
            SKIP_ANTLR_GRAMMARS=1 \
            VERSION="${{ github.ref_name }}" \
            BRAND="graphit" \
            DISPLAY_NAME="Graphit Code: AI Harness for Collaborative and Progressive Knowledge" \
            LBUG_PLATFORMS="darwin"

      - name: Generate SHA-256 checksum
        run: |
          cd .build
          shasum -a 256 graphit-darwin-arm64 > graphit-darwin-arm64.sha256

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: darwin-arm64
          path: |
            .build/graphit-darwin-arm64
            .build/graphit-darwin-arm64.sha256
          retention-days: 1

  # ── Windows amd64 (native) ──────────────────────────────────────────────────
  build-windows:
    name: Build (windows-amd64)
    needs: [ci, build-grammars, build-antlr-grammars]
    runs-on: windows-2022
    defaults:
      run:
        shell: msys2 {0}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download WASM grammars (Tree-sitter)
        uses: actions/download-artifact@v4
        with:
          name: wasm-grammars
          path: internal/ast/grammars

      - name: Download ANTLR grammars
        uses: actions/download-artifact@v4
        with:
          name: antlr-grammars
          path: internal/ast/grammars

      - name: Set up MSYS2
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          path-type: inherit
          install: >-
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-icu
            mingw-w64-x86_64-sqlite3
            make
            unzip
            curl
            tar
            gzip

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: internal/ui/package-lock.json

      - name: Cache ONNX Runtime (Windows)
        uses: actions/cache@v4
        with:
          path: C:\cache\ort
          key: onnxruntime-win-x64-1.25.0

      - name: Cache CodeRankEmbed model
        uses: actions/cache@v4
        with:
          path: C:\cache\model
          key: coderankembed-int8-model-v1

      - name: Cache LadybugDB native library (Windows)
        uses: actions/cache@v4
        with:
          path: C:\cache\lbug
          key: liblbug-windows-v0.13.1

      - name: Build (Windows native)
        run: |
          make build-windows-native \
            SKIP_GRAMMARS=1 \
            SKIP_ANTLR_GRAMMARS=1 \
            VERSION="${{ github.ref_name }}" \
            BRAND="graphit" \
            DISPLAY_NAME="Graphit Code: AI Harness for Collaborative and Progressive Knowledge" \
            GITHUB_REPO="graphit-labs/graphit-code" \
            DEFAULT_HUB_REPO="git@github.com:graphit-labs/graphit-code.git" \
            LBUG_PLATFORMS="windows" \
            ORT_CACHE="/c/cache/ort" \
            MODEL_CACHE="/c/cache/model" \
            LBUG_CACHE="/c/cache/lbug"

      - name: Generate SHA-256 checksum
        run: |
          cd .build
          sha256sum graphit-windows-amd64.exe > graphit-windows-amd64.exe.sha256

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-amd64
          path: |
            .build/graphit-windows-amd64.exe
            .build/graphit-windows-amd64.exe.sha256
          retention-days: 1

  # ── Publish Release ────────────────────────────────────────────────────────
  publish:
    name: Publish GitHub Release
    needs: [build-linux, build-darwin, build-windows]
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist/

      - name: Flatten artifact directories
        run: |
          mkdir -p release-assets
          find dist/ -type f -not -name '*.wasm' -exec cp {} release-assets/ \;
          ls -la release-assets/

      - name: Generate combined checksums file
        run: |
          cd release-assets
          cat *.sha256 > checksums.sha256
          echo "=== checksums.sha256 ==="
          cat checksums.sha256

      - name: Extract changelog for this tag
        id: changelog
        run: |
          TAG="${{ github.ref_name }}"
          PREV_TAG=$(git tag --sort=-version:refname | grep -v "^${TAG}$" | head -1)
          if [ -n "$PREV_TAG" ]; then
            CHANGES=$(git log --pretty=format:"- %s (%h)" "${PREV_TAG}..HEAD" -- 2>/dev/null || echo "")
          else
            CHANGES=$(git log --pretty=format:"- %s (%h)" 2>/dev/null | head -20 || echo "")
          fi
          echo "changes<<EOF" >> "$GITHUB_OUTPUT"
          echo "$CHANGES" >> "$GITHUB_OUTPUT"
          echo "EOF" >> "$GITHUB_OUTPUT"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Graphit Code ${{ github.ref_name }}"
          body: |
            ## What's Changed

            ${{ steps.changelog.outputs.changes }}

            ## Installation

            ### Linux (amd64)
            ```bash
            curl -fsSL https://github.com/graphit-labs/graphit-code/releases/download/${{ github.ref_name }}/graphit-linux-amd64 -o graphit
            chmod +x graphit
            sudo mv graphit /usr/local/bin/
            ```

            ### macOS (Apple Silicon)
            ```bash
            curl -fsSL https://github.com/graphit-labs/graphit-code/releases/download/${{ github.ref_name }}/graphit-darwin-arm64 -o graphit
            chmod +x graphit
            sudo mv graphit /usr/local/bin/
            ```

            ### Windows (amd64)
            Download `graphit-windows-amd64.exe` and add to your PATH.

            ### Verify integrity
            ```bash
            sha256sum -c checksums.sha256
            ```

            ## Self-update
            If you already have `graphit` installed:
            ```bash
            graphit self-update
            ```
          files: |
            release-assets/graphit-linux-amd64
            release-assets/graphit-linux-amd64.sha256
            release-assets/graphit-darwin-arm64
            release-assets/graphit-darwin-arm64.sha256
            release-assets/graphit-windows-amd64.exe
            release-assets/graphit-windows-amd64.exe.sha256
            release-assets/checksums.sha256
          fail_on_unmatched_files: true
          make_latest: true
          generate_release_notes: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
