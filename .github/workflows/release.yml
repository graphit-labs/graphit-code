name: Release

on:
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform == 'linux-amd64' && 'ubuntu-22.04' || matrix.platform == 'darwin-arm64' && 'macos-15' || 'windows-2022' }}
    defaults:
      run:
        working-directory: graphit-code
    env:
      GRAPHIT_BROKER_REF: ${{ vars.GRAPHIT_BROKER_REF }}
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "0"
      CARGO_PROFILE_TEST_DEBUG: "0"
    strategy:
      fail-fast: false
      matrix:
        platform: [linux-amd64, darwin-arm64, windows-amd64]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          path: graphit-code
      - name: Require explicit Broker source ref
        shell: bash
        run: |
          if [ -z "$GRAPHIT_BROKER_REF" ]; then
            echo "Set repository variable GRAPHIT_BROKER_REF to the Broker source ref paired with this Code revision." >&2
            exit 1
          fi
      - name: Checkout Broker wire producer
        uses: actions/checkout@v4
        with:
          repository: graphit-labs/graphit-broker
          ref: ${{ env.GRAPHIT_BROKER_REF }}
          path: graphit-broker
          persist-credentials: false
          token: ${{ secrets.GRAPHIT_BROKER_READ_TOKEN || github.token }}
      - name: Record paired Broker revision
        run: git -C ../graphit-broker rev-parse --verify HEAD
      - name: Install pinned Rust toolchain
        run: rustup show active-toolchain
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: graphit-code/ui/package-lock.json
      - name: Install current Git on Linux (native hooks/reftable required)
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:git-core/ppa
          sudo apt-get update
          sudo apt-get install --yes git
      - name: Install current Git on macOS (native hooks/reftable required)
        if: runner.os == 'macOS'
        run: |
          brew install git
          echo "$(brew --prefix git)/bin" >> "$GITHUB_PATH"
      - name: Install current Git on Windows (native hooks/reftable required)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          choco upgrade git --yes --no-progress
          "${env:ProgramFiles}\Git\cmd" | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append
          git config --global core.longpaths true
      - name: Verify Git native hooks and shell on PATH (2.54+)
        run: |
          git --version
          git var GIT_SHELL_PATH
          git -c hook.graphit-ci-native.event=pre-commit -c hook.graphit-ci-native.command='exit 0' hook run pre-commit
      - name: Install Linux native build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo add-apt-repository --yes ppa:ubuntu-toolchain-r/test
          sudo apt-get update
          sudo apt-get install --yes build-essential gcc-13 g++-13 cmake clang llvm libclang-dev libssl-dev pkg-config protobuf-compiler libprotobuf-dev patchelf
          echo "CC=gcc-13" >> "$GITHUB_ENV"
          echo "CXX=g++-13" >> "$GITHUB_ENV"
      - name: Install macOS native build dependencies
        if: runner.os == 'macOS'
        run: |
          brew install cmake openssl@3 protobuf pkg-config llvm
          {
            echo "OPENSSL_DIR=$(brew --prefix openssl@3)"
            echo "LIBCLANG_PATH=$(brew --prefix llvm)/lib"
            echo "RUSTFLAGS=${RUSTFLAGS:+$RUSTFLAGS }-C link-arg=-Wl,-headerpad_max_install_names"
          } >> "$GITHUB_ENV"
      - name: Install Windows native build dependencies
        if: runner.os == 'Windows'
        shell: pwsh
        run: choco install protoc unzip llvm --yes --no-progress
      - name: Capture Windows compiler and redistributable runtime
        if: runner.os == 'Windows'
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64
          vsversion: '2022'
      - name: Build UI shipped with Rust
        run: |
          npm --prefix ui ci
          node scripts/build-rust-ui.mjs
      - name: Install Windows OpenSSL
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          & "$env:VCPKG_INSTALLATION_ROOT/vcpkg.exe" install openssl:x64-windows pkgconf:x64-windows
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          "OPENSSL_DIR=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows" >> $env:GITHUB_ENV
          "LIBCLANG_PATH=C:/Program Files/LLVM/bin" >> $env:GITHUB_ENV
          "$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/bin" >> $env:GITHUB_PATH
          "PKG_CONFIG=$env:VCPKG_INSTALLATION_ROOT/installed/x64-windows/tools/pkgconf/pkgconf.exe" >> $env:GITHUB_ENV
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Build owned Broker Hub storage fixture
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo build --locked --manifest-path ../graphit-broker/Cargo.toml -p broker-presence --example hub_storage_fixture --target-dir target
          fixture_bin="$PWD/target/debug/examples/hub_storage_fixture"
          test -f "$fixture_bin"
          test -x "$fixture_bin"
          echo "GRAPHIT_BROKER_HUB_STORAGE_FIXTURE_BIN=$fixture_bin" >> "$GITHUB_ENV"
      - name: Build model-server executable for Linux contract tests
        if: runner.os == 'Linux'
        shell: bash
        run: |
          cargo xtask cargo build --locked -p graphit-daemon --bin graphit-model-server
          model_server="$PWD/target/debug/graphit-model-server"
          test -s "$model_server"
          test -x "$model_server"
          echo "GRAPHIT_TEST_MODEL_SERVER=$model_server" >> "$GITHUB_ENV"
      - name: Prepare pinned embedding GGUF for the Linux native NN gate
        if: runner.os == 'Linux'
        shell: bash
        env:
          EMBEDDING_MODEL_URL: https://huggingface.co/ggml-org/embeddinggemma-2-GGUF/resolve/bfcd298762cc34d0357ece5ebdd31791a3a374d8/embeddinggemma-2-BF16.gguf
          EMBEDDING_MODEL_SHA256: 68bae29d62fb8c7d23e98d21fd4662753ddd636e6b62b8a70dfe059a9844f216
          EMBEDDING_MODEL_BYTES: '557950176'
        run: |
          model_file="$RUNNER_TEMP/embeddinggemma-2-BF16.gguf"
          curl --fail --location --show-error --silent "$EMBEDDING_MODEL_URL" --output "$model_file"
          printf '%s  %s\n' "$EMBEDDING_MODEL_SHA256" "$model_file" | sha256sum --check
          test "$(wc -c < "$model_file")" -eq "$EMBEDDING_MODEL_BYTES"
          echo "GRAPHIT_EMBEDDINGGEMMA2_MODEL=$model_file" >> "$GITHUB_ENV"
      - name: Check Rust contracts and quality
        run: cargo xtask gate
      - name: Install CUDA build toolchain for the Cargo backend
        if: runner.os == 'Linux'
        uses: Jimver/cuda-toolkit@21aaab8dcb4e9329ae86f60cf6586a9ef3effbea # v0.2.32
        with:
          cuda: '12.9.1'
          method: network
          sub-packages: '["nvcc", "cudart-dev", "cccl"]'
          non-cuda-sub-packages: '["libcublas-dev"]'
      - name: Configure portable CUDA compilation
        if: runner.os == 'Linux'
        run: |
          {
            echo "CMAKE_CUDA_HOST_COMPILER=$(command -v g++-13)"
            echo 'CMAKE_CUDA_ARCHITECTURES=75-real;80-real;86-real;89-real;90-virtual'
          } >> "$GITHUB_ENV"
      - name: Build Rust executables on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          GRAPHIT_BUILD_VERSION: ${{ github.ref_name }}
        run: |
          mkdir -p .build
          features=()
          if [ "$RUNNER_OS" = Linux ]; then features=(--features graphit-app/cuda); fi
          cargo xtask cargo build --locked --release -p graphit-app -p graphit-daemon --bin graphit --bin graphit-model-server "${features[@]}" --message-format=json-render-diagnostics > .build/release-artifacts.jsonl
      - name: Build Rust executables with the Windows compiler environment
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          GRAPHIT_BUILD_VERSION: ${{ github.ref_name }}
        run: |
          New-Item -ItemType Directory -Force .build | Out-Null
          cargo xtask cargo build --locked --release -p graphit-app -p graphit-daemon --bin graphit --bin graphit-model-server --message-format=json-render-diagnostics > .build/release-artifacts.jsonl
          if ($LASTEXITCODE -ne 0) { throw 'Windows Release build failed' }
      - name: Package executables and native runtime
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: scripts/package-release.sh "$NATIVE_PLATFORM" .build/release-artifacts.jsonl .build/dist
      - name: Install complete local package on Unix
        if: runner.os != 'Windows'
        shell: bash
        env:
          NATIVE_PLATFORM: ${{ matrix.platform }}
        run: |
          sh install.sh --archive ".build/dist/graphit-$NATIVE_PLATFORM.tar.gz" --dir "$RUNNER_TEMP/graphit-install"
          test -x "$RUNNER_TEMP/graphit-install/graphit-model-server"
          test -s "$RUNNER_TEMP/graphit-install/graphit-runtime/build.json"
          cd "$RUNNER_TEMP"
          env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin "$RUNNER_TEMP/graphit-install/graphit" --version
          set +e
          env -i HOME="$RUNNER_TEMP" PATH=/usr/bin:/bin "$RUNNER_TEMP/graphit-install/graphit-model-server" > model-startup.log 2>&1
          status=$?
          set -e
          test "$status" -eq 1
          grep -F 'model child startup/service failed: InvalidInput' model-startup.log
      - name: Install complete local package on Windows
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          ./install.ps1 -Archive .build/dist/graphit-windows-amd64.tar.gz -Dir "$env:RUNNER_TEMP/graphit-install"
          Set-Location $env:RUNNER_TEMP
          $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
          Remove-Item Env:OPENSSL_DIR, Env:OPENSSL_LIB_DIR, Env:CMAKE_PREFIX_PATH, Env:PKG_CONFIG_PATH -ErrorAction SilentlyContinue
          & "$env:RUNNER_TEMP/graphit-install/graphit.exe" --version
          if ($LASTEXITCODE -ne 0) { throw 'Installed Graphit failed to start' }
          foreach ($file in @('graphit-model-server.exe', 'graphit-runtime/build.json')) {
            if (-not (Test-Path "$env:RUNNER_TEMP/graphit-install/$file" -PathType Leaf)) { throw "Missing installed $file" }
          }
          $startup = & "$env:RUNNER_TEMP/graphit-install/graphit-model-server.exe" 2>&1 | Out-String
          if ($LASTEXITCODE -ne 1 -or $startup -notlike '*model child startup/service failed: InvalidInput*') {
            throw "Packaged model-server did not reach its entrypoint: $startup"
          }
          $global:LASTEXITCODE = 0
      - name: Exercise the installed model-server on native Windows and macOS
        if: runner.os != 'Linux'
        shell: bash
        run: |
          suffix=''
          if [ "$RUNNER_OS" = Windows ]; then suffix='.exe'; fi
          export GRAPHIT_TEST_MODEL_SERVER="$RUNNER_TEMP/graphit-install/graphit-model-server$suffix"
          for consumer in \
            native_bootstrap_and_missing_auth_fail_without_ready_or_secret_output \
            cold_child_reports_model_errors_on_demand_and_pre_cancelled_start_has_no_child \
            actual_child_completion_is_cancel_safe_and_retains_the_same_exit; do
            cargo xtask cargo test --locked --release -p graphit-daemon --test model_child "$consumer" -- --exact
          done
      - name: Upload complete release artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.platform }}
          path: |
            graphit-code/.build/dist/*.tar.gz
            graphit-code/.build/dist/*.tar.gz.sha256
          retention-days: 1

  packaging-contracts:
    name: Native packaging contracts
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check affected shell scripts and package contracts
        run: |
          shellcheck -x install.sh scripts/package-release.sh scripts/graphit-entrypoint.sh
          node scripts/test-native-packaging.mjs
          node scripts/test-package-platform-runtime.mjs

  publish:
    name: Publish GitHub Release
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [build, packaging-contracts]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: "*-amd64"
          path: release-assets
          merge-multiple: true
      - name: Download macOS release artifact
        uses: actions/download-artifact@v8
        with:
          name: darwin-arm64
          path: release-assets
      - name: Verify and combine artifact checksums
        working-directory: release-assets
        run: |
          cat ./*.tar.gz.sha256 > checksums.sha256
          sha256sum --check checksums.sha256
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          name: "Graphit Code ${{ github.ref_name }}"
          generate_release_notes: true
          body: |
            Each archive contains graphit, graphit-model-server and graphit-runtime.
            Keep the complete extracted package, including Windows app-local DLLs.
            The native runtime includes its upstream license, notices and provenance.

            Install Linux/macOS:
            ```sh
            curl -fsSL https://raw.githubusercontent.com/graphit-labs/graphit-code/main/install.sh | sh
            ```

            Install Windows (PowerShell):
            ```powershell
            irm https://raw.githubusercontent.com/graphit-labs/graphit-code/main/install.ps1 | iex
            ```

            Verify downloaded archives with checksums.sha256.
            Linux packages the optional Cargo-built CUDA engine and redistributable runtime with relative loader paths.
            CPU remains the default. CUDA requires a compatible NVIDIA host driver.
            See graphit-runtime/NATIVE-RUNTIME.md for model execution configuration.
          files: |
            release-assets/*.tar.gz
            release-assets/*.sha256
          fail_on_unmatched_files: true
          make_latest: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  publish-image:
    name: Publish Docker image (linux-amd64)
    needs: [publish]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download Linux artifact
        uses: actions/download-artifact@v8
        with:
          name: linux-amd64
          path: dist
      - name: Prepare complete Docker build context
        run: |
          (cd dist && sha256sum --check graphit-linux-amd64.tar.gz.sha256)
          mkdir -p .build/release
          tar -xzf dist/graphit-linux-amd64.tar.gz -C .build/release
          test -x .build/release/graphit-linux-amd64/graphit
          test -x .build/release/graphit-linux-amd64/graphit-model-server
          test -f .build/release/graphit-linux-amd64/graphit-runtime/build.json
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Generate Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository }}
          flavor: latest=false
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=semver,pattern={{major}}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ github.ref_name }}
      - name: Build image for native lifecycle validation
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          push: false
          tags: graphit-code:release-validation
      - name: Validate native container startup, access and shutdown
        run: |
          name="graphit-release-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          volume="$name-state"
          cleanup() {
            docker rm --force "$name" >/dev/null 2>&1 || true
            docker volume rm "$volume" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker volume create "$volume"
          docker run -d --name "$name" --health-interval=1s --health-start-interval=1s \
            --health-start-period=5s -p 127.0.0.1::8081 \
            -v "$volume:/home/graphit/.graphit" graphit-code:release-validation
          for phase in first restart; do
            if [ "$phase" = restart ]; then docker start "$name"; fi
            healthy=false
            for _attempt in $(seq 1 30); do
              if [ "$(docker container inspect --format '{{.State.Health.Status}}' "$name")" = healthy ]; then
                healthy=true
                break
              fi
              if [ "$(docker container inspect --format '{{.State.Running}}' "$name")" != true ]; then break; fi
              sleep 1
            done
            if [ "$healthy" != true ]; then docker logs "$name"; exit 1; fi
            test "$(docker exec "$name" id -u)" = 10001
            docker exec "$name" graphit --non-interactive daemon status >/dev/null
            published=$(docker port "$name" 8081/tcp)
            status=$(curl --silent --show-error --connect-timeout 5 --max-time 10 --output /dev/null --write-out '%{http_code}' \
              --header 'Content-Type: application/json' --header 'X-Graphit-Auth-Origin: runtime' \
              --data '{"operation":"status"}' "http://$published/admin/daemon")
            case "$status" in 401|403) ;; *) echo "Unauthenticated admin access returned $status" >&2; exit 1 ;; esac
            docker stop --time 15 "$name"
            code=$(docker container inspect --format '{{.State.ExitCode}}' "$name")
            case "$code" in 0|130) ;; *) docker logs "$name"; exit 1 ;; esac
          done
      - name: Build and publish Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
