[package]
name = "graphit-fs"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix = { workspace = true, features = ["fs"] }
sha2.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
libc = { version = "=0.2.190", default-features = false, features = ["extra_traits"] }
errno = { version = "=0.3.14", default-features = false }

[target.'cfg(windows)'.dependencies]
sha2.workspace = true
windows-sys = { version = "=0.61.2", default-features = false, features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Ioctl"] }
renamore = { version = "=0.3.2", default-features = false, features = ["always-supported"] }
windows-permissions = { version = "=0.2.4", default-features = false }
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel", "advapi"] }
winapi-util = { version = "=0.1.11", default-features = false }

[dev-dependencies]
tempfile.workspace = true
sha2.workspace = true

# Exact private SDK calls and handle adoption are checked by xtask's AST allowlist.
[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
