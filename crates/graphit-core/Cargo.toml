[package]
name = "graphit-core"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
test-util = []
auth-test-support = []
async-cancel = ["dep:tokio"]

[dependencies]
tokio = { version = "=1.53.2", default-features = false, features = ["sync"], optional = true }
graphit-fs = { path = "../graphit-fs" }
tracing.workspace = true
anstyle.workspace = true
unicode-width.workspace = true
unicode-segmentation.workspace = true
base64.workspace = true
getrandom.workspace = true
ignore.workspace = true
walkdir.workspace = true
regex.workspace = true
serde.workspace = true
serde_json.workspace = true
secrecy.workspace = true
sha2.workspace = true
tempfile.workspace = true
ulid.workspace = true
toon-format.workspace = true

[target.'cfg(any(target_os = "linux", target_os = "macos"))'.dependencies]
rustix.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
ioprio.workspace = true

[target.'cfg(windows)'.dependencies]
dunce = "=1.0.5"
winsafe.workspace = true
winapi-util = { version = "=0.1.11", default-features = false }
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }

[lints.rust]
unsafe_code = "deny"
unsafe_op_in_unsafe_fn = "forbid"

[lints.clippy]
undocumented_unsafe_blocks = "deny"
