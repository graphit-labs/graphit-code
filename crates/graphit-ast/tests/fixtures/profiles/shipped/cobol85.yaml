antlr_contexts:
  - {"pattern": "//programUnit", "label": "Program"}
  - {"pattern": "//procedureSection", "label": "Section"}
  - {"pattern": "//procedureDeclarative", "label": "Section"}
  - {"pattern": "//paragraph", "label": "Paragraph"}
  - {"pattern": "//fileDescriptionEntry", "label": "FileDescription"}
  - {"pattern": "//workingStorageSection", "label": "Program"}
  - {"pattern": "//linkageSection", "label": "Program"}
  - {"pattern": "//localStorageSection", "label": "Program"}
  - {"pattern": "//communicationSection", "label": "Program"}
  - {"pattern": "//screenSection", "label": "Program"}
  - {"pattern": "//reportSection", "label": "Program"}
  - {"pattern": "//dataBaseSection", "label": "Program"}
  - {"pattern": "//programLibrarySection", "label": "Program"}

comment_types:
