

language: vue
grammar: tree-sitter-vue
extensions: [".vue"]

queries:

  - data_key: elements
    graph_label: Element
    pattern: '[ (element (start_tag (tag_name) @name)) @unit (script_element (start_tag (tag_name) @name)) @unit (style_element (start_tag (tag_name) @name)) @unit (template_element (start_tag (tag_name) @name)) @unit ]'
    span_capture: unit
  - data_key: elements
    graph_label: Element
    pattern: '(self_closing_tag (tag_name) @name) @unit'
    span_capture: unit

  - data_key: attributes
    graph_label: Attribute
    pattern: '(start_tag (tag_name) @element (attribute (attribute_name) @name (quoted_attribute_value (attribute_value) @value)) @unit)'
    span_capture: unit
    name_is_data: true
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: AttributeValue
  - data_key: attributes
    graph_label: Attribute
    pattern: '(self_closing_tag (tag_name) @element (attribute (attribute_name) @name (quoted_attribute_value (attribute_value) @value)) @unit)'
    span_capture: unit
    name_is_data: true
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: AttributeValue

