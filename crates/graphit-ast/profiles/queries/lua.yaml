language: lua
grammar: tree-sitter-lua
extensions: [".lua"]

target_rules:
  CALLS: { labels: [Function] }
queries:

  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration name: (identifier) @name) @unit'
    span_capture: unit
    declaration_capture: unit
  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration name: (dot_index_expression field: (identifier) @name)) @unit'
    span_capture: unit
    declaration_capture: unit
  - data_key: variables
    graph_label: Variable
    pattern: '(assignment_statement (variable_list name: (identifier) @name)) @unit'
    span_capture: unit
    declaration_capture: unit
    name_is_data: true

  - data_key: variables
    graph_label: Variable
    pattern: '(assignment_statement (variable_list name: (identifier) @name) (expression_list value: [(number) (string) (true) (false) (nil)] @value)) @unit'
    span_capture: unit
    declaration_capture: unit
    name_is_data: true
    value_capture: value
    value_label: Value
  - data_key: parameters
    graph_label: Parameter
    pattern: '[ (parameters . (identifier) @name @unit) (parameters (identifier) . (identifier) @name @unit) (parameters (vararg_expression) . (identifier) @name) ]'
    span_capture: unit
  - data_key: fields
    graph_label: Field
    pattern: '(field (identifier) @name) @unit'
    span_capture: unit
    name_is_data: true
  - data_key: fields
    graph_label: Field
    pattern: '(field name: (identifier) @name value: [(number) (string) (true) (false) (nil)] @value) @unit'
    span_capture: unit
    name_is_data: true
    value_capture: value
    value_label: Value

  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(function_call (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(function_call (identifier) @name)'

exports:
  strategy: none

self_keywords: ["self."]

context_types:
  function_declaration: Function

anon_func_types:
  - function_definition

declaration_types:
  - function_declaration
  - variable_declaration
  - assignment_statement

comment_types:
  - comment

complexity:
  node_types:
    - if_statement
    - elseif_statement
    - for_statement
    - while_statement
  operators: ["and", "or"]

embed_labels:
  - Function
  - Field
  - Variable
  - Comment
