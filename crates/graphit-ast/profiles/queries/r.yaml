language: r
grammar: tree-sitter-r
extensions: [".r", ".R", ".Rmd"]

target_rules:
  CALLS: { labels: [Function] }
queries:

  - data_key: functions
    graph_label: Function
    pattern: '[ (binary_operator lhs: (identifier) @name operator: ["<-" "<<-" ":=" "="] rhs: (function_definition) @context) @unit (binary_operator lhs: (function_definition) @context operator: ["->" "->>"] rhs: (identifier) @name) @unit ]'
    span_capture: unit
    declaration_capture: unit
    context_capture: context
  - data_key: variables
    graph_label: Variable
    pattern: '[ (binary_operator lhs: (identifier) @name operator: ["<-" "<<-" ":=" "="]) @unit (binary_operator operator: ["->" "->>"] rhs: (identifier) @name) @unit ]'
    span_capture: unit
    declaration_capture: unit
    name_is_data: true

  - data_key: variables
    graph_label: Variable
    pattern: '[ (binary_operator lhs: (identifier) @name operator: ["<-" "<<-" ":=" "="] rhs: [(float) (integer) (complex) (string) (true) (false) (null) (na) (inf) (nan)] @value) @unit (binary_operator lhs: [(float) (integer) (complex) (string) (true) (false) (null) (na) (inf) (nan)] @value operator: ["->" "->>"] rhs: (identifier) @name) @unit ]'
    span_capture: unit
    declaration_capture: unit
    name_is_data: true
    value_capture: value
    value_label: Value

  - data_key: parameters
    graph_label: Parameter
    pattern: '[ (binary_operator lhs: (identifier) @parent operator: ["<-" "<<-" ":=" "="] rhs: (function_definition (parameters (parameter (identifier) @name) @unit))) (binary_operator lhs: (function_definition (parameters (parameter (identifier) @name) @unit)) operator: ["->" "->>"] rhs: (identifier) @parent) ]'
    span_capture: unit
    name_is_data: true
    parent_capture: parent
    parent_label: Function

  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameters (parameter (identifier) @name) @unit)'
    span_capture: unit
    name_is_data: true

  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call (namespace_operator (identifier) @name))'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(extract_operator (identifier) @name)'
  - data_key: import_refs
    type: relation
    relation_type: IMPORTS
    pattern: '(call function: (identifier) @_fn arguments: (arguments (argument value: (string) @name)))'

exports:
  strategy: none

self_keywords: []

context_types: {}

context_name_queries: {}

anon_func_types:
  - function_definition

declaration_types:
  - binary_operator

comment_types:
  - comment

complexity:
  node_types:
    - if_statement
    - for_statement
    - while_statement
  operators: ["&&", "||"]

embed_labels:
  - Function
  - Variable
  - Comment
