language: hcl
grammar: tree-sitter-hcl
extensions: [".tf", ".hcl", ".tfvars"]
queries:

  - data_key: resources
    graph_label: Resource
    pattern: '(block (identifier) @_type (string_lit (template_literal) @_rtype) (string_lit (template_literal) @name) (#eq? @_type "resource")) @unit'
    span_capture: unit
    declaration_capture: unit
  - data_key: data_sources
    graph_label: Data
    pattern: '(block (identifier) @_type (string_lit (template_literal) @_dtype) (string_lit (template_literal) @name) (#eq? @_type "data")) @unit'
    span_capture: unit
    declaration_capture: unit
  - data_key: variables
    graph_label: Variable
    pattern: '(block (identifier) @_type (string_lit (template_literal) @name) (#eq? @_type "variable")) @unit'
    span_capture: unit
    declaration_capture: unit
  - data_key: outputs
    graph_label: Output
    pattern: '(block (identifier) @_type (string_lit (template_literal) @name) (#eq? @_type "output")) @unit'
    span_capture: unit
    declaration_capture: unit
  - data_key: modules
    graph_label: Module
    pattern: '(block (identifier) @_type (string_lit (template_literal) @name) (#eq? @_type "module")) @unit'
    span_capture: unit
    declaration_capture: unit
  - data_key: providers
    graph_label: Provider
    pattern: '(block (identifier) @_type (string_lit (template_literal) @name) (#eq? @_type "provider")) @unit'
    span_capture: unit
    declaration_capture: unit
  - data_key: locals
    graph_label: Local
    pattern: '(block (identifier) @name (#eq? @name "locals")) @unit'
    span_capture: unit
    declaration_capture: unit

  - data_key: attributes
    graph_label: Attribute
    pattern: '(attribute (identifier) @name (expression (literal_value (string_lit (template_literal) @value)))) @unit'
    span_capture: unit
    name_is_data: true
    value_capture: value
    value_label: Value
  - data_key: attributes
    graph_label: Attribute
    pattern: '(attribute (identifier) @name (expression (literal_value [(numeric_lit) (bool_lit)] @value))) @unit'
    span_capture: unit
    name_is_data: true
    value_capture: value
    value_label: Value

  - data_key: attributes
    graph_label: Attribute
    pattern: '(attribute (identifier) @name (expression (template_expr (heredoc_template (template_literal) @value)))) @unit'
    span_capture: unit
    name_is_data: true
    value_capture: value
    value_label: Value

  - data_key: attributes
    graph_label: Attribute
    pattern: '(attribute (identifier) @name) @unit'
    span_capture: unit
    name_is_data: true

  - data_key: tuple_items
    graph_label: Value
    pattern: '(attribute (identifier) @parent (expression (collection_value (tuple (expression (literal_value [(numeric_lit) (bool_lit)] @name))))))'
    span_capture: name
    name_is_data: true
    parent_capture: parent
    parent_label: Attribute
  - data_key: tuple_items
    graph_label: Value
    pattern: '(attribute (identifier) @parent (expression (collection_value (tuple (expression (literal_value (string_lit (template_literal) @name) @unit))))))'
    span_capture: unit
    name_is_data: true
    parent_capture: parent
    parent_label: Attribute
  - data_key: object_elems
    graph_label: Attribute
    pattern: '(attribute (identifier) @parent (expression (collection_value (object (object_elem key: (expression (variable_expr (identifier) @name)) val: (expression (literal_value [(numeric_lit) (bool_lit)] @value))) @unit))))'
    span_capture: unit
    name_is_data: true
    parent_capture: parent
    parent_label: Attribute
    value_capture: value
    value_label: Value
  - data_key: object_elems
    graph_label: Attribute
    pattern: '(attribute (identifier) @parent (expression (collection_value (object (object_elem key: (expression (variable_expr (identifier) @name)) val: (expression (literal_value (string_lit (template_literal) @value)))) @unit))))'
    span_capture: unit
    name_is_data: true
    parent_capture: parent
    parent_label: Attribute
    value_capture: value
    value_label: Value

exports:
  strategy: none

self_keywords: []

context_types:
  block: Resource

context_name_queries:
  block: |-
    (block . (identifier) . (string_lit) . (string_lit (template_literal) @name)) @context
    (block . (identifier) . (string_lit (template_literal) @name)) @context

anon_func_types: []

declaration_types:
  - block

comment_types:
  - comment

complexity:
  node_types:
    - for_expr
    - conditional

embed_labels:
  - Resource
  - Data
  - Module
  - Provider
  - Variable
  - Output
  - Local
  - Comment
