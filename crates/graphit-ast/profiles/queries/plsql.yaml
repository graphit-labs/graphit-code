  - data_key: fk_references
    graph_label: ""
    pattern: "//references_clause/tableview_name"
    type: relation
    relation_type: REFERENCES

  - data_key: comments
    graph_label: Comment
    pattern: "//comment_on_column/quoted_string"
    type: entity

  - data_key: comments
    graph_label: Comment
    pattern: "//comment_on_table/quoted_string"
    type: entity

  - data_key: comments
    graph_label: Comment
    pattern: "//comment_on_materialized/quoted_string"
    type: entity

  - data_key: comment_refs
    graph_label: ""
    pattern: "//comment_on_column/column_name"
    type: relation
    relation_type: REFERENCES

  - data_key: comment_refs
    graph_label: ""
    pattern: "//comment_on_table/tableview_name"
    type: relation
    relation_type: REFERENCES

  - data_key: comment_refs
    graph_label: ""
    pattern: "//comment_on_materialized/tableview_name"
    type: relation
    relation_type: REFERENCES

  - data_key: calls
    graph_label: ""
    pattern: "//call_statement/routine_name"
    type: relation
    relation_type: CALLS
    name_reject: '(?i)^(begin|declare|end|if|elsif|then|else|case|when|loop|while|for|exit|continue|goto|return|null|procedure|function|package|body|exception|raise|commit|rollback|savepoint|set|select|insert|update|delete|merge|values|into|from|where|and|or|not|is|as|declare|cursor|record|type|subtype|constant|pragma|open|close|fetch|forall|bulk|using|out|in)$'
    captures: {"qualifier": [{"nearest_ancestor": "call_statement"}]}

  - data_key: calls
    graph_label: ""
    pattern: "//general_element_part"
    type: relation
    relation_type: CALLS
    name_reject: '(?i)^(begin|declare|end|if|elsif|then|else|case|when|loop|while|for|exit|continue|goto|return|null|procedure|function|package|body|exception|raise|commit|rollback|savepoint|set|select|insert|update|delete|merge|values|into|from|where|and|or|not|is|as|declare|cursor|record|type|subtype|constant|pragma|open|close|fetch|forall|bulk|using|out|in)$'
    child_rule: "function_argument"
    captures: {"name": [{"xpath": "/id_expression"}], "qualifier": [{"nearest_ancestor": "general_element"}]}

