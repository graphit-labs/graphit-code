

language: plsql
parser: antlr4
grammar: antlr-plsql
start_rule: sql_script
extensions: [".sql", ".pks", ".pkb", ".pls", ".plb", ".prc", ".fnc", ".trg", ".typ", ".bdy", ".spc", ".vw"]
exclusive: true

target_rules:
  CALLS: { labels: [Function, Procedure, Package] }
  SELECTS: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  INSERTS: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  UPDATES: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  DELETES: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  ALTERS: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  DROPS: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  CREATES: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  TRUNCATES: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  REFERENCES: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }

  READS_COLUMN: { labels: [Column], fallback: Column }
  WRITES_COLUMN: { labels: [Column], fallback: Column }
queries:

  - data_key: functions
    graph_label: Function
    pattern: "//create_function_body/function_name"
    type: entity

  - data_key: functions
    graph_label: Function
    pattern: "//function_body/identifier"
    type: entity

  - data_key: functions
    graph_label: Function
    pattern: "//function_spec/identifier"
    type: entity

  - data_key: procedures
    graph_label: Procedure
    pattern: "//create_procedure_body/procedure_name"
    type: entity

  - data_key: procedures
    graph_label: Procedure
    pattern: "//procedure_body/identifier"
    type: entity

  - data_key: procedures
    graph_label: Procedure
    pattern: "//procedure_spec/identifier"
    type: entity

  - data_key: packages
    graph_label: Package
    pattern: "//create_package/package_name"
    type: entity

  - data_key: packages
    graph_label: Package
    pattern: "//create_package_body/package_name"
    type: entity

  - data_key: types
    graph_label: Type
    pattern: "//create_type/type_definition/type_name"
    type: entity

  - data_key: types
    graph_label: Type
    pattern: "//create_type/type_body/type_name"
    type: entity

  - data_key: types
    graph_label: Type
    pattern: "//subtype_declaration/identifier"
    type: entity

  - data_key: triggers
    graph_label: Trigger
    pattern: "//create_trigger/trigger_name"
    type: entity

  - data_key: trigger_tables
    graph_label: ""
    pattern: "//create_trigger/tableview_name"
    type: relation
    relation_type: REFERENCES

  - data_key: tables
    graph_label: Table
    pattern: "//create_table/table_name"
    type: entity

  - data_key: views
    graph_label: View
    pattern: "//create_view/id_expression"
    type: entity

  - data_key: mviews
    graph_label: MaterializedView
    pattern: "//create_materialized_view/tableview_name"
    type: entity

  - data_key: column_writes_update
    pattern: "//column_based_update_set_clause/column_name"
    type: relation
    relation_type: WRITES_COLUMN
    captures: {"qualifier": [{"nearest_ancestor": "update_statement"}, {"xpath": "/general_table_ref"}]}

  - data_key: column_writes_insert
    pattern: "//paren_column_list/column_list/column_name"
    type: relation
    relation_type: WRITES_COLUMN
    captures: {"qualifier": [{"nearest_ancestor": "insert_into_clause"}, {"xpath": "/general_table_ref"}]}

  - data_key: indexes
    graph_label: Index
    pattern: "//create_index"
    value_label: Value
    type: entity
    captures: {"name": [{"xpath": "/index_name"}], "value": [{"xpath": "/UNIQUE"}]}

  - data_key: index_table
    pattern: "//create_index/table_index_clause/tableview_name"
    type: relation
    relation_type: REFERENCES

  - data_key: columns
    graph_label: Column
    pattern: "//create_index/table_index_clause/index_expr/column_name"
    type: entity

  - data_key: sequences
    graph_label: Sequence
    pattern: "//create_sequence/sequence_name"
    type: entity

  - data_key: synonyms
    graph_label: Synonym
    pattern: "//create_synonym/synonym_name"
    type: entity

  - data_key: dblinks
    graph_label: DBLink
    pattern: "//create_database_link/link_name"
    type: entity

  - data_key: tablespaces
    graph_label: Tablespace
    pattern: "//create_tablespace"
    type: entity
    captures: {"name": [{"nearest_descendant": "id_expression"}]}

  - data_key: directories
    graph_label: Directory
    pattern: "//create_directory/directory_name"
    type: entity

  - data_key: columns
    graph_label: Column
    pattern: "//column_definition/column_name"
    type: entity

  - data_key: parameters
    graph_label: Parameter
    pattern: "//parameter/parameter_name"
    type: entity

  - data_key: variables
    graph_label: Variable
    pattern: "//variable_declaration"
    type: entity
    keyword: "CONSTANT"
    negate: true
    captures: {"name": [{"xpath": "/identifier"}]}

  - data_key: constants
    graph_label: Constant
    pattern: "//variable_declaration"
    type: entity
    keyword: "CONSTANT"
    captures: {"name": [{"xpath": "/identifier"}]}

  - data_key: columns
    graph_label: Column
    pattern: "//column_definition"
    value_label: Value
    type: entity
    captures: {"name": [{"xpath": "/column_name"}], "value": [{"xpath": "/expression"}]}
  - data_key: variables
    graph_label: Variable
    pattern: "//variable_declaration"
    value_label: Value
    type: entity
    keyword: "CONSTANT"
    negate: true
    captures: {"name": [{"xpath": "/identifier"}], "value": [{"xpath": "/default_value_part/expression"}]}
  - data_key: constants
    graph_label: Constant
    pattern: "//variable_declaration"
    value_label: Value
    type: entity
    keyword: "CONSTANT"
    captures: {"name": [{"xpath": "/identifier"}], "value": [{"xpath": "/default_value_part/expression"}]}

  - data_key: cursors
    graph_label: Cursor
    pattern: "//cursor_declaration/identifier"
    type: entity

  - data_key: exceptions
    graph_label: Exception
    pattern: "//exception_declaration/identifier"
    type: entity

  - data_key: types
    graph_label: Type
    pattern: "//type_declaration/identifier"
    type: entity




  - data_key: constraints
    graph_label: Constraint
    pattern: "//inline_constraint/constraint_name"
