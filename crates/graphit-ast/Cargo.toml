[package]
name = "graphit-ast"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
tempfile.workspace = true
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }
unicode-ident = "=1.0.26"
unicode-normalization = "=0.1.25"
swc_ecma_parser = { version = "=46.1.0", default-features = false, features = ["typescript", "unstable"] }
swc_common = { version = "=26.0.0", default-features = false }
swc_ecma_ast = { version = "=29.0.2", default-features = false }
syn = { version = "=2.0.119", default-features = false, features = ["full", "parsing"] }
protobuf.workspace = true
base64.workspace = true
scip.workspace = true
sqlparser = { version = "=0.63.0", default-features = false, features = ["std"] }
globset = "=0.4.20"
cxx = "=1.0.205"
lbug = { version = "=0.22.1", default-features = false }
tree-sitter.workspace = true
tree-sitter-language.workspace = true
tree-sitter-json = "=0.24.8"
tree-sitter-rust = "=0.24.2"
graphit-core = { path = "../graphit-core", features = ["async-cancel"] }
graphit-data = { path = "../graphit-data" }
graphit-auth = { path = "../graphit-auth" }
graphit-hub = { path = "../graphit-hub" }
graphit-fs = { path = "../graphit-fs" }
arrow-array = "=58.3.0"
arrow-schema = "=58.3.0"
arrow-select = "=58.3.0"
lance = { version = "=14.0.2", default-features = false }
futures = "=0.3.34"
serde_json.workspace = true
tokio = { workspace = true, features = ["rt", "time"] }
sha2.workspace = true
serde.workspace = true
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["deserialize"] }
regex = { version = "=1.13.1", default-features = false, features = ["std", "perf"] }

[build-dependencies]
cxx-build = "=1.0.205"
cmake = "=0.1.58"
cc = "=1.6.0"

[dev-dependencies]
parquet-graph-fixture = { package = "parquet", version = "=60.0.0", default-features = false, features = ["zstd"] }
tempfile.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "time"] }

[lints.rust]
unsafe_code = "deny"
