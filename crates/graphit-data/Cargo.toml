[package]
name = "graphit-data"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
autotests = false

[[test]]
name = "integration"
path = "tests/integration.rs"

[dependencies]
base64.workspace = true
arrow-schema = "=58.3.0"
arrow-array = "=58.3.0"
arrow-ipc = "=58.3.0"
arrow-schema-parquet = { package = "arrow-schema", version = "=60.0.0" }
arrow-array-parquet = { package = "arrow-array", version = "=60.0.0" }
lance = { version = "=14.0.2", default-features = false, features = ["aws"] }
lance-index = { version = "=14.0.2", default-features = false }
lance-table = { version = "=14.0.2", default-features = false }
lance-core = "=14.0.2"
lance-select = "=14.0.2"
lance-linalg = "=14.0.2"
lance-io = { version = "=14.0.2", default-features = false }
object_store = "=0.14.2"
async-trait = "=0.1.92"
futures = "=0.3.34"
url.workspace = true
ulid.workspace = true
tokio.workspace = true
tracing = { workspace = true, features = ["attributes"] }
tempfile.workspace = true
graphit-auth = { path = "../graphit-auth" }
graphit-core = { path = "../graphit-core", features = ["async-cancel"] }
graphit-fs = { path = "../graphit-fs" }
sha2.workspace = true
serde.workspace = true
serde_json.workspace = true
bytes = "=1.12.1"
parquet = { version = "=60.0.0", default-features = false, features = ["zstd", "async", "arrow"] }
polars-parquet-format = "=0.1.0"
rusqlite = { version = "=0.40.2", features = ["bundled", "hooks"] }

[dev-dependencies]
graphit-core = { path = "../graphit-core", features = ["test-util"] }
graphit-hub = { path = "../graphit-hub" }
tokio = { workspace = true, features = ["rt-multi-thread"] }
zstd = "=0.14.0"

[lints]
workspace = true
