[package]
name = "graphit-daemon"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
cuda = ["graphit-ai/cuda"]

[dependencies]
shell-escape = "=0.1.5"
broker-now-wire.workspace = true
graphit-process = { path = "../graphit-process" }
graphit-ai = { path = "../graphit-ai" }
graphit-auth = { path = "../graphit-auth" }
graphit-http = { path = "../graphit-http" }
graphit-data = { path = "../graphit-data" }
graphit-records = { path = "../graphit-records" }
graphit-hub = { path = "../graphit-hub" }
graphit-fs = { path = "../graphit-fs" }
which = "=8.0.6"
quick-xml = { version = "=0.42.0", default-features = false }
serde_json.workspace = true
url.workspace = true
http.workspace = true
tempfile.workspace = true
graphit-core = { path = "../graphit-core", features = ["async-cancel"] }
notify-debouncer-full = "=0.7.0"
tokio = { workspace = true, features = ["net", "io-std", "signal"] }
tracing = { workspace = true, features = ["attributes"] }
tokio-util = { workspace = true, features = ["codec"] }
futures = "=0.3.34"
serde.workspace = true
sha2.workspace = true
subtle.workspace = true
zeroize = "=1.9.1"
tarpc = { version = "=0.38.0", default-features = false, features = ["serde-transport-bincode"] }
bincode = "=1.3.3"

[dev-dependencies]
winsplit = "=0.1.0"
broker-presence.workspace = true
broker-control.workspace = true
broker-security.workspace = true
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio", "ws"] }
rcgen = { version = "=0.14.10", default-features = false, features = ["aws_lc_rs", "pem"] }
sqlx-core = { version = "=0.9.0", features = ["json", "_rt-tokio", "_tls-rustls-ring-webpki"], default-features = false }
sqlx-postgres = { version = "=0.9.0", features = ["json"], default-features = false }
aws-lc-rs = "=1.18.1"
base64.workspace = true
secrecy.workspace = true

[lints]
workspace = true
