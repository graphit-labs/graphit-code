[package]
name = "graphit-auth"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
graphit-core = { path = "../graphit-core", features = ["async-cancel"] }
graphit-hub = { path = "../graphit-hub" }
graphit-http = { path = "../graphit-http" }
object_store = { version = "=0.14.2", default-features = false, features = ["aws"] }
http.workspace = true
jsonwebtoken.workspace = true
tokio = { workspace = true, features = ["net"] }
httparse = "=1.10.1"
url.workspace = true
oauth2.workspace = true
base64.workspace = true
getrandom.workspace = true
secrecy.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
subtle.workspace = true

[dev-dependencies]
graphit-core = { path = "../graphit-core", features = ["auth-test-support"] }
aws-lc-rs = "=1.18.1"
tempfile.workspace = true

[lints]
workspace = true
