[package]
name = "graphit-hub"
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
base64.workspace = true
url.workspace = true
graphit-core = { path = "../graphit-core" }
graphit-fs = { path = "../graphit-fs" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
semver = "=1.0.28"
serde-saphyr = { version = "=1.3.0", default-features = false, features = ["serialize", "deserialize"] }
toml_edit = { version = "=0.25.15", default-features = false, features = ["parse", "display"] }
toml_parser = { version = "=1.1.3", default-features = false, features = ["std"] }
jsonc-parser = { version = "=0.34.0", default-features = false, features = ["cst"] }
zip = { version = "=9.0.3", default-features = false, features = ["deflate-flate2-zlib-rs"] }
tempfile.workspace = true
libc = { version = "=0.2.190", default-features = false }

[target.'cfg(windows)'.dependencies]
windows-sys.workspace = true

[lints]
workspace = true
