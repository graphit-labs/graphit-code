# Symfony framework detection rules.
# Extracted from frameworkRules (lines 401-413).
# Includes Doctrine ORM rules detected via Symfony namespace.

framework: symfony
languages: [php]

decorator_detection:
  # Symfony web
  - name: Route
    category: web
  - name: ParamConverter
    category: web
  - name: Template
    category: web

  # Symfony auth
  - name: IsGranted
    category: auth
  - name: Security
    category: auth

  # Symfony validation
  - name: "Assert\\NotBlank"
    category: validation
  - name: "Assert\\Valid"
    category: validation

  # Doctrine ORM (detected via ORM\\ namespace in Symfony projects)
  - name: "ORM\\Entity"
    framework: doctrine
    category: orm
  - name: "ORM\\Table"
    framework: doctrine
    category: orm
  - name: "ORM\\Column"
    framework: doctrine
    category: orm
  - name: "ORM\\Id"
    framework: doctrine
    category: orm
  - name: "ORM\\ManyToOne"
    framework: doctrine
    category: orm
  - name: "ORM\\OneToMany"
    framework: doctrine
    category: orm
