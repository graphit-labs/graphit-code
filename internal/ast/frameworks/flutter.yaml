# Flutter framework detection rules.
# Extracted from frameworkRules (lines 484-490) and heritageRules (lines 547-553).
# Includes flutter_bloc sub-framework.

framework: flutter
languages: [dart]

decorator_detection:
  # Dart core (used in Flutter context)
  - name: override
    framework: dart
    category: core
  - name: required
    framework: dart
    category: core

  # Flutter
  - name: visibleForTesting
    category: test
  - name: immutable
    category: core
  - name: protected
    category: core
  - name: mustCallSuper
    category: core
  - name: optionalTypeArgs
    category: core

heritage_detection:
  # Flutter UI
  - parent: StatelessWidget
    category: ui
  - parent: StatefulWidget
    category: ui
  - parent: State
    category: ui
  - parent: InheritedWidget
    category: ui

  # Flutter state management
  - parent: ChangeNotifier
    category: state

  # flutter_bloc
  - parent: Cubit
    framework: flutter_bloc
    category: state
  - parent: Bloc
    framework: flutter_bloc
    category: state
