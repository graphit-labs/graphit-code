# JavaScript language rules — self-contained, no external base dependency.
# Includes all entry-point scoring rules (no language-specific overrides).
# NOTE: TypeScript moved to _typescript_lang.yaml to allow independent evolution.

framework: _javascript_lang
languages: [javascript]

# ---------------------------------------------------------------------------
# Entry-point scoring (embedded base rules)
# ---------------------------------------------------------------------------
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "Test*"
      score: 60
    - pattern: "test_*"
      score: 60
    - pattern: init
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "cmd*"
      score: 20
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  decorators:
    # HTTP route decorators
    - name: GetMapping
      score: 70
    - name: PostMapping
      score: 70
    - name: PutMapping
      score: 70
    - name: DeleteMapping
      score: 70
    - name: RequestMapping
      score: 70
    - name: HttpGet
      score: 70
    - name: HttpPost
      score: 70
    - name: HttpPut
      score: 70
    - name: HttpDelete
      score: 70
    - name: Get
      score: 70
    - name: Post
      score: 70
    - name: Put
      score: 70
    - name: Delete
      score: 70
    - name: Route
      score: 70
    - name: route
      score: 70
    - name: "app.get"
      score: 70
    - name: "app.post"
      score: 70
    - name: "app.put"
      score: 70
    - name: "app.delete"
      score: 70
    # Test decorators
    - name: Test
      score: 60
    - name: test
      score: 60
    - name: pytest.fixture
      score: 60
    # Controller decorators
    - name: Controller
      score: 50
    - name: RestController
      score: 50
    - name: ApiController
      score: 50

# ---------------------------------------------------------------------------
# Import detection (npm package names)
# ---------------------------------------------------------------------------
import_detection:
  # Web frameworks
  - pattern: express
    match: prefix
    framework: express
    category: web
  - pattern: koa
    match: prefix
    framework: koa
    category: web
  - pattern: fastify
    match: prefix
    framework: fastify
    category: web
  - pattern: hono
    match: prefix
    framework: hono
    category: web

  # UI frameworks
  - pattern: react
    match: prefix
    framework: react
    category: ui
  - pattern: react-dom
    match: prefix
    framework: react
    category: ui
  - pattern: next
    match: prefix
    framework: next
    category: web
  - pattern: vue
    match: prefix
    framework: vue
    category: ui
  - pattern: nuxt
    match: prefix
    framework: nuxt
    category: web
  - pattern: svelte
    match: prefix
    framework: svelte
    category: ui
  - pattern: "@angular/core"
    match: prefix
    framework: angular
    category: ui
  - pattern: "@nestjs/common"
    match: prefix
    framework: nestjs
    category: web

  # ORM / Data
  - pattern: prisma
    match: prefix
    framework: prisma
    category: orm
  - pattern: typeorm
    match: prefix
    framework: typeorm
    category: orm
  - pattern: sequelize
    match: prefix
    framework: sequelize
    category: orm
  - pattern: mongoose
    match: prefix
    framework: mongoose
    category: orm

  # API / GraphQL
  - pattern: graphql
    match: prefix
    framework: graphql
    category: api
  - pattern: apollo
    match: prefix
    framework: apollo
    category: api
  - pattern: trpc
    match: prefix
    framework: trpc
    category: api
  - pattern: socket.io
    match: prefix
    framework: socketio
    category: realtime

  # Testing
  - pattern: jest
    match: prefix
    framework: jest
    category: test
  - pattern: mocha
    match: prefix
    framework: mocha
    category: test
  - pattern: vitest
    match: prefix
    framework: vitest
    category: test
  - pattern: cypress
    match: prefix
    framework: cypress
    category: test
  - pattern: playwright
    match: prefix
    framework: playwright
    category: test

  # CSS / State
  - pattern: tailwindcss
    match: prefix
    framework: tailwind
    category: css
  - pattern: redux
    match: prefix
    framework: redux
    category: state
  - pattern: zustand
    match: prefix
    framework: zustand
    category: state
  - pattern: mobx
    match: prefix
    framework: mobx
    category: state
