# JavaScript / TypeScript language-specific rules.
# Extracted from importRules in enrichment.go (lines 620-648).

framework: _javascript_lang
languages: [javascript, typescript, tsx]

import_detection:
  # Web frameworks
  - pattern: express
    match: prefix
    framework: express
    category: web
  - pattern: koa
    match: prefix
    framework: koa
    category: web
  - pattern: fastify
    match: prefix
    framework: fastify
    category: web
  - pattern: hono
    match: prefix
    framework: hono
    category: web

  # UI frameworks
  - pattern: react
    match: prefix
    framework: react
    category: ui
  - pattern: react-dom
    match: prefix
    framework: react
    category: ui
  - pattern: next
    match: prefix
    framework: next
    category: web
  - pattern: vue
    match: prefix
    framework: vue
    category: ui
  - pattern: nuxt
    match: prefix
    framework: nuxt
    category: web
  - pattern: svelte
    match: prefix
    framework: svelte
    category: ui
  - pattern: "@angular/core"
    match: prefix
    framework: angular
    category: ui
  - pattern: "@nestjs/common"
    match: prefix
    framework: nestjs
    category: web

  # ORM / Data
  - pattern: prisma
    match: prefix
    framework: prisma
    category: orm
  - pattern: typeorm
    match: prefix
    framework: typeorm
    category: orm
  - pattern: sequelize
    match: prefix
    framework: sequelize
    category: orm
  - pattern: mongoose
    match: prefix
    framework: mongoose
    category: orm

  # API / GraphQL
  - pattern: graphql
    match: prefix
    framework: graphql
    category: api
  - pattern: apollo
    match: prefix
    framework: apollo
    category: api
  - pattern: trpc
    match: prefix
    framework: trpc
    category: api
  - pattern: socket.io
    match: prefix
    framework: socketio
    category: realtime

  # Testing
  - pattern: jest
    match: prefix
    framework: jest
    category: test
  - pattern: mocha
    match: prefix
    framework: mocha
    category: test
  - pattern: vitest
    match: prefix
    framework: vitest
    category: test
  - pattern: cypress
    match: prefix
    framework: cypress
    category: test
  - pattern: playwright
    match: prefix
    framework: playwright
    category: test

  # CSS / State
  - pattern: tailwindcss
    match: prefix
    framework: tailwind
    category: css
  - pattern: redux
    match: prefix
    framework: redux
    category: state
  - pattern: zustand
    match: prefix
    framework: zustand
    category: state
  - pattern: mobx
    match: prefix
    framework: mobx
    category: state
