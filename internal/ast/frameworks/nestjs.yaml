# NestJS framework detection rules.
# Extracted from frameworkRules (lines 358-373).

framework: nestjs
languages: [javascript, typescript]

decorator_detection:
  # Web
  - name: Controller
    category: web
  - name: Get
    category: web
  - name: Post
    category: web
  - name: Put
    category: web
  - name: Delete
    category: web
  - name: Patch
    category: web
  - name: Body
    category: web
  - name: Param
    category: web
  - name: Query
    category: web

  # DI
  - name: Injectable
    category: di
  - name: Module
    category: di

  # Auth
  - name: Guard
    category: auth
  - name: UseGuards
    category: auth

  # Middleware
  - name: UseInterceptors
    category: middleware

  # Validation
  - name: UsePipes
    category: validation

  # Scheduling
  - name: Cron
    category: scheduling

entry_points:
  decorators:
    - name: Controller
      score: 50
