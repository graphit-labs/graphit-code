# Android ecosystem detection rules.
# Extracted from frameworkRules (lines 274-279) and heritageRules (lines 564-570).
# Includes Jetpack Compose and Hilt sub-frameworks.

framework: android
languages: [java, kotlin]

decorator_detection:
  # Jetpack Compose
  - name: Composable
    framework: jetpack_compose
    category: ui
  - name: Preview
    framework: jetpack_compose
    category: ui

  # Hilt DI
  - name: HiltViewModel
    framework: hilt
    category: di
  - name: HiltAndroidApp
    framework: hilt
    category: di
  - name: AndroidEntryPoint
    framework: hilt
    category: di

  # Android core
  - name: Parcelize
    category: serialization

heritage_detection:
  - parent: Activity
    category: ui
  - parent: AppCompatActivity
    category: ui
  - parent: Fragment
    category: ui
  - parent: ViewModel
    category: arch
  - parent: Application
    category: core
  - parent: Service
    category: service
  - parent: BroadcastReceiver
    category: service
