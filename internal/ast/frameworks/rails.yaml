# Ruby on Rails framework detection rules.
# Extracted from frameworkRules (lines 420-429) and heritageRules (lines 534-539).

framework: rails
languages: [ruby]

decorator_detection:
  # Web / controller callbacks
  - name: before_action
    category: web
  - name: after_action
    category: web
  - name: around_action
    category: web
  - name: skip_before_action
    category: web

  # Validation
  - name: validates
    category: validation

  # ORM (ActiveRecord associations)
  - name: has_many
    category: orm
  - name: belongs_to
    category: orm
  - name: has_one
    category: orm
  - name: has_and_belongs_to_many
    category: orm
  - name: scope
    category: orm

heritage_detection:
  # ORM
  - parent: ApplicationRecord
    category: orm
  - parent: "ActiveRecord::Base"
    category: orm

  # Web
  - parent: ApplicationController
    category: web
  - parent: "ActionController::Base"
    category: web

  # Mail
  - parent: ApplicationMailer
    category: mail

  # Async
  - parent: "ActiveJob::Base"
    category: async
