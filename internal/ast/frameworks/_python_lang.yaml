# Python language rules — self-contained, no external base dependency.
# Includes all entry-point scoring rules with Python-specific additions.

framework: _python_lang
languages: [python]

# ---------------------------------------------------------------------------
# Entry-point scoring (embedded base rules + Python additions)
# ---------------------------------------------------------------------------
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: __main__
      score: 80              # Python-specific: if __name__ == "__main__"
    - pattern: "Test*"
      score: 60
    - pattern: "test_*"
      score: 60
    - pattern: init
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "cmd*"
      score: 20
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  decorators:
    # HTTP route decorators
    - name: GetMapping
      score: 70
    - name: PostMapping
      score: 70
    - name: PutMapping
      score: 70
    - name: DeleteMapping
      score: 70
    - name: RequestMapping
      score: 70
    - name: HttpGet
      score: 70
    - name: HttpPost
      score: 70
    - name: HttpPut
      score: 70
    - name: HttpDelete
      score: 70
    - name: Get
      score: 70
    - name: Post
      score: 70
    - name: Put
      score: 70
    - name: Delete
      score: 70
    - name: Route
      score: 70
    - name: route
      score: 70
    - name: "app.get"
      score: 70
    - name: "app.post"
      score: 70
    - name: "app.put"
      score: 70
    - name: "app.delete"
      score: 70
    # Test decorators
    - name: Test
      score: 60
    - name: test
      score: 60
    - name: pytest.fixture
      score: 60
    # Controller decorators
    - name: Controller
      score: 50
    - name: RestController
      score: 50
    - name: ApiController
      score: 50

# ---------------------------------------------------------------------------
# Import detection (Python module names)
# ---------------------------------------------------------------------------
import_detection:
  - pattern: django
    match: prefix
    framework: django
    category: web
  - pattern: flask
    match: prefix
    framework: flask
    category: web
  - pattern: fastapi
    match: prefix
    framework: fastapi
    category: web
  - pattern: sqlalchemy
    match: prefix
    framework: sqlalchemy
    category: orm
  - pattern: celery
    match: prefix
    framework: celery
    category: async
  - pattern: pytest
    match: prefix
    framework: pytest
    category: test
  - pattern: pydantic
    match: prefix
    framework: pydantic
    category: validation
  - pattern: numpy
    match: prefix
    framework: numpy
    category: data
  - pattern: pandas
    match: prefix
    framework: pandas
    category: data
  - pattern: torch
    match: prefix
    framework: pytorch
    category: ml
  - pattern: tensorflow
    match: prefix
    framework: tensorflow
    category: ml
  - pattern: scrapy
    match: prefix
    framework: scrapy
    category: scraping
