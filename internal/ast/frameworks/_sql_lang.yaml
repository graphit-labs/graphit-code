# SQL language rules — self-contained, no external base dependency.
# Import/decorator detection comes from framework-specific files.

framework: _sql_lang
languages: [sql]

# ---------------------------------------------------------------------------
# Entry-point scoring (embedded base rules)
# ---------------------------------------------------------------------------
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "Test*"
      score: 60
    - pattern: "test_*"
      score: 60
    - pattern: init
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "cmd*"
      score: 20
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  decorators:
    # HTTP route decorators
    - name: GetMapping
      score: 70
    - name: PostMapping
      score: 70
    - name: PutMapping
      score: 70
    - name: DeleteMapping
      score: 70
    - name: RequestMapping
      score: 70
    - name: HttpGet
      score: 70
    - name: HttpPost
      score: 70
    - name: HttpPut
      score: 70
    - name: HttpDelete
      score: 70
    - name: Get
      score: 70
    - name: Post
      score: 70
    - name: Put
      score: 70
    - name: Delete
      score: 70
    - name: Route
      score: 70
    - name: route
      score: 70
    - name: "app.get"
      score: 70
    - name: "app.post"
      score: 70
    - name: "app.put"
      score: 70
    - name: "app.delete"
      score: 70
    # Test decorators
    - name: Test
      score: 60
    - name: test
      score: 60
    - name: pytest.fixture
      score: 60
    # Controller decorators
    - name: Controller
      score: 50
    - name: RestController
      score: 50
    - name: ApiController
      score: 50
