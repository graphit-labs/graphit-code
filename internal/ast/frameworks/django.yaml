# Django framework detection rules.
# Extracted from frameworkRules (lines 333-338) and heritageRules (lines 520-528).
# Includes Django REST Framework heritage rules.

framework: django
languages: [python]

decorator_detection:
  - name: login_required
    category: auth
  - name: permission_required
    category: auth
  - name: csrf_exempt
    category: web
  - name: require_http_methods
    category: web
  - name: admin.register
    category: admin
  - name: receiver
    category: signals

heritage_detection:
  # Django core
  - parent: Model
    category: orm
  - parent: ModelForm
    category: forms
  - parent: TestCase
    category: test
  - parent: SimpleTestCase
    category: test
  - parent: TransactionTestCase
    category: test

  # Django REST Framework
  - parent: APIView
    framework: django_rest
    category: web
  - parent: ViewSet
    framework: django_rest
    category: web
  - parent: ModelViewSet
    framework: django_rest
    category: web
  - parent: GenericAPIView
    framework: django_rest
    category: web
