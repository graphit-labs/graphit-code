# SCIP's SymbolInformation.Kind is the graph label for every declared kind.
# "*" includes future SCIP kinds; unknown values become Symbol.
parser: scip
family: rust
extensions: [.rs]
entities:
  kinds: ["*"]
  labels:
    UnspecifiedKind: Symbol
relations:
  - CONTAINS
  - REFERENCES
  - IMPLEMENTS
  - TYPE_DEFINITION
  - DEFINITION
documentation: true
external_symbols: true
