language: tsx
grammar: tree-sitter-tsx
extensions: [".tsx"]
# Target resolution: a relation captures its target by NAME, and the name alone does
# not say what kind of thing it is. Without this the target could match any label the
# grammar declares — a Parameter sharing the called function's name.
target_rules:
  CALLS: { labels: [Function, Method] }
  READS_FIELD: { labels: [Field] }
  WRITES_FIELD: { labels: [Field] }
queries:
  # ═══════════════════════════════════════════════════════════════
  # FUNCTIONS & METHODS
  # ═══════════════════════════════════════════════════════════════
  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration name: (identifier) @name)'
  - data_key: functions
    graph_label: Function
    pattern: '(generator_function_declaration name: (identifier) @name)'
  - data_key: methods
    graph_label: Method
    pattern: '(method_definition name: (property_identifier) @name)'
  - data_key: functions
    graph_label: Function
    pattern: '(variable_declarator name: (identifier) @name value: (arrow_function))'

  # ═══════════════════════════════════════════════════════════════
  # CLASSES, INTERFACES, TYPES, ENUMS
  # ═══════════════════════════════════════════════════════════════
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration name: (type_identifier) @name)'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(interface_declaration name: (type_identifier) @name)'
  - data_key: types
    graph_label: Type
    pattern: '(type_alias_declaration name: (type_identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_declaration name: (identifier) @name)'

  # ═══════════════════════════════════════════════════════════════
  # VARIABLES
  # ═══════════════════════════════════════════════════════════════
  - data_key: variables
    graph_label: Variable
    pattern: '(lexical_declaration (variable_declarator name: (identifier) @name))'

  # Declared literal values — the literal becomes a node contained by the name.
  - data_key: variables
    graph_label: Variable
    pattern: '(variable_declarator name: (identifier) @name value: [(number) (true) (false) (null) (undefined) (string) (template_string) (regex)] @value)'
    value_capture: value
    value_label: Value

  # Enum members, each with its value.
  - data_key: enum_members
    graph_label: EnumMember
    pattern: '(enum_assignment name: (property_identifier) @name value: [(number) (true) (false) (string) (template_string)] @value)'
    value_capture: value
    value_label: Value
  - data_key: enum_members
    graph_label: EnumMember
    pattern: '(enum_body (property_identifier) @name)'

  # ═══════════════════════════════════════════════════════════════
  # IMPORTS & EXPORTS
  # ═══════════════════════════════════════════════════════════════
  - data_key: imports
    graph_label: Import
    pattern: '(import_statement source: (string) @name)'
  - data_key: imports
    graph_label: Export
    pattern: '(export_statement source: (string) @name)'

  # CommonJS dependencies. `require('x')` IS a dependency, and without this it lands as
  # a call to a stub named `require` — the module's own name unreachable, so "what does
  # this project depend on" silently misses every CommonJS import. The `@_` capture is
  # auxiliary and does not become an entity; it only pins the callee.
  - data_key: imports
    graph_label: Import
    pattern: '(call_expression function: (identifier) @_fn arguments: (arguments (string) @name) (#eq? @_fn "require"))'

  # Configuration and content expressed as an object literal.
  #
  # The same settings written in .json get a Pair and a Value each — see json.yaml — so
  # "which file sets this flag / holds this colour" was answerable there and not here,
  # purely because of the file extension. `export default { … }` is how nearly every JS
  # tool is configured (Vite, Vitest, Tailwind, PostCSS, ESLint flat config), and an
  # anonymous default export declares no name, so such a file yielded NOTHING at all.
  #
  # UNANCHORED, and that is a decision with a measured cost. Anchoring these at the
  # exported object or a declared constant kept the additions to 7.8% of .tsx nodes and
  # dropped the call options (`{behavior: "smooth"}`, an inline style) that make up
  # about half of them — but it also missed the real thing: in an actual config the
  # literals are nested three or four levels down (`theme.extend.colors.border`), so
  # tailwind.config.js stayed empty and the problem was not solved. Tree-sitter has
  # neither a descendant wildcard nor structural negation, so "any literal pair except
  # inside a call" cannot be written. Unanchored costs ~37% more nodes in .tsx and
  # answers the question; anchored costs 7.8% and does not.
  #
  # Only values that are LITERALS. A pair whose value is another object or an array is
  # structure, not content, and would cost a node per nesting level while answering
  # nothing the literal beneath it does not already answer.
  - data_key: pairs
    graph_label: Pair
    pattern: '(pair key: (property_identifier) @name value: (string (string_fragment) @value))'
    value_capture: value
    value_label: Value
  - data_key: pairs
    graph_label: Pair
    pattern: '(pair key: (property_identifier) @name value: [(number) (true) (false) (null)] @value)'
    value_capture: value
    value_label: Value
  # Quoted keys — `'accordion-down': '…'` — are a string node, not an identifier.
  - data_key: pairs
    graph_label: Pair
    pattern: '(pair key: (string (string_fragment) @name) value: (string (string_fragment) @value))'
    value_capture: value
    value_label: Value

  # A key whose value is an object or an array is content too, and often the only
  # content there is: `plugins: { autoprefixer: {} }` names a plugin, and the empty
  # object means "no options" rather than "nothing here". The VALUE is not captured for
  # these — there is no literal to capture — so this costs one node per key, not a tree.
  - data_key: pairs
    graph_label: Pair
    pattern: '(pair key: (property_identifier) @name value: [(object) (array)])'
  - data_key: pairs
    graph_label: Pair
    pattern: '(pair key: (string (string_fragment) @name) value: [(object) (array)])'

  # Array items, the way json.yaml already records them: the glob in
  # `content: ['./src/**/*.tsx']` and the preset in a `plugins: [...]` list are content,
  # and without this only the key survives. Contained by the key, so "what does this
  # setting list" is a traversal.
  - data_key: array_items
    graph_label: Value
    pattern: '(pair key: (property_identifier) @parent value: (array (string (string_fragment) @name)))'
    parent_capture: parent
    parent_label: Pair
  - data_key: array_items
    graph_label: Value
    pattern: '(pair key: (string (string_fragment) @parent) value: (array (string (string_fragment) @name)))'
    parent_capture: parent
    parent_label: Pair





  # ═══════════════════════════════════════════════════════════════
  # PARAMETERS & FIELDS
  # ═══════════════════════════════════════════════════════════════
  - data_key: parameters
    graph_label: Parameter
    pattern: '(required_parameter pattern: (identifier) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(optional_parameter pattern: (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(public_field_definition name: (property_identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(public_field_definition name: (property_identifier) @name value: [(number) (true) (false) (null) (undefined) (string) (template_string) (regex)] @value)'
    value_capture: value
    value_label: Value

  # ═══════════════════════════════════════════════════════════════
  # RELATIONS
  # ═══════════════════════════════════════════════════════════════
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (member_expression property: (property_identifier) @name))'
  - data_key: instantiations
    type: relation
    relation_type: INSTANTIATES
    pattern: '(new_expression constructor: (identifier) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(extends_clause value: (identifier) @name)'
  - data_key: implements
    type: relation
    relation_type: IMPLEMENTS
    pattern: '(implements_clause (type_identifier) @name)'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(member_expression property: (property_identifier) @name)'
  - data_key: field_writes
    type: relation
    relation_type: WRITES_FIELD
    pattern: '(assignment_expression left: (member_expression property: (property_identifier) @name))'
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(decorator (identifier) @name)'
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(decorator (call_expression function: (identifier) @name))'

# Export detection strategy
exports:
  strategy: export_statement

# TSX uses 'this'
self_keywords: ["this."]

# tree-sitter-tsx context types (only valid TSX node types)
context_types:
  class_declaration: Class
  interface_declaration: Interface
  enum_declaration: Enum
  function_declaration: Function
  method_definition: Method
  # function* foo() is its own node kind, not a function_declaration, so without
  # this its parameters resolve to whatever encloses the generator.
  generator_function_declaration: Function
  # `const X = { … }` owns the pairs inside it, which is what makes a lookup table
  # traversable from its own name.
  lexical_declaration: Variable

# A const has no `name` field of its own; the name is on its declarator.
context_name_paths:
  lexical_declaration: variable_declarator/name

# Anonymous function types for variable_declarator resolution
anon_func_types:
  - arrow_function
  - function_expression
  - function
  - generator_function

# tree-sitter-tsx declaration types for docstring attachment
declaration_types:
  - function_declaration
  - generator_function_declaration
  - method_definition
  - class_declaration
  - interface_declaration
  - type_alias_declaration
  - enum_declaration
  - variable_declarator
  - lexical_declaration

# tree-sitter-tsx has a single 'comment' type
comment_types:
  - comment

# Cyclomatic complexity: real syntax-tree branches, not a text scan. Same
# statement/expression grammar as typescript.yaml — tsx only adds JSX syntax
# on top, so the same node kinds apply.
complexity:
  node_types:
    - if_statement
    - for_statement
    - while_statement
    - switch_case
    - catch_clause
    - ternary_expression
  operators: ["&&", "||"]

# Labels of this language that get a vector, so semantic search reaches them and
# not only keyword search. Order decides which label keeps a (path, uid) that two
# of them claim -- earlier wins. Every entity is in the keyword index regardless;
# this list is only about meaning. See docs/specs/ast_module.md.
embed_labels:
  - Class
  - Interface
  - Enum
  - Type
  - Function
  - Method
  - Field
  - EnumMember
  - Variable
  - Comment
