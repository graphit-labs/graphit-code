language: typescript
extensions: [".ts"]
queries:
  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration name: (identifier) @name)'
  - data_key: functions
    graph_label: Function
    pattern: '(method_definition name: (property_identifier) @name)'
  - data_key: functions
    graph_label: Function
    pattern: '(variable_declarator name: (identifier) @name value: (arrow_function))'
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration name: (type_identifier) @name)'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(interface_declaration name: (type_identifier) @name)'
  - data_key: types
    graph_label: Type
    pattern: '(type_alias_declaration name: (type_identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_declaration name: (identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(import_statement source: (string) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(lexical_declaration (variable_declarator name: (identifier) @name))'
  - data_key: imports
    graph_label: Module
    pattern: '(export_statement source: (string) @name)'
  - data_key: calls
    pattern: '(call_expression function: (identifier) @name)'
  - data_key: calls
    pattern: '(call_expression function: (member_expression property: (property_identifier) @name))'
  - data_key: instantiations
    pattern: '(new_expression constructor: (identifier) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(required_parameter pattern: (identifier) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(optional_parameter pattern: (identifier) @name)'
  - data_key: heritage
    pattern: '(extends_clause value: (identifier) @name)'
  - data_key: implements
    pattern: '(implements_clause (type_identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(public_field_definition name: (property_identifier) @name)'
  - data_key: field_reads
    pattern: '(member_expression property: (property_identifier) @name)'
  - data_key: field_writes
    pattern: '(assignment_expression left: (member_expression property: (property_identifier) @name))'
  - data_key: decorators
    pattern: '(decorator (identifier) @name)'
  - data_key: decorators
    pattern: '(decorator (call_expression function: (identifier) @name))'

# Export detection strategy — extracted from detectExports()
exports:
  strategy: export_statement

# Self/this keywords for receiver type resolution — extracted from selfKeywordsForLang()
self_keywords: ["this."]

# Parent context type mapping — extracted from resolveParentContext()
context_types:
  class_declaration: Class
  class_definition: Class
  interface_declaration: Interface
  struct_declaration: Struct
  trait_declaration: Trait
  namespace_declaration: Namespace
  enum_declaration: Enum
  function_declaration: Function
  function_definition: Function
  method_declaration: Method
  method_definition: Method

# Anonymous function types for variable_declarator resolution — extracted from resolveParentContext()
anon_func_types:
  - arrow_function
  - function_expression
  - function

# Declaration types for docstring attachment — extracted from declarationTypes map
declaration_types:
  - function_declaration
  - method_declaration
  - method_definition
  - function_definition
  - function_item
  - class_declaration
  - class_definition
  - struct_item
  - interface_declaration
  - trait_item
  - enum_item
  - enum_declaration
  - struct_declaration
  - type_item
  - protocol_declaration
  - namespace_definition
  - variable_declarator
  - lexical_declaration
  - property_declaration

# Comment node types for docstring extraction — extracted from isCommentNode()
comment_types:
  - comment
  - block_comment
  - line_comment
