language: typescript
grammar: tree-sitter-typescript
extensions: [".ts"]
queries:
  # ═══════════════════════════════════════════════════════════════
  # FUNCTIONS & METHODS
  # ═══════════════════════════════════════════════════════════════
  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration name: (identifier) @name)'
  - data_key: functions
    graph_label: Function
    pattern: '(generator_function_declaration name: (identifier) @name)'
  - data_key: methods
    graph_label: Method
    pattern: '(method_definition name: (property_identifier) @name)'
  - data_key: functions
    graph_label: Function
    pattern: '(variable_declarator name: (identifier) @name value: (arrow_function))'

  # ═══════════════════════════════════════════════════════════════
  # CLASSES, INTERFACES, TYPES, ENUMS
  # ═══════════════════════════════════════════════════════════════
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration name: (type_identifier) @name)'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(interface_declaration name: (type_identifier) @name)'
  - data_key: types
    graph_label: Type
    pattern: '(type_alias_declaration name: (type_identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_declaration name: (identifier) @name)'

  # ═══════════════════════════════════════════════════════════════
  # VARIABLES
  # ═══════════════════════════════════════════════════════════════
  - data_key: variables
    graph_label: Variable
    pattern: '(lexical_declaration (variable_declarator name: (identifier) @name))'

  # ═══════════════════════════════════════════════════════════════
  # IMPORTS & EXPORTS
  # ═══════════════════════════════════════════════════════════════
  - data_key: imports
    graph_label: Module
    pattern: '(import_statement source: (string) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(export_statement source: (string) @name)'

  # ═══════════════════════════════════════════════════════════════
  # PARAMETERS & FIELDS
  # ═══════════════════════════════════════════════════════════════
  - data_key: parameters
    graph_label: Parameter
    pattern: '(required_parameter pattern: (identifier) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(optional_parameter pattern: (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(public_field_definition name: (property_identifier) @name)'

  # ═══════════════════════════════════════════════════════════════
  # RELATIONS
  # ═══════════════════════════════════════════════════════════════
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (member_expression property: (property_identifier) @name))'
  - data_key: instantiations
    type: relation
    relation_type: INSTANTIATES
    pattern: '(new_expression constructor: (identifier) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(extends_clause value: (identifier) @name)'
  - data_key: implements
    type: relation
    relation_type: IMPLEMENTS
    pattern: '(implements_clause (type_identifier) @name)'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(member_expression property: (property_identifier) @name)'
  - data_key: field_writes
    type: relation
    relation_type: WRITES_FIELD
    pattern: '(assignment_expression left: (member_expression property: (property_identifier) @name))'
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(decorator (identifier) @name)'
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(decorator (call_expression function: (identifier) @name))'

# Export detection strategy
exports:
  strategy: export_statement

# TypeScript uses 'this'
self_keywords: ["this."]

# tree-sitter-typescript context types (only valid TS node types)
context_types:
  class_declaration: Class
  interface_declaration: Interface
  enum_declaration: Enum
  function_declaration: Function
  method_definition: Method

# Anonymous function types for variable_declarator resolution
anon_func_types:
  - arrow_function
  - function_expression
  - function
  - generator_function

# tree-sitter-typescript declaration types for docstring attachment
declaration_types:
  - function_declaration
  - generator_function_declaration
  - method_definition
  - class_declaration
  - interface_declaration
  - type_alias_declaration
  - enum_declaration
  - variable_declarator
  - lexical_declaration

# tree-sitter-typescript has a single 'comment' type for both // and /* */
comment_types:
  - comment

# Entry point scoring rules
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "test_*"
      score: 60
    - pattern: "*.test"
      score: 60
    - pattern: "*.spec"
      score: 60
    - pattern: init
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "*Middleware"
      score: 30
    - pattern: "run*"
      score: 20
    - pattern: "start*"
      score: 20

  exported_bonus: 10
  max_score: 100

  # TypeScript decorators (Angular, NestJS)
  decorators:
    # NestJS HTTP route decorators
    - name: Get
      score: 70
    - name: Post
      score: 70
    - name: Put
      score: 70
    - name: Delete
      score: 70
    - name: Patch
      score: 70
    # Angular decorators
    - name: Component
      score: 50
    - name: Injectable
      score: 50
    - name: Module
      score: 50
    # NestJS controller
    - name: Controller
      score: 50
