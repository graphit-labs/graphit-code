# No export detection for COBOL
exports:
  strategy: none

# COBOL parent context types — maps AST node types to graph labels
context_types:
  programUnit: Program
  procedureSection: Section
  procedureDeclarative: Section
  paragraph: Paragraph
  fileDescriptionEntry: FileDescription
  workingStorageSection: Program
  linkageSection: Program
  localStorageSection: Program
  communicationSection: Program
  screenSection: Program
  reportSection: Program
  dataBaseSection: Program
  programLibrarySection: Program

# ANTLR comment token types
comment_types:
  - COMMENT_TAG

# COBOL declaration types for docstring attachment
declaration_types:
  - programIdParagraph
  - procedureSectionHeader
  - paragraph
  - fileDescriptionEntry
  - dataDescriptionEntryFormat1
  - dataDescriptionEntryFormat2
  - dataDescriptionEntryFormat3
  - reportDescriptionEntry
  - reportGroupDescriptionEntryFormat1
  - reportGroupDescriptionEntryFormat2
  - reportGroupDescriptionEntryFormat3
  - screenDescriptionEntry
  - communicationDescriptionEntryFormat1
  - communicationDescriptionEntryFormat2
  - communicationDescriptionEntryFormat3
  - libraryDescriptionEntryFormat1
  - libraryDescriptionEntryFormat2

# Cyclomatic complexity: real syntax-tree branches, not a text scan. Verified
# against the real ANTLR parse tree (rule names, not guessed). evaluateWhen
# is counted per WHEN, not once for the whole EVALUATE — evaluateWhenOther
# (the OTHER arm) is left out, matching the "default is not a branch"
# convention taken elsewhere here. AND/OR combinableCondition exists in the
# grammar but its per-occurrence counting was not verified, so it is left out
# rather than guessed.
complexity:
  node_types:
    - ifStatement
    - performStatement
    - evaluateWhen

# Labels of this language that get a vector, so semantic search reaches them and
# not only keyword search. Order decides which label keeps a (path, uid) that two
# of them claim -- earlier wins. Every entity is in the keyword index regardless;
# this list is only about meaning. See docs/specs/ast_module.md.
embed_labels:
  - Program
  - Section
  - Paragraph
  - FileDescription
  - Condition
  - Variable
  - Comment
