# COBOL 85 — ANTLR v4 grammar for COBOL 85
# Exhaustive entity and relation extraction covering all divisions, sections,
# statement types, data structures, file I/O, inter-program calls, data flow,
# arithmetic targets, string manipulation, report writer, screen section,
# communication section, and embedded SQL/CICS.
#
# Grammar source: https://github.com/antlr/grammars-v4/tree/master/cobol85
language: cobol85
parser: antlr4
grammar: antlr-cobol85
start_rule: startRule
extensions: [".cob", ".cbl", ".cpy", ".cobol"]

# Target resolution: a relation captures its target by NAME, and the name alone does
# not say what kind of thing it is. Without this the target could match any label the
# grammar declares — a Parameter sharing the called function's name.
target_rules:
  CALLS: { labels: [Paragraph, Program, Section] }
queries:

  # ═══════════════════════════════════════════════════════════════════════════
  # IDENTIFICATION DIVISION — PROGRAMS
  # ═══════════════════════════════════════════════════════════════════════════

  # PROGRAM-ID. program-name
  - data_key: programs
    graph_label: Program
    pattern: "//programIdParagraph/programName"
    name_capture: name
    type: entity

  # END PROGRAM program-name
  - data_key: end_programs
    graph_label: ""
    pattern: "//endProgramStatement/programName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # ═══════════════════════════════════════════════════════════════════════════
  # ENVIRONMENT DIVISION — CONFIGURATION
  # ═══════════════════════════════════════════════════════════════════════════

  # SOURCE-COMPUTER. computer-name
  - data_key: source_computers
    graph_label: ""
    pattern: "//sourceComputerParagraph/computerName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # OBJECT-COMPUTER. computer-name
  - data_key: object_computers
    graph_label: ""
    pattern: "//objectComputerParagraph/computerName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # SPECIAL-NAMES: ALPHABET clause
  - data_key: alphabets
    graph_label: Variable
    pattern: "//alphabetClauseFormat1/alphabetName"
    name_capture: name
    type: entity

  - data_key: alphabets
    graph_label: Variable
    pattern: "//alphabetClauseFormat2/alphabetName"
    name_capture: name
    type: entity

  # SPECIAL-NAMES: CLASS clause
  - data_key: class_names
    graph_label: Variable
    pattern: "//classClause/className"
    name_capture: name
    type: entity

  # SPECIAL-NAMES: environment switch → mnemonic
  - data_key: mnemonics
    graph_label: Variable
    pattern: "//environmentSwitchNameClause/mnemonicName"
    name_capture: name
    type: entity

  # SPECIAL-NAMES: CHANNEL clause
  - data_key: mnemonics
    graph_label: Variable
    pattern: "//channelClause/mnemonicName"
    name_capture: name
    type: entity

  # SPECIAL-NAMES: ODT clause
  - data_key: mnemonics
    graph_label: Variable
    pattern: "//odtClause/mnemonicName"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # ENVIRONMENT DIVISION — INPUT-OUTPUT SECTION
  # ═══════════════════════════════════════════════════════════════════════════

  # SELECT file-name (FILE-CONTROL)
  - data_key: file_selects
    graph_label: ""
    pattern: "//selectClause/fileName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # ASSIGN TO assignment-name
  - data_key: file_assigns
    graph_label: ""
    pattern: "//assignClause/assignmentName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # RECORD KEY IS qualified-data-name
  - data_key: record_keys
    graph_label: ""
    pattern: "//recordKeyClause/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # ALTERNATE RECORD KEY IS qualified-data-name
  - data_key: alternate_keys
    graph_label: ""
    pattern: "//alternateRecordKeyClause/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # FILE STATUS IS data-name
  - data_key: file_statuses
    graph_label: ""
    pattern: "//fileStatusClause/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # RELATIVE KEY IS data-name
  - data_key: relative_keys
    graph_label: ""
    pattern: "//relativeKeyClause/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # I-O-CONTROL: SAME AREA FOR file-names
  - data_key: same_areas
    graph_label: ""
    pattern: "//sameClause/fileName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # I-O-CONTROL: RERUN ON file
  - data_key: reruns
    graph_label: ""
    pattern: "//rerunClause/fileName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # I-O-CONTROL: MULTIPLE FILE TAPE
  - data_key: multiple_files
    graph_label: ""
    pattern: "//multipleFilePosition/fileName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # I-O-CONTROL: COMMITMENT CONTROL FOR file
  - data_key: commitment_files
    graph_label: ""
    pattern: "//commitmentControlClause/fileName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA DIVISION — FILE SECTION
  # ═══════════════════════════════════════════════════════════════════════════

  # FD/SD file-name
  - data_key: files
    graph_label: FileDescription
    pattern: "//fileDescriptionEntry/fileName"
    name_capture: name
    type: entity

  # REPORT IS report-name (inside FD)
  - data_key: fd_reports
    graph_label: ""
    pattern: "//reportClause/reportName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA DIVISION — DATA DESCRIPTION ENTRIES
  # ═══════════════════════════════════════════════════════════════════════════

  # Format 1: level-number data-name (WORKING-STORAGE, LINKAGE, FILE, LOCAL-STORAGE)
  # The VALUE clause is how COBOL declares a constant, and it was dropped entirely:
  # WS-STATUS was known to exist, but not that it holds 'ABERTO'.
  - data_key: variables
    graph_label: Variable
    pattern: "//dataDescriptionEntryFormat1"
    name_capture: dataName
    value_capture: "dataValueClause/dataValueInterval/dataValueIntervalFrom/literal"
    value_label: Value
    type: entity

  - data_key: variables
    graph_label: Variable
    pattern: "//dataDescriptionEntryFormat1/dataName"
    name_capture: name
    type: entity

  # Format 2: 66-level RENAMES
  - data_key: renames
    graph_label: Variable
    pattern: "//dataDescriptionEntryFormat2/dataName"
    name_capture: name
    type: entity

  # Format 3: 88-level condition names
  - data_key: conditions
    graph_label: Condition
    pattern: "//dataDescriptionEntryFormat3/conditionName"
    name_capture: name
    type: entity

  # REDEFINES data-name
  - data_key: redefines
    graph_label: ""
    pattern: "//dataRedefinesClause/dataName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # RENAMES data-name (range source)
  - data_key: rename_refs
    graph_label: ""
    pattern: "//dataRenamesClause/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # OCCURS DEPENDING ON data-name
  - data_key: occurs_depending
    graph_label: ""
    pattern: "//dataOccursClause/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # OCCURS INDEXED BY index-name
  - data_key: indexes
    graph_label: Variable
    pattern: "//dataOccursClause/indexName"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA DIVISION — REPORT SECTION
  # ═══════════════════════════════════════════════════════════════════════════

  # RD report-name (Report Description)
  - data_key: reports
    graph_label: Variable
    pattern: "//reportDescriptionEntry/reportName"
    name_capture: name
    type: entity

  # Report group description (Format 1 — group header with TYPE clause)
  - data_key: report_groups
    graph_label: Variable
    pattern: "//reportGroupDescriptionEntryFormat1/dataName"
    name_capture: name
    type: entity

  # Report group description (Format 2 — detail line)
  - data_key: report_groups
    graph_label: Variable
    pattern: "//reportGroupDescriptionEntryFormat2/dataName"
    name_capture: name
    type: entity

  # Report group description (Format 3 — elementary item)
  - data_key: report_groups
    graph_label: Variable
    pattern: "//reportGroupDescriptionEntryFormat3/dataName"
    name_capture: name
    type: entity

  # Report group SOURCE IS identifier
  - data_key: report_sources
    graph_label: ""
    pattern: "//reportGroupSourceClause/identifier"
    name_capture: name
    type: relation
    relation_type: READS_FIELD

  # Report group SUM identifier
  - data_key: report_sums
    graph_label: ""
    pattern: "//reportGroupSumClause/identifier"
    name_capture: name
    type: relation
    relation_type: READS_FIELD

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA DIVISION — SCREEN SECTION
  # ═══════════════════════════════════════════════════════════════════════════

  # Screen description entry (screenName)
  - data_key: screens
    graph_label: Variable
    pattern: "//screenDescriptionEntry/screenName"
    name_capture: name
    type: entity

  # SCREEN FROM identifier (data source)
  - data_key: screen_froms
    graph_label: ""
    pattern: "//screenDescriptionFromClause/identifier"
    name_capture: name
    type: relation
    relation_type: READS_FIELD

  # SCREEN USING identifier (bi-directional)
  - data_key: screen_usings
    graph_label: ""
    pattern: "//screenDescriptionUsingClause/identifier"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA DIVISION — COMMUNICATION SECTION
  # ═══════════════════════════════════════════════════════════════════════════

  # CD cd-name FOR INPUT
  - data_key: comm_descs
    graph_label: Variable
    pattern: "//communicationDescriptionEntryFormat1/cdName"
    name_capture: name
    type: entity

  # CD cd-name FOR OUTPUT
  - data_key: comm_descs
    graph_label: Variable
    pattern: "//communicationDescriptionEntryFormat2/cdName"
    name_capture: name
    type: entity

  # CD cd-name FOR I-O
  - data_key: comm_descs
    graph_label: Variable
    pattern: "//communicationDescriptionEntryFormat3/cdName"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA DIVISION — PROGRAM LIBRARY SECTION
  # ═══════════════════════════════════════════════════════════════════════════

  # LD library-name EXPORT
  - data_key: libraries
    graph_label: Variable
    pattern: "//libraryDescriptionEntryFormat1/libraryName"
    name_capture: name
    type: entity

  # LB library-name IMPORT
  - data_key: libraries
    graph_label: Variable
    pattern: "//libraryDescriptionEntryFormat2/libraryName"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # PROCEDURE DIVISION — STRUCTURE
  # ═══════════════════════════════════════════════════════════════════════════

  # Section headers in the Procedure Division
  - data_key: sections
    graph_label: Section
    pattern: "//procedureSection/procedureSectionHeader/sectionName"
    name_capture: name
    type: entity

  # Declarative section headers
  - data_key: sections
    graph_label: Section
    pattern: "//procedureDeclarative/procedureSectionHeader/sectionName"
    name_capture: name
    type: entity

  # Paragraphs
  - data_key: paragraphs
    graph_label: Paragraph
    pattern: "//paragraph/paragraphName"
    name_capture: name
    type: entity

  # PROCEDURE DIVISION USING parameter
  - data_key: proc_params
    graph_label: ""
    pattern: "//procedureDivisionByReference/identifier"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  - data_key: proc_params
    graph_label: ""
    pattern: "//procedureDivisionByValue/identifier"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # PROCEDURE DIVISION GIVING data-name
  - data_key: proc_giving
    graph_label: ""
    pattern: "//procedureDivisionGivingClause/dataName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # ═══════════════════════════════════════════════════════════════════════════
  # PROCEDURE CALLS — PERFORM, CALL, GO TO, CANCEL, ENTRY
  # ═══════════════════════════════════════════════════════════════════════════

  # PERFORM paragraph-name / section-name
  - data_key: calls
    graph_label: ""
    pattern: "//performProcedureStatement/procedureName"
    name_capture: name
    type: relation
    relation_type: CALLS

  # CALL 'program-name' (external program calls)
  - data_key: calls
    graph_label: ""
    pattern: "//callStatement/literal"
    name_capture: name
    type: relation
    relation_type: CALLS

  # CALL identifier (dynamic calls)
  - data_key: calls
    graph_label: ""
    pattern: "//callStatement/identifier"
    name_capture: name
    type: relation
    relation_type: CALLS

  # GO TO paragraph-name (simple)
  - data_key: gotos
    graph_label: ""
    pattern: "//goToStatementSimple/procedureName"
    name_capture: name
    type: relation
    relation_type: CALLS

  # GO TO ... DEPENDING ON (multiple targets)
  - data_key: gotos_depending
    graph_label: ""
    pattern: "//goToDependingOnStatement/procedureName"
    name_capture: name
    type: relation
    relation_type: CALLS

  # CANCEL 'program-name' (unload external program)
  - data_key: cancels
    graph_label: ""
    pattern: "//cancelStatement/identifier"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  - data_key: cancels
    graph_label: ""
    pattern: "//cancelStatement/literal"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # ENTRY 'entry-point' (alternate entry point)
  - data_key: entries
    graph_label: Paragraph
    pattern: "//entryStatement/literal"
    name_capture: name
    type: entity

  # ALTER paragraph-name TO PROCEED TO paragraph-name
  - data_key: alters
    graph_label: ""
    pattern: "//alterStatement/procedureName"
    name_capture: name
    type: relation
    relation_type: CALLS

  # ═══════════════════════════════════════════════════════════════════════════
  # FILE I/O OPERATIONS
  # ═══════════════════════════════════════════════════════════════════════════

  # READ file-name
  - data_key: reads
    graph_label: ""
    pattern: "//readStatement/fileName"
    name_capture: name
    type: relation
    relation_type: SELECTS

  # READ ... INTO identifier
  - data_key: read_intos
    graph_label: ""
    pattern: "//readInto/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # READ ... KEY IS data-name
  - data_key: read_keys
    graph_label: ""
    pattern: "//readKey/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: READS_FIELD

  # WRITE record-name
  - data_key: writes
    graph_label: ""
    pattern: "//writeStatement/recordName"
    name_capture: name
    type: relation
    relation_type: INSERTS

  # WRITE ... FROM identifier
  - data_key: write_froms
    graph_label: ""
    pattern: "//writeFromPhrase/identifier"
    name_capture: name
    type: relation
    relation_type: READS_FIELD

  # REWRITE record-name
  - data_key: rewrites
    graph_label: ""
    pattern: "//rewriteStatement/recordName"
    name_capture: name
    type: relation
    relation_type: UPDATES

  # REWRITE ... FROM identifier
  - data_key: rewrite_froms
    graph_label: ""
    pattern: "//rewriteFrom/identifier"
    name_capture: name
    type: relation
    relation_type: READS_FIELD

  # DELETE file-name
  - data_key: file_deletes
    graph_label: ""
    pattern: "//deleteStatement/fileName"
    name_capture: name
    type: relation
    relation_type: DELETES

  # OPEN INPUT file-name
  - data_key: opens
    graph_label: ""
    pattern: "//openInput/fileName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # OPEN OUTPUT file-name
  - data_key: opens
    graph_label: ""
    pattern: "//openOutput/fileName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # OPEN I-O file-name
  - data_key: opens
    graph_label: ""
    pattern: "//openIOStatement/fileName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # OPEN EXTEND file-name
  - data_key: opens
    graph_label: ""
    pattern: "//openExtendStatement/fileName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # CLOSE file-name
  - data_key: closes
    graph_label: ""
    pattern: "//closeStatement//fileName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # START file-name (file positioning)
  - data_key: starts
    graph_label: ""
    pattern: "//startStatement/fileName"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # START ... KEY IS data-name
  - data_key: start_keys
    graph_label: ""
    pattern: "//startKey/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: READS_FIELD

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA FLOW — MOVE
  # ═══════════════════════════════════════════════════════════════════════════

  # MOVE source TO target (source identifier)
  - data_key: move_sources
    graph_label: ""
    pattern: "//moveToSendingArea/identifier"
    name_capture: name
    type: relation
    relation_type: READS_FIELD

  # MOVE source TO target (targets)
  - data_key: move_targets
    graph_label: ""
    pattern: "//moveToStatement/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # MOVE CORRESPONDING source TO target
  - data_key: move_corr_sources
    graph_label: ""
    pattern: "//moveCorrespondingToSendingArea/identifier"
    name_capture: name
    type: relation
    relation_type: READS_FIELD

  - data_key: move_corr_targets
    graph_label: ""
    pattern: "//moveCorrespondingToStatement/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # ═══════════════════════════════════════════════════════════════════════════
  # ARITHMETIC — COMPUTE, ADD, SUBTRACT, MULTIPLY, DIVIDE
  # ═══════════════════════════════════════════════════════════════════════════

  # COMPUTE target = expression
  - data_key: compute_targets
    graph_label: ""
    pattern: "//computeStore/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # ADD ... TO target
  - data_key: add_targets
    graph_label: ""
    pattern: "//addToStatement/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # ADD ... GIVING target
  - data_key: add_giving
    graph_label: ""
    pattern: "//addToGivingStatement/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # ADD CORRESPONDING source FROM target
  - data_key: add_corr
    graph_label: ""
    pattern: "//addCorrespondingStatement/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # SUBTRACT ... FROM target
  - data_key: subtract_targets
    graph_label: ""
    pattern: "//subtractMinuend/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # SUBTRACT ... FROM ... GIVING target
  - data_key: subtract_giving
    graph_label: ""
    pattern: "//subtractGiving/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # MULTIPLY ... BY target
  - data_key: multiply_targets
    graph_label: ""
    pattern: "//multiplyRegularOperand/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # MULTIPLY ... GIVING target
  - data_key: multiply_giving
    graph_label: ""
    pattern: "//multiplyGivingResult/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # DIVIDE ... INTO target
  - data_key: divide_targets
    graph_label: ""
    pattern: "//divideInto/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # DIVIDE ... GIVING target
  - data_key: divide_giving
    graph_label: ""
    pattern: "//divideGiving/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # DIVIDE ... REMAINDER target
  - data_key: divide_remainder
    graph_label: ""
    pattern: "//divideRemainder/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # ═══════════════════════════════════════════════════════════════════════════
  # STRING MANIPULATION — STRING, UNSTRING, INSPECT
  # ═══════════════════════════════════════════════════════════════════════════

  # STRING ... INTO target
  - data_key: string_targets
    graph_label: ""
    pattern: "//stringIntoPhrase/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # STRING ... WITH POINTER data-name
  - data_key: string_pointers
    graph_label: ""
    pattern: "//stringWithPointerPhrase/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # UNSTRING source identifier
  - data_key: unstring_sources
    graph_label: ""
    pattern: "//unstringSendingPhrase/identifier"
    name_capture: name
    type: relation
    relation_type: READS_FIELD

  # UNSTRING ... INTO targets
  - data_key: unstring_targets
    graph_label: ""
    pattern: "//unstringInto/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # UNSTRING ... TALLYING IN data-name
  - data_key: unstring_tallying
    graph_label: ""
    pattern: "//unstringTallyingPhrase/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # UNSTRING ... WITH POINTER data-name
  - data_key: unstring_pointers
    graph_label: ""
    pattern: "//unstringWithPointerPhrase/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # INSPECT identifier (target being inspected)
  - data_key: inspect_targets
    graph_label: ""
    pattern: "//inspectStatement/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # INSPECT ... TALLYING counter FOR
  - data_key: inspect_tallying
    graph_label: ""
    pattern: "//inspectFor/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # ═══════════════════════════════════════════════════════════════════════════
  # TABLE OPERATIONS — SEARCH, SET
  # ═══════════════════════════════════════════════════════════════════════════

  # SEARCH table-name
  - data_key: searches
    graph_label: ""
    pattern: "//searchStatement/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: READS_FIELD

  # SEARCH ... VARYING index-name
  - data_key: search_varying
    graph_label: ""
    pattern: "//searchVarying/qualifiedDataName"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # SET target TO value
  - data_key: set_targets
    graph_label: ""
    pattern: "//setTo/identifier"
    name_capture: name
    type: relation
    relation_type: WRITES_FIELD

  # SET target UP BY / DOWN BY value
  - data_key: set_updown_targets
    graph_label: ""
