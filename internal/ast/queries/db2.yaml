# DB2 — ANTLR v4 grammar for IBM DB2 SQL
# Comprehensive extraction: DDL, DML, stored procedures, functions, triggers,
# types, indexes, sequences, parameters, columns, and all relation types.
language: db2
parser: antlr4
grammar: antlr-db2
start_rule: db2_file
extensions: [".sql", ".db2"]

queries:
  # ═══════════════════════════════════════════════════════════════════════════
  # FUNCTIONS & PROCEDURES
  # ═══════════════════════════════════════════════════════════════════════════

  # CREATE [OR REPLACE] FUNCTION function_name(...)
  - data_key: functions
    graph_label: Function
    pattern: "//create_function_statement//function_name"
    name_capture: name
    type: entity

  # CREATE [OR REPLACE] PROCEDURE procedure_name(...)
  - data_key: procedures
    graph_label: StoredProcedure
    pattern: "//create_procedure_statement//procedure_name"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # TRIGGERS
  # ═══════════════════════════════════════════════════════════════════════════

  - data_key: triggers
    graph_label: Trigger
    pattern: "//create_trigger_statement/trigger_name"
    name_capture: name
    type: entity

  # Trigger → table reference
  - data_key: trigger_tables
    graph_label: ""
    pattern: "//create_trigger_statement/table_name"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE OBJECTS — DDL
  # ═══════════════════════════════════════════════════════════════════════════

  # Tables
  - data_key: tables
    graph_label: Table
    pattern: "//create_table_statement/table_name"
    name_capture: name
    type: entity

  # Views
  - data_key: views
    graph_label: View
    pattern: "//create_view_statement/view_name"
    name_capture: name
    type: entity

  # Indexes
  - data_key: indexes
    graph_label: Index
    pattern: "//create_index_statement/index_name"
    name_capture: name
    type: entity

  # Sequences
  - data_key: sequences
    graph_label: Sequence
    pattern: "//create_sequence_statement/sequence_name"
    name_capture: name
    type: entity

  # Types
  - data_key: types
    graph_label: Type
    pattern: "//create_type_statement/type_name"
    name_capture: name
    type: entity

  # Schemas
  - data_key: schemas
    graph_label: Schema
    pattern: "//create_schema_statement/schema_name"
    name_capture: name
    type: entity

  # Aliases
  - data_key: aliases
    graph_label: Alias
    pattern: "//create_alias_statement/alias_name"
    name_capture: name
    type: entity

  # Tablespaces
  - data_key: tablespaces
    graph_label: Tablespace
    pattern: "//create_tablespace_statement/tablespace_name"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # COLUMNS & PARAMETERS
  # ═══════════════════════════════════════════════════════════════════════════

  # Column definitions (inside CREATE TABLE)
  - data_key: columns
    graph_label: Column
    pattern: "//column_definition/column_name"
    name_capture: name
    type: entity

  # Procedure/function parameters
  - data_key: parameters
    graph_label: Parameter
    pattern: "//parameter_declaration/parameter_name"
    name_capture: name
    type: entity

  # Variable declarations (DECLARE var)
  - data_key: variables
    graph_label: Variable
    pattern: "//declare_variable_statement/variable_name"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # FUNCTION/PROCEDURE CALLS
  # ═══════════════════════════════════════════════════════════════════════════

  # CALL procedure_name
  - data_key: calls
    graph_label: ""
    pattern: "//call_statement/procedure_name"
    name_capture: name
    type: relation
    relation_type: CALLS

  # Function calls in expressions
  - data_key: calls
    graph_label: ""
    pattern: "//function_invocation/function_name"
    name_capture: name
    type: relation
    relation_type: CALLS

  # ═══════════════════════════════════════════════════════════════════════════
  # DML TABLE REFERENCES
  # ═══════════════════════════════════════════════════════════════════════════

  # SELECT ... FROM table
  - data_key: selects
    graph_label: ""
    pattern: "//from_clause//table_reference//table_name"
    name_capture: name
    type: relation
    relation_type: SELECTS

  # INSERT INTO table
  - data_key: inserts
    graph_label: ""
    pattern: "//insert_statement/table_name"
    name_capture: name
    type: relation
    relation_type: INSERTS

  # UPDATE table
  - data_key: updates
    graph_label: ""
    pattern: "//update_statement//table_name"
    name_capture: name
    type: relation
    relation_type: UPDATES

  # DELETE FROM table
  - data_key: deletes
    graph_label: ""
    pattern: "//delete_statement//table_name"
    name_capture: name
    type: relation
    relation_type: DELETES

  # ═══════════════════════════════════════════════════════════════════════════
  # DDL OPERATIONS (ALTER, DROP, TRUNCATE)
  # ═══════════════════════════════════════════════════════════════════════════

  # ALTER TABLE
  - data_key: alters
    graph_label: ""
    pattern: "//alter_table_statement/table_name"
    name_capture: name
    type: relation
    relation_type: ALTERS

  # DROP (generic — covers TABLE, VIEW, INDEX, etc.)
  - data_key: drops
    graph_label: ""
    pattern: "//drop_statement//table_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_statement//view_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_statement//index_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_statement//function_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_statement//procedure_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_statement//trigger_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_statement//sequence_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  # TRUNCATE TABLE
  - data_key: truncates
    graph_label: ""
    pattern: "//truncate_statement/table_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  # ═══════════════════════════════════════════════════════════════════════════
  # DCL — GRANT & REVOKE
  # ═══════════════════════════════════════════════════════════════════════════

  - data_key: grants
    graph_label: ""
    pattern: "//grant_database_authorities_statement//table_name"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  - data_key: grants
    graph_label: ""
    pattern: "//grant_index_privileges_statement//table_name"
    name_capture: name
    type: relation
    relation_type: REFERENCES

# No export detection for DB2
exports:
  strategy: none

# DB2 parent context types
context_types:
  create_function_statement: Function
  create_procedure_statement: StoredProcedure
  create_trigger_statement: Trigger
  create_table_statement: Table
  create_view_statement: View
  create_type_statement: Type
  create_schema_statement: Schema

# ANTLR comment token types
comment_types:
  - LINE_COMMENT
  - BLOCK_COMMENT

# DB2 declaration types for docstring attachment
declaration_types:
  - create_function_statement
  - create_procedure_statement
  - create_trigger_statement
  - create_table_statement
  - create_view_statement
  - create_index_statement
  - create_sequence_statement
  - create_type_statement
  - create_schema_statement

# Entry point scoring
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "run*"
      score: 60
    - pattern: "process*"
      score: 60
    - pattern: "execute*"
      score: 50
    - pattern: "load*"
      score: 40
    - pattern: "init*"
      score: 40
    - pattern: "setup*"
      score: 40
    - pattern: "migrate*"
      score: 40
    - pattern: "sync*"
      score: 30
    - pattern: "refresh*"
      score: 30
    - pattern: "purge*"
      score: 30
    - pattern: "cleanup*"
      score: 30
    - pattern: "batch*"
      score: 30
    - pattern: "schedule*"
      score: 30

  exported_bonus: 0
  max_score: 100
  decorators: []
