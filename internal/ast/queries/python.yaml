language: python
grammar: tree-sitter-python
extensions: [".py"]
queries:
  # === Entity queries ===
  - data_key: functions
    graph_label: Function
    pattern: '(function_definition name: (identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(class_definition name: (identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(import_statement name: (dotted_name) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(import_from_statement module_name: (dotted_name) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(assignment left: (identifier) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameters (identifier) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameters (default_parameter name: (identifier) @name))'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameters (typed_parameter (identifier) @name))'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameters (typed_default_parameter name: (identifier) @name))'

  # === Relation queries ===
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(decorator (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call function: (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call function: (attribute attribute: (identifier) @name))'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(class_definition superclasses: (argument_list (identifier) @name))'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(attribute attribute: (identifier) @name)'
  - data_key: field_writes
    type: relation
    relation_type: WRITES_FIELD
    pattern: '(assignment left: (attribute attribute: (identifier) @name))'

# Export detection strategy — Python treats _prefix names as private
exports:
  strategy: no_prefix
  config:
    prefix: "_"

# Self/this keywords for receiver type resolution
self_keywords: ["self."]

# Parent context type mapping — Python tree-sitter node types only
# Used by resolveParentContextWASM() to walk up the AST and find enclosing scope.
context_types:
  class_definition: Class
  function_definition: Function

# Python has lambda as an anonymous function expression
anon_func_types:
  - lambda

# Declaration node types that can have docstrings (comments immediately above).
# Python tree-sitter uses these exact node types as top-level declaration wrappers.
declaration_types:
  - function_definition
  - class_definition
  - decorated_definition

# Python tree-sitter uses a single "comment" node type for # comments
# Python docstrings are expression_statement > string, not comment nodes
comment_types:
  - comment

# Entry point scoring rules for Python
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: __main__
      score: 80              # Python-specific: if __name__ == "__main__"
    - pattern: "Test*"
      score: 60
    - pattern: "test_*"
      score: 60
    - pattern: init
      score: 40
    - pattern: __init__
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "cmd*"
      score: 20
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  # Python-specific decorators only (Flask, FastAPI, Django, pytest)
  decorators:
    # Flask/FastAPI HTTP route decorators
    - name: "app.route"
      score: 70
    - name: "app.get"
      score: 70
    - name: "app.post"
      score: 70
    - name: "app.put"
      score: 70
    - name: "app.delete"
      score: 70
    - name: route
      score: 70
    - name: Route
      score: 70
    # Test decorators
    - name: "pytest.fixture"
      score: 60
    - name: "pytest.mark.parametrize"
      score: 60
    # Django decorators
    - name: "login_required"
      score: 50
    - name: "api_view"
      score: 50

# Import detection (language-level framework detection)
import_detection:
  - pattern: django
    match: prefix
    framework: django
    category: web
  - pattern: flask
    match: prefix
    framework: flask
    category: web
  - pattern: fastapi
    match: prefix
    framework: fastapi
    category: web
  - pattern: sqlalchemy
    match: prefix
    framework: sqlalchemy
    category: orm
  - pattern: celery
    match: prefix
    framework: celery
    category: async
  - pattern: pytest
    match: prefix
    framework: pytest
    category: test
  - pattern: pydantic
    match: prefix
    framework: pydantic
    category: validation
  - pattern: numpy
    match: prefix
    framework: numpy
    category: data
  - pattern: pandas
    match: prefix
    framework: pandas
    category: data
  - pattern: torch
    match: prefix
    framework: pytorch
    category: ml
  - pattern: tensorflow
    match: prefix
    framework: tensorflow
    category: ml
  - pattern: scrapy
    match: prefix
    framework: scrapy
    category: scraping
