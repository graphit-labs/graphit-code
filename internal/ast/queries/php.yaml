language: php
grammar: tree-sitter-php
extensions: [".php"]
queries:
  # === Entity queries ===
  - data_key: functions
    graph_label: Function
    pattern: '(function_definition name: (name) @name)'
  - data_key: methods
    graph_label: Method
    pattern: '(method_declaration name: (name) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration name: (name) @name)'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(interface_declaration name: (name) @name)'
  - data_key: traits
    graph_label: Trait
    pattern: '(trait_declaration name: (name) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_declaration name: (name) @name)'
  - data_key: constants
    graph_label: Constant
    pattern: '(const_declaration (const_element (name) @name))'
  - data_key: namespaces
    graph_label: Package
    pattern: '(namespace_definition name: (namespace_name) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(namespace_use_declaration (namespace_use_clause (name) @name))'
  - data_key: imports
    graph_label: Module
    pattern: '(namespace_use_declaration (namespace_use_clause (qualified_name) @name))'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(simple_parameter name: (variable_name (name) @name))'
  - data_key: fields
    graph_label: Field
    pattern: '(property_declaration (property_element (variable_name (name) @name)))'

  # === Relation queries ===
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(function_call_expression function: (name) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(member_call_expression name: (name) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(scoped_call_expression name: (name) @name)'
  - data_key: instantiations
    type: relation
    relation_type: INSTANTIATES
    pattern: '(object_creation_expression (name) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(base_clause (name) @name)'
  - data_key: implements
    type: relation
    relation_type: IMPLEMENTS
    pattern: '(class_interface_clause (name) @name)'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(member_access_expression name: (name) @name)'
  - data_key: field_writes
    type: relation
    relation_type: WRITES_FIELD
    pattern: '(assignment_expression left: (member_access_expression name: (name) @name))'
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(attribute (name) @name)'

# Export detection strategy — PHP uses visibility modifiers
exports:
  strategy: modifier
  config:
    keyword: "public"

# Self/this keywords for receiver type resolution
self_keywords: ["$this->"]

# Parent context type mapping — PHP tree-sitter node types only
# Used by resolveParentContextWASM() to walk up the AST and find enclosing scope.
context_types:
  class_declaration: Class
  interface_declaration: Interface
  trait_declaration: Trait
  namespace_definition: Namespace
  enum_declaration: Enum
  function_definition: Function
  method_declaration: Method

# PHP has anonymous_function (closure) and arrow_function (fn() =>) as anon types
anon_func_types:
  - anonymous_function
  - arrow_function

# Declaration node types that can have docstrings (comments immediately above).
# PHP tree-sitter uses these exact node types.
declaration_types:
  - function_definition
  - method_declaration
  - class_declaration
  - interface_declaration
  - trait_declaration
  - enum_declaration
  - namespace_definition
  - const_declaration
  - property_declaration

# PHP tree-sitter uses a single "comment" node type for //, /* */, and /** */ comments
comment_types:
  - comment

# Entry point scoring rules for PHP
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: __construct
      score: 40
    - pattern: __invoke
      score: 40
    - pattern: "Test*"
      score: 60
    - pattern: "test_*"
      score: 60
    - pattern: "test*"
      score: 60
    - pattern: init
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "cmd*"
      score: 20
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  # PHP has no decorator-style annotations — attributes are handled in queries
  # This section is intentionally empty
  decorators: []

# Import detection (language-level framework detection)
import_detection:
  - pattern: Illuminate
    match: prefix
    framework: laravel
    category: web
  - pattern: Symfony
    match: prefix
    framework: symfony
    category: web
  - pattern: Doctrine
    match: prefix
    framework: doctrine
    category: orm
