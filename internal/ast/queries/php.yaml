language: php
grammar: tree-sitter-php
extensions: [".php"]
queries:
  - data_key: functions
    graph_label: Function
    pattern: '(function_definition name: (name) @name)'
  - data_key: methods
    graph_label: Method
    pattern: '(method_declaration name: (name) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration name: (name) @name)'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(interface_declaration name: (name) @name)'
  - data_key: traits
    graph_label: Trait
    pattern: '(trait_declaration name: (name) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_declaration name: (name) @name)'
  - data_key: constants
    graph_label: Constant
    pattern: '(const_declaration (const_element (name) @name))'
  - data_key: namespaces
    graph_label: Package
    pattern: '(namespace_definition name: (namespace_name) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(function_call_expression function: (name) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(member_call_expression name: (name) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(scoped_call_expression name: (name) @name)'
  - data_key: instantiations
    type: relation
    relation_type: INSTANTIATES
    pattern: '(object_creation_expression (name) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(simple_parameter name: (variable_name (name) @name))'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(base_clause (name) @name)'
  - data_key: implements
    type: relation
    relation_type: IMPLEMENTS
    pattern: '(class_interface_clause (name) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(property_declaration name: (variable_name (name) @name))'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(member_access_expression name: (name) @name)'
  - data_key: field_writes
    type: relation
    relation_type: WRITES_FIELD
    pattern: '(assignment_expression left: (member_access_expression name: (name) @name))'
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(attribute (name) @name)'

# Export detection strategy — extracted from detectExports()
exports:
  strategy: modifier
  config:
    keyword: "public"

# Self/this keywords for receiver type resolution — extracted from selfKeywordsForLang()
self_keywords: ["$this->"]

# Parent context type mapping — extracted from resolveParentContext()
context_types:
  class_declaration: Class
  class_definition: Class
  interface_declaration: Interface
  struct_declaration: Struct
  trait_declaration: Trait
  namespace_declaration: Namespace
  enum_declaration: Enum
  function_declaration: Function
  function_definition: Function
  method_declaration: Method
  method_definition: Method

# Anonymous function types for variable_declarator resolution — extracted from resolveParentContext()
anon_func_types: []

# Declaration types for docstring attachment — extracted from declarationTypes map
declaration_types:
  - function_declaration
  - method_declaration
  - method_definition
  - function_definition
  - function_item
  - class_declaration
  - class_definition
  - struct_item
  - interface_declaration
  - trait_item
  - enum_item
  - enum_declaration
  - struct_declaration
  - type_item
  - protocol_declaration
  - namespace_definition
  - variable_declarator
  - lexical_declaration
  - property_declaration

# Comment node types for docstring extraction — extracted from isCommentNode()
comment_types:
  - comment
  - block_comment
  - line_comment

# Entry point scoring rules (base language rules)
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "Test*"
      score: 60
    - pattern: "test_*"
      score: 60
    - pattern: init
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "cmd*"
      score: 20
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  decorators:
    # HTTP route decorators
    - name: GetMapping
      score: 70
    - name: PostMapping
      score: 70
    - name: PutMapping
      score: 70
    - name: DeleteMapping
      score: 70
    - name: RequestMapping
      score: 70
    - name: HttpGet
      score: 70
    - name: HttpPost
      score: 70
    - name: HttpPut
      score: 70
    - name: HttpDelete
      score: 70
    - name: Get
      score: 70
    - name: Post
      score: 70
    - name: Put
      score: 70
    - name: Delete
      score: 70
    - name: Route
      score: 70
    - name: route
      score: 70
    - name: "app.get"
      score: 70
    - name: "app.post"
      score: 70
    - name: "app.put"
      score: 70
    - name: "app.delete"
      score: 70
    # Test decorators
    - name: Test
      score: 60
    - name: test
      score: 60
    - name: pytest.fixture
      score: 60
    # Controller decorators
    - name: Controller
      score: 50
    - name: RestController
      score: 50
    - name: ApiController
      score: 50

# Import detection (language-level framework detection)
import_detection:
  - pattern: Illuminate
    match: prefix
    framework: laravel
    category: web
  - pattern: Symfony
    match: prefix
    framework: symfony
    category: web
  - pattern: Doctrine
    match: prefix
    framework: doctrine
    category: orm
