language: c
extensions: [".c", ".h"]
queries:
  - data_key: functions
    graph_label: Function
    pattern: '(function_definition declarator: (function_declarator declarator: (identifier) @name))'
  - data_key: structs
    graph_label: Struct
    pattern: '(struct_specifier name: (type_identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_specifier name: (type_identifier) @name)'
  - data_key: types
    graph_label: Type
    pattern: '(type_definition declarator: (type_identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(preproc_include path: (string_literal) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(preproc_include path: (system_lib_string) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(declaration declarator: (init_declarator declarator: (identifier) @name))'
  - data_key: calls
    pattern: '(call_expression function: (identifier) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameter_declaration declarator: (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(field_declaration declarator: (field_identifier) @name)'
  - data_key: field_reads
    pattern: '(field_expression field: (field_identifier) @name)'

# Export detection strategy — extracted from detectExports()
exports:
  strategy: no_static

# Self/this keywords for receiver type resolution — extracted from selfKeywordsForLang()
self_keywords: []

# Parent context type mapping — extracted from resolveParentContext()
context_types:
  class_declaration: Class
  class_definition: Class
  interface_declaration: Interface
  struct_declaration: Struct
  trait_declaration: Trait
  namespace_declaration: Namespace
  enum_declaration: Enum
  function_declaration: Function
  function_definition: Function
  method_declaration: Method
  method_definition: Method

# Anonymous function types for variable_declarator resolution — extracted from resolveParentContext()
anon_func_types: []

# Declaration types for docstring attachment — extracted from declarationTypes map
declaration_types:
  - function_declaration
  - method_declaration
  - method_definition
  - function_definition
  - function_item
  - class_declaration
  - class_definition
  - struct_item
  - interface_declaration
  - trait_item
  - enum_item
  - enum_declaration
  - struct_declaration
  - type_item
  - protocol_declaration
  - namespace_definition
  - variable_declarator
  - lexical_declaration
  - property_declaration

# Comment node types for docstring extraction — extracted from isCommentNode()
comment_types:
  - comment
  - block_comment
  - line_comment
