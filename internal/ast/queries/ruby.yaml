language: ruby
grammar: tree-sitter-ruby
extensions: [".rb"]
queries:
  # === Entity queries ===
  - data_key: functions
    graph_label: Function
    pattern: '(method name: (identifier) @name)'
  - data_key: functions
    graph_label: Function
    pattern: '(singleton_method name: (identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(class name: (constant) @name)'
  - data_key: modules
    graph_label: Module
    pattern: '(module name: (constant) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(call method: (identifier) @_method arguments: (argument_list (string (string_content) @name)) (#eq? @_method "require"))'
  - data_key: imports
    graph_label: Module
    pattern: '(call method: (identifier) @_method arguments: (argument_list (string (string_content) @name)) (#eq? @_method "require_relative"))'
  - data_key: variables
    graph_label: Variable
    pattern: '(assignment left: (constant) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(method_parameters (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(instance_variable) @name'

  # === Relation queries ===
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call method: (identifier) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(class superclass: (superclass (constant) @name))'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(call method: (identifier) @_method arguments: (argument_list (constant) @name) (#eq? @_method "include"))'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(call method: (identifier) @_method arguments: (argument_list (constant) @name) (#eq? @_method "extend"))'

# Export detection strategy — Ruby treats _prefix names as private by convention
exports:
  strategy: no_prefix
  config:
    prefix: "_"

# Self/this keywords for receiver type resolution
self_keywords: ["self."]

# Parent context type mapping — Ruby tree-sitter node types only
# Used by resolveParentContext() to walk up the AST and find enclosing scope.
context_types:
  class: Class
  module: Module
  method: Method
  singleton_method: Method
  singleton_class: Class

# Ruby has lambda, block, and do_block as anonymous function types
anon_func_types:
  - lambda
  - block
  - do_block

# Declaration node types that can have docstrings (comments immediately above).
# Ruby tree-sitter uses these exact node types.
declaration_types:
  - method
  - singleton_method
  - class
  - module
  - singleton_class

# Ruby tree-sitter uses a single "comment" node type for # comments
comment_types:
  - comment

# Entry point scoring rules for Ruby
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "Test*"
      score: 60
    - pattern: "test_*"
      score: 60
    - pattern: initialize
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "cmd*"
      score: 20
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  # Ruby has no decorators/annotations — this section is intentionally empty
  decorators: []

# Import detection (language-level framework detection)
import_detection:
  - pattern: rails
    match: prefix
    framework: rails
    category: web
  - pattern: sinatra
    match: prefix
    framework: sinatra
    category: web
  - pattern: rspec
    match: prefix
    framework: rspec
    category: test
  - pattern: sidekiq
    match: prefix
    framework: sidekiq
    category: async
