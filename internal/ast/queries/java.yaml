language: java
extensions: [".java"]
queries:
  - data_key: functions
    graph_label: Function
    pattern: '(method_declaration name: (identifier) @name)'
  - data_key: functions
    graph_label: Function
    pattern: '(constructor_declaration name: (identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration name: (identifier) @name)'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(interface_declaration name: (identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_declaration name: (identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(import_declaration (scoped_identifier) @name)'
  - data_key: packages
    graph_label: Package
    pattern: '(package_declaration (scoped_identifier) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(local_variable_declaration declarator: (variable_declarator name: (identifier) @name))'
  - data_key: decorators
    pattern: '(marker_annotation name: (identifier) @name)'
  - data_key: decorators
    pattern: '(annotation name: (identifier) @name)'
  - data_key: calls
    pattern: '(method_invocation name: (identifier) @name)'
  - data_key: instantiations
    pattern: '(object_creation_expression type: (type_identifier) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(formal_parameter name: (identifier) @name)'
  - data_key: heritage
    pattern: '(superclass (type_identifier) @name)'
  - data_key: implements
    pattern: '(super_interfaces (type_list (type_identifier) @name))'
  - data_key: fields
    graph_label: Field
    pattern: '(field_declaration declarator: (variable_declarator name: (identifier) @name))'
  - data_key: field_reads
    pattern: '(field_access field: (identifier) @name)'
  - data_key: field_writes
    pattern: '(assignment_expression left: (field_access field: (identifier) @name))'

# Export detection strategy — extracted from detectExports()
exports:
  strategy: modifier
  config:
    keyword: "public"

# Self/this keywords for receiver type resolution — extracted from selfKeywordsForLang()
self_keywords: ["this."]

# Parent context type mapping — extracted from resolveParentContext()
context_types:
  class_declaration: Class
  class_definition: Class
  interface_declaration: Interface
  struct_declaration: Struct
  trait_declaration: Trait
  namespace_declaration: Namespace
  enum_declaration: Enum
  function_declaration: Function
  function_definition: Function
  method_declaration: Method
  method_definition: Method

# Anonymous function types for variable_declarator resolution — extracted from resolveParentContext()
anon_func_types: []

# Declaration types for docstring attachment — extracted from declarationTypes map
declaration_types:
  - function_declaration
  - method_declaration
  - method_definition
  - function_definition
  - function_item
  - class_declaration
  - class_definition
  - struct_item
  - interface_declaration
  - trait_item
  - enum_item
  - enum_declaration
  - struct_declaration
  - type_item
  - protocol_declaration
  - namespace_definition
  - variable_declarator
  - lexical_declaration
  - property_declaration

# Comment node types for docstring extraction — extracted from isCommentNode()
comment_types:
  - comment
  - block_comment
  - line_comment
