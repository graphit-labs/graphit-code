language: java
grammar: tree-sitter-java
extensions: [".java"]
# Target resolution: a relation captures its target by NAME, and the name alone does
# not say what kind of thing it is. Without this the target could match any label the
# grammar declares — a Parameter sharing the called function's name.
target_rules:
  CALLS: { labels: [Function, Constructor, Package] }
  READS_FIELD: { labels: [Field] }
  WRITES_FIELD: { labels: [Field] }
queries:
  # === Entity queries ===
  - data_key: functions
    graph_label: Function
    pattern: '(method_declaration name: (identifier) @name)'
  - data_key: functions
    graph_label: Constructor
    pattern: '(constructor_declaration name: (identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration name: (identifier) @name)'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(interface_declaration name: (identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_declaration name: (identifier) @name)'
  - data_key: classes
    graph_label: Record
    pattern: '(record_declaration name: (identifier) @name)'
  - data_key: classes
    graph_label: Annotation
    pattern: '(annotation_type_declaration name: (identifier) @name)'
  - data_key: imports
    graph_label: Import
    pattern: '(import_declaration (scoped_identifier) @name)'
  - data_key: packages
    graph_label: Package
    pattern: '(package_declaration (scoped_identifier) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(local_variable_declaration declarator: (variable_declarator name: (identifier) @name))'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(formal_parameter name: (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(field_declaration declarator: (variable_declarator name: (identifier) @name))'

  # Declared literal values — the literal becomes a node contained by the name, so
  # that "which constant holds this URL" is reachable by search.
  - data_key: fields
    graph_label: Field
    pattern: '(field_declaration declarator: (variable_declarator name: (identifier) @name value: [(decimal_integer_literal) (hex_integer_literal) (octal_integer_literal) (binary_integer_literal) (decimal_floating_point_literal) (hex_floating_point_literal) (true) (false) (null_literal) (character_literal) (string_literal)] @value))'
    value_capture: value
    value_label: Value
  - data_key: variables
    graph_label: Variable
    pattern: '(local_variable_declaration declarator: (variable_declarator name: (identifier) @name value: [(decimal_integer_literal) (hex_integer_literal) (decimal_floating_point_literal) (true) (false) (null_literal) (character_literal) (string_literal)] @value))'
    value_capture: value
    value_label: Value

  # === Relation queries ===
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(marker_annotation name: (identifier) @name)'
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(annotation name: (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(method_invocation name: (identifier) @name)'
  - data_key: instantiations
    type: relation
    relation_type: INSTANTIATES
    pattern: '(object_creation_expression type: (type_identifier) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(superclass (type_identifier) @name)'
  - data_key: implements
    type: relation
    relation_type: IMPLEMENTS
    pattern: '(super_interfaces (type_list (type_identifier) @name))'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(field_access field: (identifier) @name)'
  - data_key: field_writes
    type: relation
    relation_type: WRITES_FIELD
    pattern: '(assignment_expression left: (field_access field: (identifier) @name))'

# Export detection strategy — Java uses public modifier
exports:
  strategy: modifier
  config:
    keyword: "public"

# Self/this keywords for receiver type resolution
self_keywords: ["this."]

# Parent context type mapping — Java tree-sitter node types only
context_types:
  class_declaration: Class
  interface_declaration: Interface
  enum_declaration: Enum
  record_declaration: Record
  method_declaration: Method
  # A constructor is a container too: without it, its parameters resolve to the
  # enclosing class and read as fields of the type rather than arguments.
  constructor_declaration: Constructor

# Anonymous function types for variable_declarator resolution
anon_func_types:
  - lambda_expression

# Declaration types for docstring attachment — Java node types only
declaration_types:
  - method_declaration
  - class_declaration
  - interface_declaration
  - enum_declaration
  - constructor_declaration
  - record_declaration
  - annotation_type_declaration
  - field_declaration

# Comment node types for docstring extraction — Java has line_comment and block_comment
comment_types:
  - line_comment
  - block_comment

# Cyclomatic complexity: real syntax-tree branches, not a text scan. Verified
# against the actual grammar. switch_label fires for both `case` and
# `default`, so a bare switch/default with no case labels still adds one —
# a minor, accepted deviation from the other languages here.
complexity:
  node_types:
    - if_statement
    - for_statement
    - while_statement
    - switch_label
    - catch_clause
    - ternary_expression
  operators: ["&&", "||"]

# Labels of this language that get a vector, so semantic search reaches them and
# not only keyword search. Order decides which label keeps a (path, uid) that two
# of them claim -- earlier wins. Every entity is in the keyword index regardless;
# this list is only about meaning. See docs/specs/ast_module.md.
embed_labels:
  - Class
  - Interface
  - Enum
  - Record
  - Function
  - Constructor
  - Field
  - Package
  - Variable
  - Comment
