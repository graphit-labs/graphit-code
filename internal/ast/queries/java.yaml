language: java
grammar: tree-sitter-java
extensions: [".java"]
queries:
  # === Entity queries ===
  - data_key: functions
    graph_label: Function
    pattern: '(method_declaration name: (identifier) @name)'
  - data_key: functions
    graph_label: Function
    pattern: '(constructor_declaration name: (identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration name: (identifier) @name)'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(interface_declaration name: (identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_declaration name: (identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(record_declaration name: (identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(annotation_type_declaration name: (identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(import_declaration (scoped_identifier) @name)'
  - data_key: packages
    graph_label: Package
    pattern: '(package_declaration (scoped_identifier) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(local_variable_declaration declarator: (variable_declarator name: (identifier) @name))'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(formal_parameter name: (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(field_declaration declarator: (variable_declarator name: (identifier) @name))'

  # === Relation queries ===
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(marker_annotation name: (identifier) @name)'
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(annotation name: (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(method_invocation name: (identifier) @name)'
  - data_key: instantiations
    type: relation
    relation_type: INSTANTIATES
    pattern: '(object_creation_expression type: (type_identifier) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(superclass (type_identifier) @name)'
  - data_key: implements
    type: relation
    relation_type: IMPLEMENTS
    pattern: '(super_interfaces (type_list (type_identifier) @name))'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(field_access field: (identifier) @name)'
  - data_key: field_writes
    type: relation
    relation_type: WRITES_FIELD
    pattern: '(assignment_expression left: (field_access field: (identifier) @name))'

# Export detection strategy — Java uses public modifier
exports:
  strategy: modifier
  config:
    keyword: "public"

# Self/this keywords for receiver type resolution
self_keywords: ["this."]

# Parent context type mapping — Java tree-sitter node types only
context_types:
  class_declaration: Class
  interface_declaration: Interface
  enum_declaration: Enum
  record_declaration: Class
  method_declaration: Method

# Anonymous function types for variable_declarator resolution
anon_func_types:
  - lambda_expression

# Declaration types for docstring attachment — Java node types only
declaration_types:
  - method_declaration
  - class_declaration
  - interface_declaration
  - enum_declaration
  - constructor_declaration
  - record_declaration
  - annotation_type_declaration
  - field_declaration

# Comment node types for docstring extraction — Java has line_comment and block_comment
comment_types:
  - line_comment
  - block_comment

# Entry point scoring rules for Java
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "Test*"
      score: 60
    - pattern: "test*"
      score: 60
    - pattern: init
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "*Servlet"
      score: 30
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  decorators:
    # Spring HTTP route annotations
    - name: GetMapping
      score: 70
    - name: PostMapping
      score: 70
    - name: PutMapping
      score: 70
    - name: DeleteMapping
      score: 70
    - name: PatchMapping
      score: 70
    - name: RequestMapping
      score: 70
    # Jakarta/JAX-RS annotations
    - name: GET
      score: 70
    - name: POST
      score: 70
    - name: PUT
      score: 70
    - name: DELETE
      score: 70
    - name: PATCH
      score: 70
    - name: Path
      score: 60
    # Test annotations
    - name: Test
      score: 60
    - name: ParameterizedTest
      score: 60
    - name: RepeatedTest
      score: 60
    - name: BeforeEach
      score: 40
    - name: AfterEach
      score: 40
    - name: BeforeAll
      score: 40
    - name: AfterAll
      score: 40
    # Controller/Service annotations
    - name: Controller
      score: 50
    - name: RestController
      score: 50
    - name: Service
      score: 40
    - name: Component
      score: 30
    - name: Bean
      score: 40
    - name: Configuration
      score: 40
    # Scheduling
    - name: Scheduled
      score: 50
    - name: EventListener
      score: 50

# Import detection (Java framework detection)
import_detection:
  - pattern: "org.springframework"
    match: prefix
    framework: spring
    category: web
  - pattern: "jakarta.ws.rs"
    match: prefix
    framework: jaxrs
    category: web
  - pattern: "javax.ws.rs"
    match: prefix
    framework: jaxrs
    category: web
  - pattern: "jakarta.servlet"
    match: prefix
    framework: servlet
    category: web
  - pattern: "org.junit"
    match: prefix
    framework: junit
    category: test
  - pattern: "org.mockito"
    match: prefix
    framework: mockito
    category: test
  - pattern: "org.hibernate"
    match: prefix
    framework: hibernate
    category: orm
  - pattern: "jakarta.persistence"
    match: prefix
    framework: jpa
    category: orm
  - pattern: "javax.persistence"
    match: prefix
    framework: jpa
    category: orm
  - pattern: "org.mybatis"
    match: prefix
    framework: mybatis
    category: orm
  - pattern: "org.apache.kafka"
    match: prefix
    framework: kafka
    category: messaging
  - pattern: "com.google.gson"
    match: prefix
    framework: gson
    category: serialization
  - pattern: "com.fasterxml.jackson"
    match: prefix
    framework: jackson
    category: serialization
  - pattern: "io.grpc"
    match: prefix
    framework: grpc
    category: rpc
  - pattern: "org.slf4j"
    match: prefix
    framework: slf4j
    category: logging
  - pattern: "org.apache.logging.log4j"
    match: prefix
    framework: log4j
    category: logging
  - pattern: "lombok"
    match: prefix
    framework: lombok
    category: codegen
  - pattern: "io.micronaut"
    match: prefix
    framework: micronaut
    category: web
  - pattern: "io.quarkus"
    match: prefix
    framework: quarkus
    category: web
