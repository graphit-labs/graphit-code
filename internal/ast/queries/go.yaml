language: go
extensions: [".go"]
queries:
  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration name: (identifier) @name)'
  - data_key: methods
    graph_label: Method
    pattern: '(method_declaration name: (field_identifier) @name)'
  - data_key: structs
    graph_label: Struct
    pattern: '(type_declaration (type_spec name: (type_identifier) @name type: (struct_type)))'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(type_declaration (type_spec name: (type_identifier) @name type: (interface_type)))'
  - data_key: types
    graph_label: Type
    pattern: '(type_declaration (type_spec name: (type_identifier) @name))'
  - data_key: constants
    graph_label: Constant
    pattern: '(const_spec name: (identifier) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(var_spec name: (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (selector_expression field: (field_identifier) @name))'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameter_declaration name: (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(field_declaration name: (field_identifier) @name)'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(selector_expression field: (field_identifier) @name)'
  - data_key: field_writes
    type: relation
    relation_type: WRITES_FIELD
    pattern: '(assignment_statement left: (expression_list (selector_expression field: (field_identifier) @name)))'

# Export detection strategy — extracted from detectExports()
exports:
  strategy: capitalized_name

# Self/this keywords for receiver type resolution — extracted from selfKeywordsForLang()
self_keywords: []

# Parent context type mapping — extracted from resolveParentContext()
context_types:
  class_declaration: Class
  class_definition: Class
  interface_declaration: Interface
  struct_declaration: Struct
  trait_declaration: Trait
  namespace_declaration: Namespace
  enum_declaration: Enum
  function_declaration: Function
  function_definition: Function
  method_declaration: Method
  method_definition: Method

# Anonymous function types for variable_declarator resolution — extracted from resolveParentContext()
anon_func_types: []

# Declaration types for docstring attachment — extracted from declarationTypes map
declaration_types:
  - function_declaration
  - method_declaration
  - method_definition
  - function_definition
  - function_item
  - class_declaration
  - class_definition
  - struct_item
  - interface_declaration
  - trait_item
  - enum_item
  - enum_declaration
  - struct_declaration
  - type_item
  - protocol_declaration
  - namespace_definition
  - variable_declarator
  - lexical_declaration
  - property_declaration

# Comment node types for docstring extraction — extracted from isCommentNode()
comment_types:
  - comment
  - block_comment
  - line_comment

# Entry point scoring rules (base language rules)
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "Test*"
      score: 60
    - pattern: "test_*"
      score: 60
    - pattern: init
      score: 70              # Go override: init() is more significant (base: 40)
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "cmd*"
      score: 20
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  decorators:
    # HTTP route decorators
    - name: GetMapping
      score: 70
    - name: PostMapping
      score: 70
    - name: PutMapping
      score: 70
    - name: DeleteMapping
      score: 70
    - name: RequestMapping
      score: 70
    - name: HttpGet
      score: 70
    - name: HttpPost
      score: 70
    - name: HttpPut
      score: 70
    - name: HttpDelete
      score: 70
    - name: Get
      score: 70
    - name: Post
      score: 70
    - name: Put
      score: 70
    - name: Delete
      score: 70
    - name: Route
      score: 70
    - name: route
      score: 70
    - name: "app.get"
      score: 70
    - name: "app.post"
      score: 70
    - name: "app.put"
      score: 70
    - name: "app.delete"
      score: 70
    # Test decorators
    - name: Test
      score: 60
    - name: test
      score: 60
    - name: pytest.fixture
      score: 60
    # Controller decorators
    - name: Controller
      score: 50
    - name: RestController
      score: 50
    - name: ApiController
      score: 50

# Import detection (language-level framework detection)
import_detection:
  - pattern: "github.com/gin-gonic/gin"
    match: prefix
    framework: gin
    category: web
  - pattern: "github.com/labstack/echo"
    match: prefix
    framework: echo
    category: web
  - pattern: "github.com/gofiber/fiber"
    match: prefix
    framework: fiber
    category: web
  - pattern: "github.com/gorilla/mux"
    match: prefix
    framework: gorilla
    category: web
  - pattern: "github.com/go-chi/chi"
    match: prefix
    framework: chi
    category: web
  - pattern: "net/http"
    match: prefix
    framework: stdlib
    category: web
  - pattern: "google.golang.org/grpc"
    match: prefix
    framework: grpc
    category: rpc
  - pattern: "google.golang.org/protobuf"
    match: prefix
    framework: protobuf
    category: serialization
  - pattern: "gorm.io/gorm"
    match: prefix
    framework: gorm
    category: orm
  - pattern: "github.com/jmoiron/sqlx"
    match: prefix
    framework: sqlx
    category: orm
  - pattern: "go.uber.org/zap"
    match: prefix
    framework: zap
    category: logging
  - pattern: "github.com/stretchr/testify"
    match: prefix
    framework: testify
    category: test
  - pattern: "github.com/spf13/cobra"
    match: prefix
    framework: cobra
    category: cli
  - pattern: "github.com/spf13/viper"
    match: prefix
    framework: viper
    category: config
