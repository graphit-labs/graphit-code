language: go
grammar: tree-sitter-go
extensions: [".go"]
queries:
  # === Entity queries ===
  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration name: (identifier) @name)'
  - data_key: methods
    graph_label: Method
    pattern: '(method_declaration name: (field_identifier) @name)'
  - data_key: structs
    graph_label: Struct
    pattern: '(type_declaration (type_spec name: (type_identifier) @name type: (struct_type)))'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(type_declaration (type_spec name: (type_identifier) @name type: (interface_type)))'
  - data_key: types
    graph_label: Type
    pattern: '(type_declaration (type_spec name: (type_identifier) @name))'
  - data_key: constants
    graph_label: Constant
    pattern: '(const_spec name: (identifier) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(var_spec name: (identifier) @name)'
  - data_key: imports
    graph_label: Import
    pattern: '(import_spec path: (interpreted_string_literal) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameter_declaration name: (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(field_declaration name: (field_identifier) @name)'

  # === Relation queries ===
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (selector_expression field: (field_identifier) @name))'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(selector_expression field: (field_identifier) @name)'
  - data_key: field_writes
    type: relation
    relation_type: WRITES_FIELD
    pattern: '(assignment_statement left: (expression_list (selector_expression field: (field_identifier) @name)))'

# Go export detection: capitalized names are public
exports:
  strategy: capitalized_name

# Go has no self/this keyword — receivers are explicit named parameters
self_keywords: []

# Parent context type mapping — Go tree-sitter node types only
# Used by resolveParentContextWASM() to walk up the AST and find enclosing scope.
# Go structs: field_identifier → field_declaration → field_declaration_list → struct_type → type_spec
# Go functions: identifier → parameter_declaration → parameter_list → function_declaration
# Go methods: field_identifier → parameter_declaration → parameter_list → method_declaration
context_types:
  type_spec: Struct
  function_declaration: Function
  method_declaration: Method

# Go has no anonymous function expressions with variable_declarator pattern
# Go uses func_literal but it's not assigned via variable_declarator syntax
anon_func_types: []

# Declaration node types that can have docstrings (comments immediately above).
# Go tree-sitter uses these exact node types as top-level declaration wrappers.
declaration_types:
  - function_declaration
  - method_declaration
  - type_declaration
  - var_declaration
  - const_declaration

# Go tree-sitter uses a single "comment" node type for both // and /* */ comments
comment_types:
  - comment

# Entry point scoring rules for Go
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: init
      score: 70
    - pattern: "Test*"
      score: 60
    - pattern: "Benchmark*"
      score: 50
    - pattern: "Example*"
      score: 40
    - pattern: "Fuzz*"
      score: 50
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "Handle*"
      score: 30
    - pattern: "Serve*"
      score: 30
    - pattern: "Run*"
      score: 20
    - pattern: "Start*"
      score: 20
    - pattern: "cmd*"
      score: 20

  exported_bonus: 10
  max_score: 100

  # Go has no decorators/annotations — this section is intentionally empty
  decorators: []

# Import detection (language-level framework detection)
import_detection:
  - pattern: "github.com/gin-gonic/gin"
    match: prefix
    framework: gin
    category: web
  - pattern: "github.com/labstack/echo"
    match: prefix
    framework: echo
    category: web
  - pattern: "github.com/gofiber/fiber"
    match: prefix
    framework: fiber
    category: web
  - pattern: "github.com/gorilla/mux"
    match: prefix
    framework: gorilla
    category: web
  - pattern: "github.com/go-chi/chi"
    match: prefix
    framework: chi
    category: web
  - pattern: "net/http"
    match: prefix
    framework: stdlib
    category: web
  - pattern: "google.golang.org/grpc"
    match: prefix
    framework: grpc
    category: rpc
  - pattern: "google.golang.org/protobuf"
    match: prefix
    framework: protobuf
    category: serialization
  - pattern: "gorm.io/gorm"
    match: prefix
    framework: gorm
    category: orm
  - pattern: "github.com/jmoiron/sqlx"
    match: prefix
    framework: sqlx
    category: orm
  - pattern: "go.uber.org/zap"
    match: prefix
    framework: zap
    category: logging
  - pattern: "github.com/stretchr/testify"
    match: prefix
    framework: testify
    category: test
  - pattern: "github.com/spf13/cobra"
    match: prefix
    framework: cobra
    category: cli
  - pattern: "github.com/spf13/viper"
    match: prefix
    framework: viper
    category: config
  - pattern: "database/sql"
    match: prefix
    framework: database-sql
    category: database
  - pattern: "github.com/redis/go-redis"
    match: prefix
    framework: go-redis
    category: cache
  - pattern: "github.com/nats-io/nats.go"
    match: prefix
    framework: nats
    category: messaging
  - pattern: "github.com/segmentio/kafka-go"
    match: prefix
    framework: kafka-go
    category: messaging
  - pattern: "github.com/prometheus/client_golang"
    match: prefix
    framework: prometheus
    category: observability
