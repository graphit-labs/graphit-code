language: kotlin
extensions: [".kt", ".kts"]
queries:
  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration (simple_identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration (type_identifier) @name)'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(class_declaration (type_identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(class_declaration (type_identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(import_header (identifier) @name)'
  - data_key: packages
    graph_label: Package
    pattern: '(package_header (identifier) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(property_declaration (variable_declaration (simple_identifier) @name))'
  - data_key: decorators
    pattern: '(annotation (user_type (type_identifier) @name))'
  - data_key: calls
    pattern: '(call_expression (simple_identifier) @name)'
  - data_key: calls
    pattern: '(call_expression (navigation_expression (simple_identifier) @name))'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameter (simple_identifier) @name)'
  - data_key: heritage
    pattern: '(delegation_specifier (user_type (type_identifier) @name))'
  - data_key: fields
    graph_label: Field
    pattern: '(class_body (property_declaration (variable_declaration (simple_identifier) @name)))'
  - data_key: field_reads
    pattern: '(navigation_expression (simple_identifier) @name)'

# Export detection strategy — extracted from detectExports()
exports:
  strategy: modifier
  config:
    keyword: "public"

# Self/this keywords for receiver type resolution — extracted from selfKeywordsForLang()
self_keywords: ["this."]

# Parent context type mapping — extracted from resolveParentContext()
context_types:
  class_declaration: Class
  class_definition: Class
  interface_declaration: Interface
  struct_declaration: Struct
  trait_declaration: Trait
  namespace_declaration: Namespace
  enum_declaration: Enum
  function_declaration: Function
  function_definition: Function
  method_declaration: Method
  method_definition: Method

# Anonymous function types for variable_declarator resolution — extracted from resolveParentContext()
anon_func_types: []

# Declaration types for docstring attachment — extracted from declarationTypes map
declaration_types:
  - function_declaration
  - method_declaration
  - method_definition
  - function_definition
  - function_item
  - class_declaration
  - class_definition
  - struct_item
  - interface_declaration
  - trait_item
  - enum_item
  - enum_declaration
  - struct_declaration
  - type_item
  - protocol_declaration
  - namespace_definition
  - variable_declarator
  - lexical_declaration
  - property_declaration

# Comment node types for docstring extraction — extracted from isCommentNode()
comment_types:
  - comment
  - block_comment
  - line_comment
