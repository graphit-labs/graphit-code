language: kotlin
grammar: tree-sitter-kotlin
extensions: [".kt", ".kts"]
queries:
  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration (simple_identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration (type_identifier) @name)'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(class_declaration (type_identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(class_declaration (type_identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(import_header (identifier) @name)'
  - data_key: packages
    graph_label: Package
    pattern: '(package_header (identifier) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(property_declaration (variable_declaration (simple_identifier) @name))'
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(annotation (user_type (type_identifier) @name))'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression (simple_identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression (navigation_expression (simple_identifier) @name))'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameter (simple_identifier) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(delegation_specifier (user_type (type_identifier) @name))'
  - data_key: fields
    graph_label: Field
    pattern: '(class_body (property_declaration (variable_declaration (simple_identifier) @name)))'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(navigation_expression (simple_identifier) @name)'

# Export detection strategy — extracted from detectExports()
exports:
  strategy: modifier
  config:
    keyword: "public"

# Self/this keywords for receiver type resolution — extracted from selfKeywordsForLang()
self_keywords: ["this."]

# Parent context type mapping — extracted from resolveParentContext()
context_types:
  class_declaration: Class
  class_definition: Class
  interface_declaration: Interface
  struct_declaration: Struct
  trait_declaration: Trait
  namespace_declaration: Namespace
  enum_declaration: Enum
  function_declaration: Function
  function_definition: Function
  method_declaration: Method
  method_definition: Method

# Anonymous function types for variable_declarator resolution — extracted from resolveParentContext()
anon_func_types: []

# Declaration types for docstring attachment — extracted from declarationTypes map
declaration_types:
  - function_declaration
  - method_declaration
  - method_definition
  - function_definition
  - function_item
  - class_declaration
  - class_definition
  - struct_item
  - interface_declaration
  - trait_item
  - enum_item
  - enum_declaration
  - struct_declaration
  - type_item
  - protocol_declaration
  - namespace_definition
  - variable_declarator
  - lexical_declaration
  - property_declaration

# Comment node types for docstring extraction — extracted from isCommentNode()
comment_types:
  - comment
  - block_comment
  - line_comment

# Entry point scoring rules (base language rules)
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "Test*"
      score: 60
    - pattern: "test_*"
      score: 60
    - pattern: init
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "cmd*"
      score: 20
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  decorators:
    # HTTP route decorators
    - name: GetMapping
      score: 70
    - name: PostMapping
      score: 70
    - name: PutMapping
      score: 70
    - name: DeleteMapping
      score: 70
    - name: RequestMapping
      score: 70
    - name: HttpGet
      score: 70
    - name: HttpPost
      score: 70
    - name: HttpPut
      score: 70
    - name: HttpDelete
      score: 70
    - name: Get
      score: 70
    - name: Post
      score: 70
    - name: Put
      score: 70
    - name: Delete
      score: 70
    - name: Route
      score: 70
    - name: route
      score: 70
    - name: "app.get"
      score: 70
    - name: "app.post"
      score: 70
    - name: "app.put"
      score: 70
    - name: "app.delete"
      score: 70
    # Test decorators
    - name: Test
      score: 60
    - name: test
      score: 60
    - name: pytest.fixture
      score: 60
    # Controller decorators
    - name: Controller
      score: 50
    - name: RestController
      score: 50
    - name: ApiController
      score: 50
