language: kotlin
grammar: tree-sitter-kotlin
extensions: [".kt", ".kts"]
queries:
  # === Entity queries ===
  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration (simple_identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration (type_identifier) @name)'
  - data_key: objects
    graph_label: Class
    pattern: '(object_declaration (type_identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(import_header (identifier) @name)'
  - data_key: packages
    graph_label: Package
    pattern: '(package_header (identifier) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(property_declaration (variable_declaration (simple_identifier) @name))'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameter (simple_identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(class_body (property_declaration (variable_declaration (simple_identifier) @name)))'

  # === Relation queries ===
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(annotation (user_type (type_identifier) @name))'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression (simple_identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression (navigation_expression (simple_identifier) @name))'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(delegation_specifier (user_type (type_identifier) @name))'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(navigation_expression (simple_identifier) @name)'

# Export detection strategy — Kotlin defaults to public (no modifier needed)
exports:
  strategy: no_modifier
  config_list:
    keywords: ["private", "protected", "internal"]

# Self/this keywords for receiver type resolution
self_keywords: ["this."]

# Parent context type mapping — Kotlin tree-sitter node types only
# Note: Kotlin uses class_declaration for classes, interfaces, and enums alike
context_types:
  class_declaration: Class
  object_declaration: Class
  companion_object: Class
  function_declaration: Function

# Anonymous function types for variable_declarator resolution
anon_func_types:
  - anonymous_function
  - lambda_literal

# Declaration types for docstring attachment — Kotlin node types only
declaration_types:
  - function_declaration
  - class_declaration
  - object_declaration
  - companion_object
  - property_declaration

# Comment node types for docstring extraction — Kotlin has line_comment and multiline_comment
comment_types:
  - line_comment
  - multiline_comment

# Entry point scoring rules for Kotlin
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "Test*"
      score: 60
    - pattern: "test*"
      score: 60
    - pattern: init
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  decorators:
    # Spring/Ktor HTTP route annotations
    - name: GetMapping
      score: 70
    - name: PostMapping
      score: 70
    - name: PutMapping
      score: 70
    - name: DeleteMapping
      score: 70
    - name: PatchMapping
      score: 70
    - name: RequestMapping
      score: 70
    # Test annotations
    - name: Test
      score: 60
    - name: ParameterizedTest
      score: 60
    - name: BeforeEach
      score: 40
    - name: AfterEach
      score: 40
    - name: BeforeAll
      score: 40
    - name: AfterAll
      score: 40
    # Controller/Service annotations (Spring in Kotlin)
    - name: Controller
      score: 50
    - name: RestController
      score: 50
    - name: Service
      score: 40
    - name: Component
      score: 30
    # Compose/Android annotations
    - name: Composable
      score: 50
    - name: Preview
      score: 40
    # Serialization
    - name: Serializable
      score: 30

# Import detection (Kotlin framework detection)
import_detection:
  - pattern: "org.springframework"
    match: prefix
    framework: spring
    category: web
  - pattern: "io.ktor"
    match: prefix
    framework: ktor
    category: web
  - pattern: "org.junit"
    match: prefix
    framework: junit
    category: test
  - pattern: "kotlin.test"
    match: prefix
    framework: kotlin-test
    category: test
  - pattern: "kotlinx.coroutines"
    match: prefix
    framework: coroutines
    category: async
  - pattern: "kotlinx.serialization"
    match: prefix
    framework: kotlinx-serialization
    category: serialization
  - pattern: "org.jetbrains.exposed"
    match: prefix
    framework: exposed
    category: orm
  - pattern: "androidx.compose"
    match: prefix
    framework: compose
    category: ui
  - pattern: "io.grpc"
    match: prefix
    framework: grpc
    category: rpc
  - pattern: "org.apache.kafka"
    match: prefix
    framework: kafka
    category: messaging
  - pattern: "com.fasterxml.jackson"
    match: prefix
    framework: jackson
    category: serialization
  - pattern: "dagger"
    match: prefix
    framework: dagger
    category: di
  - pattern: "koin"
    match: prefix
    framework: koin
    category: di
