language: swift
grammar: tree-sitter-swift
extensions: [".swift"]
# Target resolution: a relation captures its target by NAME, and the name alone does
# not say what kind of thing it is. Without this the target could match any label the
# grammar declares — a Parameter sharing the called function's name.
target_rules:
  CALLS: { labels: [Function] }
  READS_FIELD: { labels: [Field] }
queries:
  # === Entity queries ===
  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration name: (simple_identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration "class" name: (type_identifier) @name)'
  - data_key: structs
    graph_label: Struct
    pattern: '(class_declaration "struct" name: (type_identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(class_declaration "enum" name: (type_identifier) @name)'
  - data_key: protocols
    graph_label: Protocol
    pattern: '(protocol_declaration name: (type_identifier) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(property_declaration (pattern (simple_identifier) @name))'

  # Declared literal values — the literal becomes a node contained by the name.
  - data_key: variables
    graph_label: Variable
    pattern: '(property_declaration name: (pattern bound_identifier: (simple_identifier) @name) value: [(integer_literal) (real_literal) (hex_literal) (oct_literal) (bin_literal) (boolean_literal) (line_string_literal) (nil_literal)] @value)'
    value_capture: value
    value_label: Value
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameter name: (simple_identifier) @name)'

  # === Relation queries ===
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression (simple_identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression (navigation_expression (simple_identifier) @name))'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(inheritance_specifier (user_type (type_identifier) @name))'
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(attribute (user_type (type_identifier) @name))'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(navigation_expression (simple_identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(class_body (property_declaration (pattern (simple_identifier) @name)))'

# Swift export detection: anything not private/fileprivate is public
exports:
  strategy: no_modifier
  config_list:
    keywords: ["private", "fileprivate"]

# Swift uses 'self' for receiver type resolution
self_keywords: ["self.", "Self."]

# Parent context type mapping — Swift tree-sitter node types only
context_types:
  class_declaration: Class
  protocol_declaration: Protocol
  function_declaration: Function

# Swift has no anonymous function expressions via variable_declarator
anon_func_types: []

# Declaration node types for docstring attachment — Swift tree-sitter only
declaration_types:
  - function_declaration
  - class_declaration
  - protocol_declaration
  - property_declaration

# Swift tree-sitter uses "comment" and "multiline_comment" node types
comment_types:
  - comment
  - multiline_comment

# Cyclomatic complexity: real syntax-tree branches, not a text scan. Verified
# against the actual grammar. && / || are wrapped in conjunction_expression /
# disjunction_expression here, not bare tokens — do not also list them as
# operators, or every one would be counted twice. switch_entry fires for the
# default case too, so a bare switch with no other entry still adds one.
complexity:
  node_types:
    - if_statement
    - for_statement
    - while_statement
    - switch_entry
    - catch_block
    - ternary_expression
    - conjunction_expression
    - disjunction_expression

# Labels of this language that get a vector, so semantic search reaches them and
# not only keyword search. Order decides which label keeps a (path, uid) that two
# of them claim -- earlier wins. Every entity is in the keyword index regardless;
# this list is only about meaning. See docs/specs/ast_module.md.
embed_labels:
  - Class
  - Struct
  - Protocol
  - Enum
  - Function
  - Field
  - Variable
  - Comment
