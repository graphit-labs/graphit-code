

language: vue
grammar: tree-sitter-vue
extensions: [".vue"]

queries:

  - data_key: elements
    graph_label: Element
    pattern: '(start_tag (tag_name) @name)'
  - data_key: elements
    graph_label: Element
    pattern: '(self_closing_tag (tag_name) @name)'

  - data_key: attributes
    graph_label: Attribute
    pattern: '(start_tag (tag_name) @element (attribute (attribute_name) @name (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: AttributeValue
  - data_key: attributes
    graph_label: Attribute
    pattern: '(self_closing_tag (tag_name) @element (attribute (attribute_name) @name (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: AttributeValue

  - data_key: attributes
    graph_label: Attribute
    pattern: '(start_tag (tag_name) @element (attribute (attribute_name) @name (attribute_value) @value))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: AttributeValue
  - data_key: attributes
    graph_label: Attribute
    pattern: '(self_closing_tag (tag_name) @element (attribute (attribute_name) @name (attribute_value) @value))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: AttributeValue

  - data_key: attributes
    graph_label: Attribute
    pattern: '(start_tag (tag_name) @element (attribute (attribute_name) @name))'
    parent_capture: element
    parent_label: Element
  - data_key: attributes
    graph_label: Attribute
    pattern: '(self_closing_tag (tag_name) @element (attribute (attribute_name) @name))'
    parent_capture: element
    parent_label: Element

  - data_key: element_text
    graph_label: Element
    pattern: '(element (start_tag (tag_name) @name) (text) @value)'
    value_capture: value
    value_label: Text

  - data_key: directives
    graph_label: Directive
    pattern: '(start_tag (tag_name) @element (directive_attribute (directive_name) @name (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value
  - data_key: directives
    graph_label: Directive
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute (directive_name) @name (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value

  - data_key: directives
    graph_label: Directive
    pattern: '(start_tag (tag_name) @element (directive_attribute (directive_name) @name))'
    parent_capture: element
    parent_label: Element
  - data_key: directives
    graph_label: Directive
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute (directive_name) @name))'
    parent_capture: element
    parent_label: Element

  - data_key: props
    graph_label: Prop
    pattern: '(start_tag (tag_name) @element (directive_attribute . ":" . (directive_value) @name (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value
  - data_key: props
    graph_label: Prop
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute . ":" . (directive_value) @name (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value
  - data_key: props
    graph_label: Prop
    pattern: '(start_tag (tag_name) @element (directive_attribute (directive_name) @_dir . ":" . (directive_value) @name (quoted_attribute_value (attribute_value) @value)) (#eq? @_dir "v-bind"))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value
  - data_key: props
    graph_label: Prop
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute (directive_name) @_dir . ":" . (directive_value) @name (quoted_attribute_value (attribute_value) @value)) (#eq? @_dir "v-bind"))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value

  - data_key: props
    graph_label: Prop
    pattern: '(start_tag (tag_name) @element (directive_attribute (dynamic_directive_value (dynamic_directive_inner_value) @name) (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value
  - data_key: props
    graph_label: Prop
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute (dynamic_directive_value (dynamic_directive_inner_value) @name) (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value

  - data_key: event_handlers
    graph_label: EventHandler
    pattern: '(start_tag (tag_name) @element (directive_attribute . "@" . (directive_value) @name (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value
  - data_key: event_handlers
    graph_label: EventHandler
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute . "@" . (directive_value) @name (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value
  - data_key: event_handlers
    graph_label: EventHandler
    pattern: '(start_tag (tag_name) @element (directive_attribute (directive_name) @_dir . ":" . (directive_value) @name (quoted_attribute_value (attribute_value) @value)) (#eq? @_dir "v-on"))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value
  - data_key: event_handlers
    graph_label: EventHandler
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute (directive_name) @_dir . ":" . (directive_value) @name (quoted_attribute_value (attribute_value) @value)) (#eq? @_dir "v-on"))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: Value

  - data_key: slots
    graph_label: Slot
    pattern: '(start_tag (tag_name) @element (directive_attribute . "#" . (directive_value) @name))'
    parent_capture: element
    parent_label: Element
  - data_key: slots
    graph_label: Slot
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute . "#" . (directive_value) @name))'
    parent_capture: element
    parent_label: Element
  - data_key: slots
    graph_label: Slot
    pattern: '(start_tag (tag_name) @element (directive_attribute (directive_name) @_dir . ":" . (directive_value) @name) (#eq? @_dir "v-slot"))'
    parent_capture: element
    parent_label: Element
  - data_key: slots
    graph_label: Slot
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute (directive_name) @_dir . ":" . (directive_value) @name) (#eq? @_dir "v-slot"))'
    parent_capture: element
    parent_label: Element

  - data_key: conditions
    graph_label: Condition
    pattern: '(start_tag (tag_name) @element (directive_attribute (directive_name) @_dir (quoted_attribute_value (attribute_value) @name)) (#eq? @_dir "v-if"))'
    parent_capture: element
    parent_label: Element
  - data_key: conditions
    graph_label: Condition
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute (directive_name) @_dir (quoted_attribute_value (attribute_value) @name)) (#eq? @_dir "v-if"))'
    parent_capture: element
    parent_label: Element
  - data_key: conditions
    graph_label: Condition
    pattern: '(start_tag (tag_name) @element (directive_attribute (directive_name) @_dir (quoted_attribute_value (attribute_value) @name)) (#eq? @_dir "v-else-if"))'
    parent_capture: element
    parent_label: Element
  - data_key: conditions
    graph_label: Condition
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute (directive_name) @_dir (quoted_attribute_value (attribute_value) @name)) (#eq? @_dir "v-else-if"))'
    parent_capture: element
    parent_label: Element
  - data_key: conditions
    graph_label: Condition
    pattern: '(start_tag (tag_name) @element (directive_attribute (directive_name) @_dir (quoted_attribute_value (attribute_value) @name)) (#eq? @_dir "v-show"))'
    parent_capture: element
    parent_label: Element
  - data_key: conditions
    graph_label: Condition
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute (directive_name) @_dir (quoted_attribute_value (attribute_value) @name)) (#eq? @_dir "v-show"))'
    parent_capture: element
    parent_label: Element

  - data_key: loops
    graph_label: Loop
    pattern: '(start_tag (tag_name) @element (directive_attribute (directive_name) @_dir (quoted_attribute_value (attribute_value) @name)) (#eq? @_dir "v-for"))'
    parent_capture: element
    parent_label: Element
  - data_key: loops
    graph_label: Loop
    pattern: '(self_closing_tag (tag_name) @element (directive_attribute (directive_name) @_dir (quoted_attribute_value (attribute_value) @name)) (#eq? @_dir "v-for"))'
    parent_capture: element
    parent_label: Element

  - data_key: interpolations
    graph_label: ""
    pattern: '(element (interpolation (raw_text) @name))'
    type: relation
    relation_type: REFERENCES
  - data_key: interpolations
    graph_label: ""
    pattern: '(template_element (interpolation (raw_text) @name))'
    type: relation
    relation_type: REFERENCES

  - data_key: element_text
    graph_label: Element
    pattern: '(script_element (start_tag (tag_name) @name) (raw_text) @value)'
    value_capture: value
    value_label: Text
  - data_key: element_text
    graph_label: Element
    pattern: '(style_element (start_tag (tag_name) @name) (raw_text) @value)'
    value_capture: value
    value_label: Text

embedded:
  - pattern: '(script_element (start_tag (attribute (attribute_name) @_a (quoted_attribute_value (attribute_value) @lang))) (raw_text) @body (#eq? @_a "lang"))'
    text_capture: body
    lang_capture: lang
    languages:
      js: javascript
      javascript: javascript
      ts: typescript
      typescript: typescript
      tsx: tsx
  - pattern: '(script_element (raw_text) @body)'
    text_capture: body
    default: javascript

  - pattern: '(style_element (start_tag (attribute (attribute_name) @_a (quoted_attribute_value (attribute_value) @lang))) (raw_text) @body (#eq? @_a "lang"))'
    text_capture: body
    lang_capture: lang
    languages: {}
  - pattern: '(style_element (raw_text) @body)'
    text_capture: body
    default: css

exports:
  strategy: none

self_keywords: []

context_types:
  element: Element
  template_element: Element
  script_element: Element
  style_element: Element

context_name_paths:
  element: start_tag/tag_name
  template_element: start_tag/tag_name
  script_element: start_tag/tag_name
  style_element: start_tag/tag_name

anon_func_types: []

declaration_types: []

comment_types:
  - comment

embed_labels:
  - Element
  - Text
  - Prop
  - Slot
  - Comment
