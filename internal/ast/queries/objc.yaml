language: objc
grammar: tree-sitter-objc
extensions: [".m", ".mm"]
# Target resolution: a relation captures its target by NAME, and the name alone does
# not say what kind of thing it is. Without this the target could match any label the
# grammar declares — a Parameter sharing the called function's name.
target_rules:
  CALLS: { labels: [Function, Method] }
  READS_FIELD: { labels: [Field] }
  WRITES_FIELD: { labels: [Field] }
queries:
  # === Entity queries ===
  - data_key: functions
    graph_label: Function
    pattern: '(function_definition (function_declarator (identifier) @name))'
  - data_key: methods
    graph_label: Method
    pattern: '(method_declaration (identifier) @name)'
  - data_key: methods
    graph_label: Method
    pattern: '(method_definition (identifier) @name)'
  - data_key: methods
    graph_label: Method
    pattern: '(method_declaration (keyword_declarator (identifier) @name))'
  - data_key: classes
    graph_label: Class
    pattern: '(class_interface (identifier) @name)'
  - data_key: protocols
    graph_label: Protocol
    pattern: '(protocol_declaration (identifier) @name)'
  - data_key: properties
    graph_label: Property
    pattern: '(property_declaration (struct_declaration (struct_declarator (pointer_declarator declarator: (identifier) @name))))'
  - data_key: implementations
    graph_label: Implementation
    pattern: '(class_implementation (identifier) @name)'
  - data_key: imports
    graph_label: Include
    pattern: '(preproc_include (string_literal) @name)'
  - data_key: imports
    graph_label: Include
    pattern: '(preproc_include (system_lib_string) @name)'
  - data_key: imports
    graph_label: Import
    pattern: '(module_import (identifier) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameter_declaration (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(field_declaration (field_identifier) @name)'

  # === Relation queries ===
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(message_expression method: (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(message_expression (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression (identifier) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(class_interface (identifier) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(class_implementation (identifier) @name)'
  - data_key: implements
    type: relation
    relation_type: IMPLEMENTS
    pattern: '(protocol_reference_list (identifier) @name)'
  - data_key: imports
    type: relation
    relation_type: IMPORTS
    pattern: '(preproc_include (string_literal) @name)'
  - data_key: imports
    type: relation
    relation_type: IMPORTS
    pattern: '(preproc_include (system_lib_string) @name)'
  - data_key: imports
    type: relation
    relation_type: IMPORTS
    pattern: '(module_import (identifier) @name)'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(field_expression (field_identifier) @name)'
  - data_key: field_writes
    type: relation
    relation_type: WRITES_FIELD
    pattern: '(assignment_expression (field_expression (field_identifier) @name))'

# Objective-C uses header files for visibility — no simple keyword-based detection
exports:
  strategy: none

# Objective-C uses 'self' for receiver type resolution
self_keywords: ["self."]

# Parent context type mapping — Objective-C tree-sitter node types
context_types:
  class_interface: Class
  class_implementation: Implementation
  protocol_declaration: Protocol
  # Without these, every parameter of every method resolves to the class or
  # protocol instead of the method that declares it.
  function_definition: Function
  method_declaration: Method
  method_definition: Method

anon_func_types:
  - block_expression

# Declaration node types for docstring attachment
declaration_types:
  - function_definition
  - method_declaration
  - method_definition
  - class_interface
  - class_implementation
  - protocol_declaration
  - property_declaration

# Objective-C tree-sitter uses "comment" for both // and /* */
comment_types:
  - comment

# Cyclomatic complexity: real syntax-tree branches, not a text scan. Verified
# against the actual grammar. case_statement is shared with `default`, so a
# bare default with no case labels still adds one — a minor, accepted
# deviation also taken for C/C++/Java.
complexity:
  node_types:
    - if_statement
    - for_statement
    - while_statement
    - case_statement
    - catch_clause
    - conditional_expression
  operators: ["&&", "||"]

# Labels of this language that get a vector, so semantic search reaches them and
# not only keyword search. Order decides which label keeps a (path, uid) that two
# of them claim -- earlier wins. Every entity is in the keyword index regardless;
# this list is only about meaning. See docs/specs/ast_module.md.
embed_labels:
  - Class
  - Protocol
  - Implementation
  - Method
  - Function
  - Property
  - Field
  - Comment
