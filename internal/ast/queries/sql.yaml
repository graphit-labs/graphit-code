language: sql
grammar: tree-sitter-sql
extensions: [".sql"]
queries:
  - data_key: functions
    graph_label: Function
    pattern: '(create_function (object_reference name: (identifier) @name))'
  - data_key: tables
    graph_label: Table
    pattern: '(create_table name: (object_reference name: (identifier) @name))'
  - data_key: views
    graph_label: View
    pattern: '(create_view (object_reference name: (identifier) @name))'

# SQL has no export concept
exports:
  strategy: none

self_keywords: []

# SQL tree-sitter has no class/struct/namespace concepts
context_types: {}

anon_func_types: []

# SQL tree-sitter declaration types for docstring attachment
declaration_types:
  - create_function
  - create_table
  - create_view

# SQL tree-sitter comment types
comment_types:
  - comment
  - marginalia

# SQL has no meaningful entry points
entry_points:
  names: []
  exported_bonus: 0
  max_score: 0
  decorators: []
