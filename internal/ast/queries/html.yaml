# HTML — Tree-sitter grammar for HTML5
# Comprehensive entity extraction: elements, attributes, forms, links,
# scripts, styles, meta tags, semantic sections, tables, lists, media,
# and embedded content references.
language: html
grammar: tree-sitter-html
extensions: [".html", ".htm"]

queries:
  # ═══════════════════════════════════════════════════════════════════════════
  # ELEMENTS (all named tags)
  # ═══════════════════════════════════════════════════════════════════════════

  # Standard elements with open/close tags
  - data_key: elements
    graph_label: Element
    pattern: '(start_tag (tag_name) @name)'

  # Self-closing elements (e.g., <br/>, <img/>, <input/>)
  - data_key: elements
    graph_label: Element
    pattern: '(self_closing_tag (tag_name) @name)'

  # ═══════════════════════════════════════════════════════════════════════════
  # ATTRIBUTES AS KEY/VALUE NODES
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # Every attribute is a node named after the attribute and containing a node
  # named after its value, so both halves are reachable by full-text search and
  # the pairing survives as a CONTAINS edge:
  #   Element "a" → Attribute "href" → AttributeValue "/orders"
  #
  # The REFERENCES relations further down stay: they say that a value points at
  # something, which containment does not.
  - data_key: attributes
    graph_label: Attribute
    pattern: '(start_tag (tag_name) @element (attribute (attribute_name) @name (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: AttributeValue
  - data_key: attributes
    graph_label: Attribute
    pattern: '(self_closing_tag (tag_name) @element (attribute (attribute_name) @name (quoted_attribute_value (attribute_value) @value)))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: AttributeValue

  # Unquoted values — <input type=text>.
  - data_key: attributes
    graph_label: Attribute
    pattern: '(start_tag (tag_name) @element (attribute (attribute_name) @name (attribute_value) @value))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: AttributeValue
  - data_key: attributes
    graph_label: Attribute
    pattern: '(self_closing_tag (tag_name) @element (attribute (attribute_name) @name (attribute_value) @value))'
    parent_capture: element
    parent_label: Element
    value_capture: value
    value_label: AttributeValue

  # Valueless attributes — <input disabled>.
  - data_key: attributes
    graph_label: Attribute
    pattern: '(start_tag (tag_name) @element (attribute (attribute_name) @name))'
    parent_capture: element
    parent_label: Element
  - data_key: attributes
    graph_label: Attribute
    pattern: '(self_closing_tag (tag_name) @element (attribute (attribute_name) @name))'
    parent_capture: element
    parent_label: Element

  # Visible text — the content an element wraps is its value.
  - data_key: element_text
    graph_label: Element
    pattern: '(element (start_tag (tag_name) @name) (text) @value)'
    value_capture: value
    value_label: Text

  # Inline <script> and <style> bodies. The code between the tags was parsed and
  # dropped, so an inline handler or an inline rule was no node at all. A one-liner
  # — the common case for inline config — becomes one; a multi-statement body does
  # not, because dataText rejects an interior newline, which decides it long before
  # the 256-char cap does. Either way the text stays findable through the file's
  # indexed source; what a body loses is structure.
  - data_key: element_text
    graph_label: Element
    pattern: '(script_element (start_tag (tag_name) @name) (raw_text) @value)'
    value_capture: value
    value_label: Text
  - data_key: element_text
    graph_label: Element
    pattern: '(style_element (start_tag (tag_name) @name) (raw_text) @value)'
    value_capture: value
    value_label: Text

  # <!DOCTYPE html> — the document's declared type.
  - data_key: doctypes
    graph_label: Doctype
    pattern: '(doctype) @name'

  # ═══════════════════════════════════════════════════════════════════════════
  # ATTRIBUTE REFERENCES
  # ═══════════════════════════════════════════════════════════════════════════

  # ID attributes (unique identifiers — high-value for AST)
  - data_key: ids
    graph_label: ""
    pattern: '(attribute (attribute_name) @_attr (quoted_attribute_value (attribute_value) @name) (#eq? @_attr "id"))'
    type: relation
    relation_type: REFERENCES

  # Class attributes
  - data_key: classes
    graph_label: ""
    pattern: '(attribute (attribute_name) @_attr (quoted_attribute_value (attribute_value) @name) (#eq? @_attr "class"))'
    type: relation
    relation_type: REFERENCES

  # ═══════════════════════════════════════════════════════════════════════════
  # LINKS & NAVIGATION
  # ═══════════════════════════════════════════════════════════════════════════

  # href attributes (links, stylesheets, anchors)
  - data_key: hrefs
    graph_label: ""
    pattern: '(attribute (attribute_name) @_attr (quoted_attribute_value (attribute_value) @name) (#eq? @_attr "href"))'
    type: relation
    relation_type: REFERENCES

  # src attributes (scripts, images, iframes, video, audio)
  - data_key: srcs
    graph_label: ""
    pattern: '(attribute (attribute_name) @_attr (quoted_attribute_value (attribute_value) @name) (#eq? @_attr "src"))'
    type: relation
    relation_type: REFERENCES

  # action attributes (form targets)
  - data_key: actions
    graph_label: ""
    pattern: '(attribute (attribute_name) @_attr (quoted_attribute_value (attribute_value) @name) (#eq? @_attr "action"))'
    type: relation
    relation_type: REFERENCES

  # ═══════════════════════════════════════════════════════════════════════════
  # EMBEDDED CONTENT
  # ═══════════════════════════════════════════════════════════════════════════

  # Script elements
  - data_key: scripts
    graph_label: Element
    pattern: '(script_element (start_tag (tag_name) @name))'

  # Style elements
  - data_key: styles
    graph_label: Element
    pattern: '(style_element (start_tag (tag_name) @name))'

  # ═══════════════════════════════════════════════════════════════════════════
  # DATA ATTRIBUTES
  # ═══════════════════════════════════════════════════════════════════════════

  # name attributes (form fields, meta, anchors)
  - data_key: names
    graph_label: ""
    pattern: '(attribute (attribute_name) @_attr (quoted_attribute_value (attribute_value) @name) (#eq? @_attr "name"))'
    type: relation
    relation_type: REFERENCES

  # data-* attributes (custom data binding)
  - data_key: data_attrs
    graph_label: ""
    pattern: '(attribute (attribute_name) @name (#match? @name "^data-"))'
    type: relation
    relation_type: REFERENCES

  # ═══════════════════════════════════════════════════════════════════════════
  # FRAMEWORK INTEGRATION
  # ═══════════════════════════════════════════════════════════════════════════

  # for attributes (label-input binding)
  - data_key: label_fors
    graph_label: ""
    pattern: '(attribute (attribute_name) @_attr (quoted_attribute_value (attribute_value) @name) (#eq? @_attr "for"))'
    type: relation
    relation_type: REFERENCES

  # aria-* attributes (accessibility)
  - data_key: aria_attrs
    graph_label: ""
    pattern: '(attribute (attribute_name) @name (#match? @name "^aria-"))'
    type: relation
    relation_type: REFERENCES

  # role attributes (WAI-ARIA roles)
  - data_key: roles
    graph_label: ""
    pattern: '(attribute (attribute_name) @_attr (quoted_attribute_value (attribute_value) @name) (#eq? @_attr "role"))'
    type: relation
    relation_type: REFERENCES

# ═════════════════════════════════════════════════════════════════════════════
# EMBEDDED LANGUAGES
# ═════════════════════════════════════════════════════════════════════════════
#
# An inline <script> is JavaScript and an inline <style> is CSS, and neither is
# visible to this grammar — the body arrives as one raw_text. Declaring the blocks
# gets each parsed with its own grammar and merged back at absolute lines, so an
# inline module's `import` becomes an IMPORTS edge like any other.
#
# The attribute that decides is `type`, not `lang`: HTML has no `lang` on a script,
# and `type` is what distinguishes code from a payload. Only the values that ARE
# JavaScript are listed, so `type="application/json"`, `type="importmap"` and
# `type="text/x-template"` are skipped in silence rather than parsed as JavaScript
# — which is the whole point of listing them explicitly.
# Two patterns per block because `type` is optional: the specific one first, the
# generic one as the fallback, and order is the tie-break — the first block whose pattern
# matches a body node claims it. The claim is at the MATCH, not at language
# resolution: that is what makes `type="application/json"` be skipped instead of
# falling back to the generic block's `default: javascript`.
#
# Same mechanism as vue.yaml and svelte.yaml; only which attribute the pattern reads.
embedded:
  - pattern: '(script_element (start_tag (attribute (attribute_name) @_a (quoted_attribute_value (attribute_value) @lang))) (raw_text) @body (#eq? @_a "type"))'
    text_capture: body
    lang_capture: lang
    languages:
      module: javascript
      text/javascript: javascript
      application/javascript: javascript
      text/ecmascript: javascript
      application/ecmascript: javascript
  - pattern: '(script_element (raw_text) @body)'
    text_capture: body
    default: javascript

  - pattern: '(style_element (start_tag (attribute (attribute_name) @_a (quoted_attribute_value (attribute_value) @lang))) (raw_text) @body (#eq? @_a "type"))'
    text_capture: body
    lang_capture: lang
    languages:
      text/css: css
  - pattern: '(style_element (raw_text) @body)'
    text_capture: body
    default: css

exports:
  strategy: none

self_keywords: []

context_types:
  element: Element
  script_element: Element
  style_element: Element

# Without these every context above is TRANSPARENT and each entity falls back to
# being contained by the File: tree-sitter-html's element exposes no "name" field
# — the tag name lives in its start_tag — so the default field lookup finds
# nothing and the walk continues past the container it just matched. xml, json,
# yaml and svelte all declare their path; html was the one that did not.
context_name_paths:
  element: start_tag/tag_name
  script_element: start_tag/tag_name
  style_element: start_tag/tag_name

anon_func_types: []

declaration_types: []

comment_types:
  - comment

# No cyclomatic complexity: HTML markup has no control flow of its own — an
# embedded <script>'s branches belong to that script's own language and are
# already counted there.

# Labels of this language that get a vector, so semantic search reaches them and
# not only keyword search. Order decides which label keeps a (path, uid) that two
# of them claim -- earlier wins. Every entity is in the keyword index regardless;
# this list is only about meaning. See docs/specs/ast_module.md.
embed_labels:
  - Element
  - Text
  - Comment
