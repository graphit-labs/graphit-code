language: dockerfile
grammar: tree-sitter-dockerfile
extensions: ["Dockerfile", ".dockerfile", ".containerfile"]
queries:
  # === Entity queries ===
  - data_key: stages
    graph_label: Stage
    pattern: '(from_instruction (image_spec (image_name) @name))'
  - data_key: stages
    graph_label: Stage
    name_capture: alias
    pattern: '(from_instruction (image_spec) as: (image_alias) @alias)'
  - data_key: instructions
    graph_label: Instruction
    pattern: '(run_instruction (shell_command) @name)'
  - data_key: instructions
    graph_label: Instruction
    pattern: '(copy_instruction (path) @name)'
  - data_key: instructions
    graph_label: Instruction
    pattern: '(expose_instruction (expose_port) @name)'
  - data_key: instructions
    graph_label: Instruction
    pattern: '(workdir_instruction (path) @name)'
  - data_key: instructions
    graph_label: Instruction
    pattern: '(entrypoint_instruction (json_string_array) @name)'
  - data_key: instructions
    graph_label: Instruction
    pattern: '(cmd_instruction (json_string_array) @name)'
  - data_key: labels
    graph_label: Label
    pattern: '(label_instruction (label_pair (unquoted_string) @name))'
  - data_key: args
    graph_label: Arg
    pattern: '(arg_instruction (unquoted_string) @name)'
  - data_key: variables
    graph_label: EnvVar
    pattern: '(env_instruction (env_pair (unquoted_string) @name))'

  # ENV, ARG and LABEL are key/value pairs, and the value was dropped entirely:
  # APP_ENV was known to exist, but not that it is `production`.
  - data_key: variables
    graph_label: EnvVar
    pattern: '(env_instruction (env_pair name: (unquoted_string) @name value: [(unquoted_string) (double_quoted_string) (single_quoted_string)] @value))'
    value_capture: value
    value_label: Value
  - data_key: args
    graph_label: Arg
    pattern: '(arg_instruction name: (unquoted_string) @name default: [(unquoted_string) (double_quoted_string) (single_quoted_string)] @value)'
    value_capture: value
    value_label: Value
  - data_key: labels
    graph_label: Label
    pattern: '(label_instruction (label_pair key: (unquoted_string) @name value: [(unquoted_string) (double_quoted_string) (single_quoted_string)] @value))'
    value_capture: value
    value_label: Value

# Dockerfile is a config format — no export concept
exports:
  strategy: none

self_keywords: []

# Stages provide build context for instructions
context_types:
  from_instruction: Stage

anon_func_types: []

declaration_types:
  - from_instruction
  - arg_instruction
  - label_instruction
  - env_instruction

# Dockerfile tree-sitter uses "comment" for # comments
comment_types:
  - comment

# No cyclomatic complexity: a Dockerfile has no control flow of its own —
# RUN's shell command is opaque text to this grammar, not parsed as bash.

# Labels of this language that get a vector, so semantic search reaches them and
# not only keyword search. Order decides which label keeps a (path, uid) that two
# of them claim -- earlier wins. Every entity is in the keyword index regardless;
# this list is only about meaning. See docs/specs/ast_module.md.
embed_labels:
  - Stage
  - Instruction
  - Arg
  - EnvVar
  - Comment
