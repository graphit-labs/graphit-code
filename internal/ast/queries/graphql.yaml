language: graphql
grammar: tree-sitter-graphql
extensions: [".graphql", ".gql"]
queries:

  - data_key: object_types
    graph_label: ObjectType
    pattern: '(object_type_definition (name) @name)'
  - data_key: input_types
    graph_label: InputType
    pattern: '(input_object_type_definition (name) @name)'
  - data_key: interface_types
    graph_label: InterfaceType
    pattern: '(interface_type_definition (name) @name)'
  - data_key: union_types
    graph_label: UnionType
    pattern: '(union_type_definition (name) @name)'
  - data_key: enum_types
    graph_label: EnumType
    pattern: '(enum_type_definition (name) @name)'
  - data_key: scalar_types
    graph_label: ScalarType
    pattern: '(scalar_type_definition (name) @name)'
  - data_key: schema_definitions
    graph_label: SchemaDefinition
    pattern: '(schema_definition) @name'
  - data_key: directives
    graph_label: Directive
    pattern: '(directive_definition (name) @name)'
  - data_key: fragments
    graph_label: Fragment
    pattern: '(fragment_definition (fragment_name) @name)'
  - data_key: queries
    graph_label: Query
    pattern: '(operation_definition (operation_type) @_type (name) @name (#eq? @_type "query"))'
  - data_key: mutations
    graph_label: Mutation
    pattern: '(operation_definition (operation_type) @_type (name) @name (#eq? @_type "mutation"))'
  - data_key: subscriptions
    graph_label: Subscription
    pattern: '(operation_definition (operation_type) @_type (name) @name (#eq? @_type "subscription"))'
  - data_key: fields
    graph_label: GraphQLField
    pattern: '(field_definition (name) @name)'

  - data_key: implements
    type: relation
    relation_type: IMPLEMENTS
    pattern: '(implements_interfaces (named_type) @name)'
  - data_key: member_types
    type: relation
    relation_type: INHERITS
    pattern: '(union_member_types (named_type) @name)'

exports:
  strategy: none

self_keywords: []

context_types:
  object_type_definition: ObjectType
  interface_type_definition: InterfaceType
  enum_type_definition: EnumType
  input_object_type_definition: InputType

context_name_paths:
  object_type_definition: name
  interface_type_definition: name
  enum_type_definition: name
  input_object_type_definition: name

anon_func_types: []

declaration_types:
  - object_type_definition
  - input_object_type_definition
  - interface_type_definition
  - union_type_definition
  - enum_type_definition
  - scalar_type_definition
  - directive_definition
  - fragment_definition
  - operation_definition

comment_types:
  - comment

embed_labels:
  - ObjectType
  - InterfaceType
  - InputType
  - EnumType
  - UnionType
  - ScalarType
  - Query
  - Mutation
  - Subscription
  - Fragment
  - Directive
  - SchemaDefinition
  - GraphQLField
  - Comment
