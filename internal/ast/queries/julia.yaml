language: julia
grammar: tree-sitter-julia
extensions: [".jl"]

target_rules:
  CALLS: { labels: [Function, Macro] }
queries:

  - data_key: functions
    graph_label: Function
    pattern: '(function_definition (signature (call_expression (identifier) @name)))'
  - data_key: functions
    graph_label: Function
    pattern: '(assignment (call_expression (identifier) @name))'
  - data_key: macros
    graph_label: Macro
    pattern: '(macro_definition (signature (call_expression (identifier) @name)))'
  - data_key: structs
    graph_label: Struct
    pattern: '(struct_definition (type_head (identifier) @name))'
  - data_key: abstract_types
    graph_label: AbstractType
    pattern: '(abstract_definition (type_head (identifier) @name))'
  - data_key: modules
    graph_label: Module
    pattern: '(module_definition (identifier) @name)'
  - data_key: constants
    graph_label: Constant
    pattern: '(const_statement (assignment (identifier) @name))'
  - data_key: variables
    graph_label: Variable
    pattern: '(assignment (identifier) @name)'

  - data_key: constants
    graph_label: Constant
    pattern: '(const_statement (assignment (identifier) @name [(integer_literal) (float_literal) (boolean_literal) (character_literal) (string_literal)] @value))'
    value_capture: value
    value_label: Value
  - data_key: variables
    graph_label: Variable
    pattern: '(assignment (identifier) @name [(integer_literal) (float_literal) (boolean_literal) (character_literal) (string_literal)] @value)'
    value_capture: value
    value_label: Value

  - data_key: parameters
    graph_label: Parameter
    pattern: '(function_definition (signature (call_expression (identifier) @parent (argument_list (identifier) @name))))'
    parent_capture: parent
    parent_label: Function
  - data_key: parameters
    graph_label: Parameter
    pattern: '(function_definition (signature (call_expression (identifier) @parent (argument_list (typed_expression (identifier) @name)))))'
    parent_capture: parent
    parent_label: Function

  - data_key: parameters
    graph_label: Parameter
    pattern: '(assignment (call_expression (identifier) @parent (argument_list (identifier) @name)))'
    parent_capture: parent
    parent_label: Function
  - data_key: fields
    graph_label: Field
    pattern: '(struct_definition (block (typed_expression (identifier) @name)))'
  - data_key: fields
    graph_label: Field
    pattern: '(struct_definition (block (identifier) @name))'
  - data_key: imports
    graph_label: Import
    pattern: '(import_statement (identifier) @name)'
  - data_key: imports
    graph_label: Import
    pattern: '(using_statement (identifier) @name)'
  - data_key: exports
    graph_label: Export
    pattern: '(export_statement (identifier) @name)'

  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression (identifier) @name)'
  - data_key: imports
    type: relation
    relation_type: IMPORTS
    pattern: '(import_statement (identifier) @name)'
  - data_key: imports
    type: relation
    relation_type: IMPORTS
    pattern: '(using_statement (identifier) @name)'

exports:
  strategy: modifier
  config:
    keyword: "export"

self_keywords: []

context_types:
  function_definition: Function
  struct_definition: Struct
  module_definition: Module

anon_func_types:
  - lambda_expression

declaration_types:
  - function_definition
  - macro_definition
  - struct_definition
  - abstract_definition
  - module_definition
  - const_statement

comment_types:
  - comment

complexity:
  node_types:
    - if_statement
    - elseif_clause
    - for_statement
    - while_statement
    - catch_clause
    - ternary_expression
  operators: ["&&", "||"]

embed_labels:
  - Module
  - Struct
  - AbstractType
  - Function
  - Macro
  - Constant
  - Field
  - Variable
  - Comment
