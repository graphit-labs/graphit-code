# No export detection for PL/SQL (all objects are schema-level)
exports:
  strategy: none

# PL/SQL parent context types (for resolving entity nesting)
#
# Every rule that a query above turns into a container entity MUST be listed here,
# or the entities inside it are attributed to whatever encloses IT. procedure_spec
# and function_spec were the ones missing: a package SPEC declares its subprograms
# as procedure_spec/function_spec (not procedure_body, which is the package BODY),
# so resolveParentContextAntlr walked straight past them to create_package and
# every parameter of every spec-declared subprogram came out owned by the package.
# Measured on a 36k-file Oracle export: 9052 parameters — all of them under
# schema/packages/ — pointed at a Package instead of the Procedure or Function that
# actually declares them, which also collides the uids of same-named parameters
# across subprograms of one package.
context_types:
  create_package: Package
  create_package_body: Package
  create_function_body: Function
  create_procedure_body: Procedure
  function_body: Function
  procedure_body: Procedure
  function_spec: Function
  procedure_spec: Procedure
  create_type: Type
  create_type_body: Type
  create_trigger: Trigger
  create_table: Table
  # So the columns an index covers, and the table it is on, belong to the INDEX —
  # without this they float at file level and the index stays a bare name.
  create_index: Index
  create_view: View
  create_materialized_view: MaterializedView
  # Package-level type declarations own their fields and elements the same way.
  record_type_definition: Type
  table_type_definition: Type
  varray_type_definition: Type
  ref_cursor_type_definition: Type
  subtype_declaration: Type

# ANTLR comment token types
comment_types:
  - SINGLE_LINE_COMMENT
  - MULTI_LINE_COMMENT

# All PL/SQL declaration types for docstring attachment
declaration_types:
  - create_function_body
  - create_procedure_body
  - function_body
  - procedure_body
  - function_spec
  - procedure_spec
  - create_package
  - create_package_body
  - create_type
  - create_type_body
  - create_trigger
  - create_table
  - create_view
  - create_materialized_view
  - create_index
  - create_sequence
  - create_synonym
  - create_database_link

# Cyclomatic complexity: real syntax-tree branches, not a text scan. Verified
# against the real ANTLR parse tree (rule names, not guessed). elsif_part is
# its own rule (IF does not re-nest ELSIF), and case_when_part_statement is
# counted per WHEN, not once for the whole CASE — case_statement itself is
# left out to avoid double-counting the branches its WHEN parts already add.
complexity:
  node_types:
    - if_statement
    - elsif_part
    - loop_statement
    - case_when_part_statement
    - exception_handler
  operators: ["AND", "OR"]

# Labels of this language that get a vector, so semantic search reaches them and
# not only keyword search. Order decides which label keeps a (path, uid) that two
# of them claim -- earlier wins. Every entity is in the keyword index regardless;
# this list is only about meaning. See docs/specs/ast_module.md.
embed_labels:
  - Package
  - Procedure
  - Function
  - Trigger
  - Type
  - Table
  - View
  - MaterializedView
  - Cursor
  - Exception
  - Column
  - Constraint
  - Index
  - Sequence
  - Synonym
  - Constant
  - Variable
  - Comment
