exports:
  strategy: none

context_types:
  create_package: Package
  create_package_body: Package
  create_function_body: Function
  create_procedure_body: Procedure
  function_body: Function
  procedure_body: Procedure
  function_spec: Function
  procedure_spec: Procedure
  create_type: Type
  create_type_body: Type
  create_trigger: Trigger
  create_table: Table

  create_index: Index
  create_view: View
  create_materialized_view: MaterializedView

  record_type_definition: Type
  table_type_definition: Type
  varray_type_definition: Type
  ref_cursor_type_definition: Type
  subtype_declaration: Type

comment_types:
  - SINGLE_LINE_COMMENT
  - MULTI_LINE_COMMENT

declaration_types:
  - create_function_body
  - create_procedure_body
  - function_body
  - procedure_body
  - function_spec
  - procedure_spec
  - create_package
  - create_package_body
  - create_type
  - create_type_body
  - create_trigger
  - create_table
  - create_view
  - create_materialized_view
  - create_index
  - create_sequence
  - create_synonym
  - create_database_link

complexity:
  node_types:
    - if_statement
    - elsif_part
    - loop_statement
    - case_when_part_statement
    - exception_handler
  operators: ["AND", "OR"]

embed_labels:
  - Package
  - Procedure
  - Function
  - Trigger
  - Type
  - Table
  - View
  - MaterializedView
  - Cursor
  - Exception
  - Column
  - Constraint
  - Index
  - Sequence
  - Synonym
  - Constant
  - Variable
  - Comment
