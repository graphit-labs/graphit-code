# PL/SQL — ANTLR v4 grammar for Oracle PL/SQL
# Comprehensive extraction: all DDL, DML, stored units, types, triggers,
# parameters, variables, cursors, exceptions, constraints, grants, and
# every type of relation (CALLS, SELECTS, INSERTS, UPDATES, DELETES, etc.)
language: plsql
parser: antlr4
grammar: antlr-plsql
start_rule: sql_script
extensions: [".sql", ".pks", ".pkb", ".pls", ".plb", ".prc", ".fnc", ".trg", ".typ", ".bdy", ".spc", ".vw"]
exclusive: true

# Target resolution: a DML/DDL relation captures its object by NAME, and the name
# alone does not say what kind of thing it is. A target this corpus never declares is
# still a table — whoever reads a schema they do not own depends on it for real — and
# that is why `fallback: Table` is declared here instead of being the engine's default
# for every reference of every language.
# What a call can reach. `Trigger` is NOT here, and its absence is the
# statement: in PL/SQL a trigger is not callable — it is fired by DML on its table
# and no program invokes it by name. Measured on a real corpus: with Trigger in the set,
# the ONLY trigger ever "called" was one whose database name is the quoted identifier "BEGIN",
# and every `begin` word in statement position resolved to it — 9092 false edges, zero true ones lost by removing it.
target_rules:
  CALLS: { labels: [Function, Procedure, Package] }
  SELECTS: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  INSERTS: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  UPDATES: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  DELETES: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  ALTERS: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  DROPS: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  CREATES: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  TRUNCATES: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  REFERENCES: { labels: [Table, View, MaterializedView, Synonym, Sequence, Package, Procedure, Function, Trigger, Type, Index, DBLink, Tablespace], fallback: Table }
  # COLUMN grain. Types of their own, rather than Column added to the label set of
  # UPDATES/SELECTS: a table name spelled like some column would become ambiguous, and
  # ambiguity is rejected — so adding column resolution would break table resolution.
  #
  # The target is always QUALIFIED (`TABLE.COLUMN`), which is what makes this usable:
  # `ST_PROC` alone lives in dozens of tables and resolves to none, while
  # `PEDIDO.ST_PROC` resolves to one. The qualified fallback is honest too — a stub
  # `PEDIDO.ST_PROC` records ONE column of ONE table, where a stub `ST_PROC` would merge
  # as de todas.
  READS_COLUMN: { labels: [Column], fallback: Column }
  WRITES_COLUMN: { labels: [Column], fallback: Column }
queries:
  # ═══════════════════════════════════════════════════════════════════════════
  # FUNCTIONS & PROCEDURES
  # ═══════════════════════════════════════════════════════════════════════════

  # CREATE [OR REPLACE] FUNCTION ...
  - data_key: functions
    graph_label: Function
    pattern: "//create_function_body/function_name"
    name_capture: name
    type: entity

  # Package-level function bodies (inside CREATE PACKAGE BODY)
  - data_key: functions
    graph_label: Function
    pattern: "//function_body/identifier"
    name_capture: name
    type: entity

  # Package-level function specs (declarations in CREATE PACKAGE)
  - data_key: functions
    graph_label: Function
    pattern: "//function_spec/identifier"
    name_capture: name
    type: entity

  # CREATE [OR REPLACE] PROCEDURE ...
  - data_key: procedures
    graph_label: Procedure
    pattern: "//create_procedure_body/procedure_name"
    name_capture: name
    type: entity

  # Package-level procedure bodies
  - data_key: procedures
    graph_label: Procedure
    pattern: "//procedure_body/identifier"
    name_capture: name
    type: entity

  # Package-level procedure specs (declarations)
  - data_key: procedures
    graph_label: Procedure
    pattern: "//procedure_spec/identifier"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # PACKAGES & TYPES
  # ═══════════════════════════════════════════════════════════════════════════

  - data_key: packages
    graph_label: Package
    pattern: "//create_package/package_name"
    name_capture: name
    type: entity

  - data_key: packages
    graph_label: Package
    pattern: "//create_package_body/package_name"
    name_capture: name
    type: entity

  # TYPE specifications (CREATE TYPE ... AS OBJECT / AS TABLE / AS VARRAY)
  - data_key: types
    graph_label: Type
    pattern: "//create_type/type_definition/type_name"
    name_capture: name
    type: entity

  # TYPE BODY (implementation of TYPE methods)
  - data_key: types
    graph_label: Type
    pattern: "//create_type_body/type_name"
    name_capture: name
    type: entity

  # SUBTYPE declarations (inside DECLARE or package)
  - data_key: types
    graph_label: Type
    pattern: "//subtype_declaration/identifier"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # TRIGGERS
  # ═══════════════════════════════════════════════════════════════════════════

  - data_key: triggers
    graph_label: Trigger
    pattern: "//create_trigger/trigger_name"
    name_capture: name
    type: entity

  # Trigger → table reference (ON table_name)
  - data_key: trigger_tables
    graph_label: ""
    pattern: "//create_trigger/tableview_name"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # ═══════════════════════════════════════════════════════════════════════════
  # DATABASE OBJECTS — DDL
  # ═══════════════════════════════════════════════════════════════════════════

  # Tables
  #
  # create_table is `CREATE ... TABLE (schema_name '.')? table_name`, so the name
  # is under table_name — never under tableview_name, which this pattern used to
  # name and which appears in create_table only in the rare PARENT clause. The
  # pattern matched nothing: an Oracle export of 35358 files yielded 0 Table
  # entities while carrying 75121 Table->Column edges, and the CONTAINS rel table
  # group then referenced a node table that was never created.
  - data_key: tables
    graph_label: Table
    pattern: "//create_table/table_name"
    name_capture: name
    type: entity

  # Views
  #
  # create_view names the view with a bare id_expression (`VIEW (schema_name '.')?
  # v = id_expression`), not a tableview_name — same miss as tables above, 0 View
  # entities extracted. The other id_expression that can sit directly under
  # create_view belongs to DEFAULT COLLATION, which no view in the reference
  # corpus uses.
  - data_key: views
    graph_label: View
    pattern: "//create_view/id_expression"
    name_capture: name
    type: entity

  # Materialized Views
  - data_key: mviews
    graph_label: MaterializedView
    pattern: "//create_materialized_view/tableview_name"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # COLUMN-GRAIN DML
  # ═══════════════════════════════════════════════════════════════════════════
  #
  # The table is the column's SIBLING in the tree, neither ancestor nor descendant:
  #
  #   update_statement : UPDATE general_table_ref update_set_clause ...
  #   insert_into_clause : INTO general_table_ref paren_column_list?
  #
  # So the qualifier is anchored at an ANCESTOR — the first segment is the rule to
  # climb to, the rest walks down from there. A pattern matching the column could not
  # reach the table any other way, and one matching the statement would take only the
  # PRIMEIRA coluna de um `SET a = 1, b = 2`.

  # UPDATE <t> SET <c> = ...  — one row per assigned column.
  - data_key: column_writes_update
    pattern: "//column_based_update_set_clause/column_name"
    name_capture: name
    qualifier_capture: "update_statement/general_table_ref"
    type: relation
    relation_type: WRITES_COLUMN

  # INSERT INTO <t> (<c>, ...) — a lista de colunas nomeadas.
  - data_key: column_writes_insert
    pattern: "//paren_column_list/column_list/column_name"
    name_capture: name
    qualifier_capture: "insert_into_clause/general_table_ref"
    type: relation
    relation_type: WRITES_COLUMN

  # Indexes
  - data_key: indexes
    graph_label: Index
    pattern: "//create_index"
    name_capture: index_name
    value_capture: "UNIQUE"
    value_label: Value
    type: entity

  # An index used to be a NAME and nothing else: which table it is on, which columns
  # it covers and whether it is UNIQUE were all absent. That makes the one question an
  # index exists to answer — "is this rule enforced by the database, or only by the
  # application?" — unanswerable from the graph, and an agent that trusts an empty
  # result concludes the opposite of the truth.
  #
  #   create_index : CREATE UNIQUE? BITMAP? INDEX index_name ON table_index_clause ...
  #   table_index_clause : tableview_name table_alias? '(' index_expr (',' index_expr)* ')'
  #   index_expr : column_name | expression
  #
  # UNIQUE is a keyword, not a rule, which is why a capture may name a token — see
  # ChildByRule. The same UID and label as the query above, so this MERGES into that
  # entity and fills its `value` instead of producing a second index node; a
  # non-unique index simply never matches and keeps `value` empty.
  # The table the index is on. A relation rather than a property, so
  # "which indexes cover this table" is a traversal from either end.
  - data_key: index_table
    pattern: "//create_index/table_index_clause/tableview_name"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # The covered columns. Order is semantic in a composite index — a leading column can
  # serve a query that a trailing one cannot — and it survives as the line order of the
  # nodes under the index.
  - data_key: columns
    graph_label: Column
    pattern: "//create_index/table_index_clause/index_expr/column_name"
    name_capture: name
    type: entity

  # Sequences
  - data_key: sequences
    graph_label: Sequence
    pattern: "//create_sequence/sequence_name"
    name_capture: name
    type: entity

  # Synonyms
  - data_key: synonyms
    graph_label: Synonym
    pattern: "//create_synonym/synonym_name"
    name_capture: name
    type: entity

  # Database Links
  - data_key: dblinks
    graph_label: DBLink
    pattern: "//create_database_link/link_name"
    name_capture: name
    type: entity

  # Tablespace
  - data_key: tablespaces
    graph_label: Tablespace
    pattern: "//create_tablespace/tablespace_name"
    name_capture: name
    type: entity

  # Directory objects
  - data_key: directories
    graph_label: Directory
    pattern: "//create_directory/directory_name"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # COLUMNS, PARAMETERS & DECLARATIONS
  # ═══════════════════════════════════════════════════════════════════════════

  # Column definitions (inside CREATE TABLE)
  - data_key: columns
    graph_label: Column
    pattern: "//column_definition/column_name"
    name_capture: name
    type: entity

  # Function/procedure parameters
  - data_key: parameters
    graph_label: Parameter
    pattern: "//parameter/parameter_name"
    name_capture: name
    type: entity

  # Variable declarations (DECLARE block or package body)
  #
  # Oracle has no constant_declaration rule: a constant is a variable_declaration
  # carrying the CONSTANT keyword —
  #
  #   variable_declaration : identifier CONSTANT? type_spec (NOT? NULL_)? default_value_part? ';'
  #
  # so the two are told apart by the keyword guard. Without it every constant was
  # indexed as a Variable and the query against //constant_declaration matched
  # nothing, because that rule does not exist.
  - data_key: variables
    graph_label: Variable
    pattern: "//variable_declaration[!CONSTANT]"
    name_capture: identifier
    type: entity

  # Constant declarations
  - data_key: constants
    graph_label: Constant
    pattern: "//variable_declaration[CONSTANT]"
    name_capture: identifier
    type: entity

  # Declared default values. The value becomes a node contained by the column or
  # variable that declares it, so "which column is born with this status" is a
  # traversal, and the value itself is reachable by search.
  #
  # These match the declaration itself, not its name terminal, because the value
  # is a sibling of the name: value_capture resolves a rule path downward from the
  # matched node.
  - data_key: columns
    graph_label: Column
    pattern: "//column_definition"
    name_capture: column_name
    value_capture: "expression"
    value_label: Value
    type: entity
  - data_key: variables
    graph_label: Variable
    pattern: "//variable_declaration[!CONSTANT]"
    name_capture: identifier
    value_capture: "default_value_part/expression"
    value_label: Value
    type: entity
  - data_key: constants
    graph_label: Constant
    pattern: "//variable_declaration[CONSTANT]"
    name_capture: identifier
    value_capture: "default_value_part/expression"
    value_label: Value
    type: entity

  # Cursor declarations
  - data_key: cursors
    graph_label: Cursor
    pattern: "//cursor_declaration/identifier"
    name_capture: name
    type: entity

  # Exception declarations (user-defined exceptions)
  - data_key: exceptions
    graph_label: Exception
    pattern: "//exception_declaration/identifier"
    name_capture: name
    type: entity

  # Record type definitions (TYPE rec IS RECORD)
  - data_key: types
    graph_label: Type
    pattern: "//record_type_definition/identifier"
    name_capture: name
    type: entity

  # Collection type definitions (TYPE t IS TABLE OF)
  - data_key: types
    graph_label: Type
    pattern: "//table_type_definition/identifier"
    name_capture: name
    type: entity

  # VARRAY type definitions (TYPE v IS VARRAY)
  - data_key: types
    graph_label: Type
    pattern: "//varray_type_definition/identifier"
    name_capture: name
    type: entity

  # REF CURSOR type definitions
  - data_key: types
    graph_label: Type
    pattern: "//ref_cursor_type_definition/identifier"
    name_capture: name
    type: entity

  # ═══════════════════════════════════════════════════════════════════════════
  # CONSTRAINTS & COMMENTS
  # ═══════════════════════════════════════════════════════════════════════════

  # Inline constraints
  - data_key: constraints
    graph_label: Constraint
    pattern: "//inline_constraint/constraint_name"
    name_capture: name
    type: entity

  # Out-of-line constraints
  - data_key: constraints
    graph_label: Constraint
    pattern: "//out_of_line_constraint/constraint_name"
    name_capture: name
    type: entity

  # Foreign key references (references_clause → table being referenced)
  - data_key: fk_references
    graph_label: ""
    pattern: "//references_clause/tableview_name"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # COMMENT ON ... IS '<text>' — the comment TEXT is the entity name.
  #
  # These used to be relations pointing at the commented column or table, with the text
  # never captured at all. In an Oracle export that is the whole data dictionary thrown
  # away: 2209 files in the reference corpus contain nothing but COMMENT ON statements,
  # and they yielded zero entities.
  #
  # The commented object still gets a reference edge below, so "what is documented" and
  # "what does the documentation say" are both answerable.
  - data_key: comments
    graph_label: Comment
    pattern: "//comment_on_column/quoted_string"
    name_capture: name
    type: entity

  - data_key: comments
    graph_label: Comment
    pattern: "//comment_on_table/quoted_string"
    name_capture: name
    type: entity

  - data_key: comments
    graph_label: Comment
    pattern: "//comment_on_materialized/quoted_string"
    name_capture: name
    type: entity

  # The object each comment documents.
  - data_key: comment_refs
    graph_label: ""
    pattern: "//comment_on_column/column_name"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  - data_key: comment_refs
    graph_label: ""
    pattern: "//comment_on_table/tableview_name"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  - data_key: comment_refs
    graph_label: ""
    pattern: "//comment_on_materialized/tableview_name"
    name_capture: name
    type: relation
    relation_type: REFERENCES

  # ═══════════════════════════════════════════════════════════════════════════
  # FUNCTION/PROCEDURE CALLS
  # ═══════════════════════════════════════════════════════════════════════════

  # WHY THE THREE CALL QUERIES NEED `name_reject`, and why the list lives
  # here and not in the engine:
  #
  # `call_statement` (PlSqlParser.g4) is `CALL? routine_name function_argument?` — BOTH
  # optionals may be absent, so a bare identifier in statement position IS already a
  # complete call. And `routine_name` resolves via `regular_id`, whose
  # `non_reserved_keywords_pre12c` list has 1753 words, including BEGIN, DECLARE, FUNCTION,
  # IF, PROCEDURE and RETURN. That is: by the grammar's own rules, `IF` in statement
  # position is a call to something called IF — and the parse is CLEAN. The hypothesis that
  # it came from error recovery was tested and DISCARDED: with and without discarding the
  # recovered subtree, the result was identical.
  #
  # Measured on a real corpus before the filter: `PROCEDURE` 16367, `IF` 2567, `DECLARE` 2050,
  # `FUNCTION` 1021, `begin` 976, `.` 818 — 25k call edges to reserved words, out of 58k coming from screen code.
  #
  # The list is words that NEVER name a routine in PL/SQL: block, flow control,
  # DML, and statements that are not calls (`commit`, `rollback`, `savepoint`). The
  # `^[^A-Za-z_]` at the end covers the rest — an unquoted PL/SQL identifier starts with a letter,
  # so a target starting with punctuation (the lone `.`) is not a name at all.
  #
  # ANCHORED at both ends on purpose: `^(?i)(if)$` rejects the word `if`; `if` without
  # anchors would reject `if_valida_cliente` as well.
  #
  # Intentionally OUTSIDE here: `dyn_sql` (`execute_immediate`), whose "name" is a whole
  # expression — filtering keywords there does not solve its problem, which is different.

  # Explicit CALL statement (CALL pkg.proc())
  - data_key: calls
    graph_label: ""
    pattern: "//call_statement/routine_name"
    name_capture: name
    type: relation
    relation_type: CALLS
    name_reject: '(?i)^(begin|declare|end|if|elsif|then|else|case|when|loop|while|for|exit|continue|goto|return|null|procedure|function|package|body|exception|raise|commit|rollback|savepoint|set|select|insert|update|delete|merge|values|into|from|where|and|or|not|is|as|declare|cursor|record|type|subtype|constant|pragma|open|close|fetch|forall|bulk|using|out|in)$|^[^A-Za-z_]'

  # Function calls within expressions (func(x), pkg.func(x))
  - data_key: calls
    graph_label: ""
    pattern: "//function_call/routine_name"
    name_capture: name
    type: relation
    relation_type: CALLS
    name_reject: '(?i)^(begin|declare|end|if|elsif|then|else|case|when|loop|while|for|exit|continue|goto|return|null|procedure|function|package|body|exception|raise|commit|rollback|savepoint|set|select|insert|update|delete|merge|values|into|from|where|and|or|not|is|as|declare|cursor|record|type|subtype|constant|pragma|open|close|fetch|forall|bulk|using|out|in)$|^[^A-Za-z_]'

  # Procedure calls in body (proc_name(args))
  - data_key: calls
    graph_label: ""
    pattern: "//procedure_call/routine_name"
    name_capture: name
    type: relation
    relation_type: CALLS
    name_reject: '(?i)^(begin|declare|end|if|elsif|then|else|case|when|loop|while|for|exit|continue|goto|return|null|procedure|function|package|body|exception|raise|commit|rollback|savepoint|set|select|insert|update|delete|merge|values|into|from|where|and|or|not|is|as|declare|cursor|record|type|subtype|constant|pragma|open|close|fetch|forall|bulk|using|out|in)$|^[^A-Za-z_]'

  # EXECUTE IMMEDIATE (dynamic SQL)
  - data_key: dyn_sql
    graph_label: ""
    pattern: "//execute_immediate//expression"
    name_capture: name
    type: relation
    relation_type: CALLS

  # ═══════════════════════════════════════════════════════════════════════════
  # DML TABLE REFERENCES
  # ═══════════════════════════════════════════════════════════════════════════

  # SELECT ... FROM table
  - data_key: selects
    graph_label: ""
    pattern: "//from_clause/table_ref_list//tableview_name"
    name_capture: name
    type: relation
    relation_type: SELECTS

  # SELECT ... FROM table (subquery_basic_elements for inline views)
  - data_key: selects
    graph_label: ""
    pattern: "//query_block/from_clause//tableview_name"
    name_capture: name
    type: relation
    relation_type: SELECTS

  # INSERT INTO table
  - data_key: inserts
    graph_label: ""
    pattern: "//insert_into_clause/general_table_ref//tableview_name"
    name_capture: name
    type: relation
    relation_type: INSERTS

  # Multi-table insert (INSERT ALL INTO ...)
  - data_key: inserts
    graph_label: ""
    pattern: "//multi_table_insert//tableview_name"
    name_capture: name
    type: relation
    relation_type: INSERTS

  # UPDATE table
  - data_key: updates
    graph_label: ""
    pattern: "//update_statement/general_table_ref//tableview_name"
    name_capture: name
    type: relation
    relation_type: UPDATES

  # DELETE FROM table
  - data_key: deletes
    graph_label: ""
    pattern: "//delete_statement/general_table_ref//tableview_name"
    name_capture: name
    type: relation
    relation_type: DELETES

  # MERGE INTO table
  - data_key: merges
    graph_label: ""
    pattern: "//merge_statement//tableview_name"
    name_capture: name
    type: relation
    relation_type: UPDATES

  # ═══════════════════════════════════════════════════════════════════════════
  # DDL OPERATIONS (ALTER, DROP, TRUNCATE)
  # ═══════════════════════════════════════════════════════════════════════════

  # ALTER TABLE
  - data_key: alters
    graph_label: ""
    pattern: "//alter_table/tableview_name"
    name_capture: name
    type: relation
    relation_type: ALTERS

  # ALTER INDEX
  - data_key: alters
    graph_label: ""
    pattern: "//alter_index/index_name"
    name_capture: name
    type: relation
    relation_type: ALTERS

  # ALTER VIEW
  - data_key: alters
    graph_label: ""
    pattern: "//alter_view/tableview_name"
    name_capture: name
    type: relation
    relation_type: ALTERS

  # ALTER SEQUENCE
  - data_key: alters
    graph_label: ""
    pattern: "//alter_sequence/sequence_name"
    name_capture: name
    type: relation
    relation_type: ALTERS

  # ALTER TRIGGER
  - data_key: alters
    graph_label: ""
    pattern: "//alter_trigger/trigger_name"
    name_capture: name
    type: relation
    relation_type: ALTERS

  # DROP TABLE
  - data_key: drops
    graph_label: ""
    pattern: "//drop_table/tableview_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  # DROP INDEX
  - data_key: drops
    graph_label: ""
    pattern: "//drop_index/index_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  # DROP VIEW
  - data_key: drops
    graph_label: ""
    pattern: "//drop_view/tableview_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  # DROP FUNCTION
  - data_key: drops
    graph_label: ""
    pattern: "//drop_function/function_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  # DROP PROCEDURE
  - data_key: drops
    graph_label: ""
    pattern: "//drop_procedure/procedure_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  # DROP PACKAGE
  - data_key: drops
