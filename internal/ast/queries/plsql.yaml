    name_capture: name
    type: relation
    relation_type: INSERTS

  - data_key: updates
    graph_label: ""
    pattern: "//update_statement/general_table_ref//tableview_name"
    name_capture: name
    type: relation
    relation_type: UPDATES

  - data_key: deletes
    graph_label: ""
    pattern: "//delete_statement/general_table_ref//tableview_name"
    name_capture: name
    type: relation
    relation_type: DELETES

  - data_key: merges
    graph_label: ""
    pattern: "//merge_statement//tableview_name"
    name_capture: name
    type: relation
    relation_type: UPDATES

  - data_key: alters
    graph_label: ""
    pattern: "//alter_table/tableview_name"
    name_capture: name
    type: relation
    relation_type: ALTERS

  - data_key: alters
    graph_label: ""
    pattern: "//alter_index/index_name"
    name_capture: name
    type: relation
    relation_type: ALTERS

  - data_key: alters
    graph_label: ""
    pattern: "//alter_view/tableview_name"
    name_capture: name
    type: relation
    relation_type: ALTERS

  - data_key: alters
    graph_label: ""
    pattern: "//alter_sequence/sequence_name"
    name_capture: name
    type: relation
    relation_type: ALTERS

  - data_key: alters
    graph_label: ""
    pattern: "//alter_trigger/trigger_name"
    name_capture: name
    type: relation
    relation_type: ALTERS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_table/tableview_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_index/index_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_view/tableview_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_function/function_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_procedure/procedure_name"
    name_capture: name
