    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_trigger/trigger_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_sequence/sequence_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_type/type_name"
    name_capture: name
    type: relation
    relation_type: DROPS

  - data_key: drops
    graph_label: ""
    pattern: "//drop_synonym/synonym_name"
