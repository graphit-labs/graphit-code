language: rust
grammar: tree-sitter-rust
extensions: [".rs"]
queries:
  # === Entity queries ===
  - data_key: functions
    graph_label: Function
    pattern: '(function_item name: (identifier) @name)'
  - data_key: structs
    graph_label: Struct
    pattern: '(struct_item name: (type_identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_item name: (type_identifier) @name)'
  - data_key: traits
    graph_label: Trait
    pattern: '(trait_item name: (type_identifier) @name)'
  - data_key: types
    graph_label: Type
    pattern: '(type_item name: (type_identifier) @name)'
  - data_key: constants
    graph_label: Constant
    pattern: '(const_item name: (identifier) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(static_item name: (identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(use_declaration argument: (scoped_identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(use_declaration argument: (identifier) @name)'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameter pattern: (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(field_declaration name: (field_identifier) @name)'

  # === Relation queries ===
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (scoped_identifier name: (identifier) @name))'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (field_expression field: (field_identifier) @name))'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(field_expression field: (field_identifier) @name)'
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(attribute_item (attribute (identifier) @name))'
  - data_key: implements
    type: relation
    relation_type: IMPLEMENTS
    pattern: '(impl_item trait: (type_identifier) @name)'

# Rust export detection: pub modifier
exports:
  strategy: modifier
  config:
    keyword: "pub"

# Rust uses 'self' for receiver type resolution
self_keywords: ["self.", "Self."]

# Parent context type mapping — Rust tree-sitter node types only
# Rust has no classes, interfaces, or methods as separate node types.
# Methods in Rust are function_item nodes inside impl_item blocks.
context_types:
  impl_item: Struct
  struct_item: Struct
  trait_item: Trait
  enum_item: Enum
  mod_item: Namespace
  function_item: Function

# Rust has no anonymous function expressions via variable_declarator
# Rust uses closures but they are not assigned via variable_declarator pattern
anon_func_types: []

# Declaration node types for docstring attachment — Rust tree-sitter only
declaration_types:
  - function_item
  - struct_item
  - enum_item
  - trait_item
  - impl_item
  - type_item
  - const_item
  - static_item
  - mod_item

# Rust tree-sitter uses line_comment and block_comment node types
comment_types:
  - line_comment
  - block_comment

# Entry point scoring rules for Rust
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "test_*"
      score: 60
    - pattern: init
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*handler"
      score: 30
    - pattern: "run*"
      score: 20
    - pattern: "cmd*"
      score: 20

  exported_bonus: 10
  max_score: 100

  # Rust attribute-based decorators
  decorators:
    # Test attributes
    - name: test
      score: 60
    - name: bench
      score: 50
    # Web framework route attributes (actix-web, axum, rocket)
    - name: get
      score: 70
    - name: post
      score: 70
    - name: put
      score: 70
    - name: delete
      score: 70
    - name: route
      score: 70
