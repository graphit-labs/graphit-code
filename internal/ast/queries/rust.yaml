language: rust
extensions: [".rs"]
queries:
  - data_key: functions
    graph_label: Function
    pattern: '(function_item name: (identifier) @name)'
  - data_key: structs
    graph_label: Struct
    pattern: '(struct_item name: (type_identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_item name: (type_identifier) @name)'
  - data_key: traits
    graph_label: Trait
    pattern: '(trait_item name: (type_identifier) @name)'
  - data_key: types
    graph_label: Type
    pattern: '(type_item name: (type_identifier) @name)'
  - data_key: constants
    graph_label: Constant
    pattern: '(const_item name: (identifier) @name)'
  - data_key: variables
    graph_label: Variable
    pattern: '(static_item name: (identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(use_declaration argument: (scoped_identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(use_declaration argument: (identifier) @name)'
  - data_key: calls
    pattern: '(call_expression function: (identifier) @name)'
  - data_key: calls
    pattern: '(call_expression function: (scoped_identifier name: (identifier) @name))'
  - data_key: calls
    pattern: '(call_expression function: (field_expression field: (field_identifier) @name))'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(parameter pattern: (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(field_declaration name: (field_identifier) @name)'
  - data_key: field_reads
    pattern: '(field_expression field: (field_identifier) @name)'
  - data_key: decorators
    pattern: '(attribute_item (attribute (identifier) @name))'
  - data_key: implements
    pattern: '(impl_item trait: (type_identifier) @name)'

# Export detection strategy — extracted from detectExports()
exports:
  strategy: modifier
  config:
    keyword: "pub"

# Self/this keywords for receiver type resolution — extracted from selfKeywordsForLang()
self_keywords: ["self."]

# Parent context type mapping — extracted from resolveParentContext()
context_types:
  class_declaration: Class
  class_definition: Class
  interface_declaration: Interface
  struct_declaration: Struct
  trait_declaration: Trait
  namespace_declaration: Namespace
  enum_declaration: Enum
  function_declaration: Function
  function_definition: Function
  method_declaration: Method
  method_definition: Method

# Anonymous function types for variable_declarator resolution — extracted from resolveParentContext()
anon_func_types: []

# Declaration types for docstring attachment — extracted from declarationTypes map
declaration_types:
  - function_declaration
  - method_declaration
  - method_definition
  - function_definition
  - function_item
  - class_declaration
  - class_definition
  - struct_item
  - interface_declaration
  - trait_item
  - enum_item
  - enum_declaration
  - struct_declaration
  - type_item
  - protocol_declaration
  - namespace_definition
  - variable_declarator
  - lexical_declaration
  - property_declaration

# Comment node types for docstring extraction — extracted from isCommentNode()
comment_types:
  - comment
  - block_comment
  - line_comment
