language: dart
grammar: tree-sitter-dart
extensions: [".dart"]
queries:
  # === Entity queries ===
  - data_key: functions
    graph_label: Function
    pattern: '(function_signature name: (identifier) @name)'
  - data_key: methods
    graph_label: Method
    pattern: '(method_signature (function_signature name: (identifier) @name))'
  - data_key: methods
    graph_label: Method
    pattern: '(method_signature (constructor_signature name: (identifier) @name))'
  - data_key: methods
    graph_label: Method
    pattern: '(method_signature (getter_signature name: (identifier) @name))'
  - data_key: methods
    graph_label: Method
    pattern: '(method_signature (setter_signature name: (identifier) @name))'
  - data_key: classes
    graph_label: Class
    pattern: '(class_definition name: (identifier) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum_declaration name: (identifier) @name)'
  - data_key: interfaces
    graph_label: Interface
    pattern: '(mixin_declaration name: (identifier) @name)'
  - data_key: classes
    graph_label: Class
    pattern: '(extension_declaration name: (identifier) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(import_specification (configurable_uri (uri (string_literal) @name)))'
  - data_key: parameters
    graph_label: Parameter
    pattern: '(formal_parameter name: (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(declaration (initialized_identifier (identifier) @name))'

  # === Relation queries ===
  - data_key: decorators
    type: relation
    relation_type: DECORATOR
    pattern: '(annotation name: (identifier) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(superclass (type_identifier) @name)'
  - data_key: implements
    type: relation
    relation_type: IMPLEMENTS
    pattern: '(interfaces (type_identifier) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(mixins (type_identifier) @name)'

# Export detection strategy — Dart uses underscore prefix for private
exports:
  strategy: no_prefix
  config:
    prefix: "_"

# Self/this keywords for receiver type resolution
self_keywords: ["this."]

# Parent context type mapping — Dart tree-sitter node types only
context_types:
  class_definition: Class
  enum_declaration: Enum
  mixin_declaration: Class
  extension_declaration: Class

# Anonymous function types for variable_declarator resolution
anon_func_types:
  - function_expression

# Declaration types for docstring attachment — Dart node types only
declaration_types:
  - class_definition
  - enum_declaration
  - mixin_declaration
  - extension_declaration
  - type_alias
  - function_signature
  - method_signature

# Comment node types for docstring extraction — Dart has comment and documentation_comment
comment_types:
  - comment
  - documentation_comment

# Entry point scoring rules for Dart
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "test*"
      score: 60
    - pattern: init
      score: 40
    - pattern: initState
      score: 50
    - pattern: build
      score: 50
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "run*"
      score: 20

  exported_bonus: 10
  max_score: 100

  decorators:
    # Flutter widget/state annotations
    - name: override
      score: 30
    - name: immutable
      score: 20
    - name: protected
      score: 20
    - name: required
      score: 20
    - name: visibleForTesting
      score: 40
    # Testing annotations
    - name: isTest
      score: 60
    - name: isTestGroup
      score: 60
    # Code generation annotations
    - name: JsonSerializable
      score: 30
    - name: freezed
      score: 30
    - name: riverpod
      score: 40
    # Server-side annotations (shelf/dart_frog)
    - name: Route
      score: 70

# Import detection (Dart/Flutter framework detection)
import_detection:
  - pattern: "package:flutter/"
    match: prefix
    framework: flutter
    category: ui
  - pattern: "package:flutter_test/"
    match: prefix
    framework: flutter-test
    category: test
  - pattern: "package:test/"
    match: prefix
    framework: dart-test
    category: test
  - pattern: "package:http/"
    match: prefix
    framework: http
    category: web
  - pattern: "package:dio/"
    match: prefix
    framework: dio
    category: web
  - pattern: "package:provider/"
    match: prefix
    framework: provider
    category: state
  - pattern: "package:riverpod/"
    match: prefix
    framework: riverpod
    category: state
  - pattern: "package:flutter_riverpod/"
    match: prefix
    framework: riverpod
    category: state
  - pattern: "package:bloc/"
    match: prefix
    framework: bloc
    category: state
  - pattern: "package:flutter_bloc/"
    match: prefix
    framework: bloc
    category: state
  - pattern: "package:get/"
    match: prefix
    framework: getx
    category: state
  - pattern: "package:shelf/"
    match: prefix
    framework: shelf
    category: web
  - pattern: "package:dart_frog/"
    match: prefix
    framework: dart-frog
    category: web
  - pattern: "package:json_annotation/"
    match: prefix
    framework: json-serializable
    category: serialization
  - pattern: "package:freezed_annotation/"
    match: prefix
    framework: freezed
    category: codegen
  - pattern: "package:drift/"
    match: prefix
    framework: drift
    category: orm
  - pattern: "package:sqflite/"
    match: prefix
    framework: sqflite
    category: database
  - pattern: "package:firebase_core/"
    match: prefix
    framework: firebase
    category: cloud
  - pattern: "package:grpc/"
    match: prefix
    framework: grpc
    category: rpc
