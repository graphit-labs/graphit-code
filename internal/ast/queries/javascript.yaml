    category: test
  - pattern: playwright
    match: prefix
    framework: playwright
    category: test

  # CSS / State
  - pattern: tailwindcss
    match: prefix
    framework: tailwind
    category: css
  - pattern: redux
    match: prefix
    framework: redux
    category: state
  - pattern: zustand
    match: prefix
    framework: zustand
    category: state
  - pattern: mobx
    match: prefix
    framework: mobx
    category: state
