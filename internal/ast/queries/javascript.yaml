language: javascript
grammar: tree-sitter-javascript
extensions: [".js", ".jsx", ".mjs"]
queries:
  # ═══════════════════════════════════════════════════════════════
  # FUNCTIONS & METHODS
  # ═══════════════════════════════════════════════════════════════
  - data_key: functions
    graph_label: Function
    pattern: '(function_declaration name: (identifier) @name)'
  - data_key: functions
    graph_label: Function
    pattern: '(generator_function_declaration name: (identifier) @name)'
  - data_key: methods
    graph_label: Method
    pattern: '(method_definition name: (property_identifier) @name)'
  - data_key: functions
    graph_label: Function
    pattern: '(variable_declarator name: (identifier) @name value: (arrow_function))'
  - data_key: functions
    graph_label: Function
    pattern: '(variable_declarator name: (identifier) @name value: (function_expression))'

  # ═══════════════════════════════════════════════════════════════
  # CLASSES
  # ═══════════════════════════════════════════════════════════════
  - data_key: classes
    graph_label: Class
    pattern: '(class_declaration name: (identifier) @name)'

  # ═══════════════════════════════════════════════════════════════
  # VARIABLES
  # ═══════════════════════════════════════════════════════════════
  - data_key: variables
    graph_label: Variable
    pattern: '(lexical_declaration (variable_declarator name: (identifier) @name))'

  # ═══════════════════════════════════════════════════════════════
  # IMPORTS & EXPORTS
  # ═══════════════════════════════════════════════════════════════
  - data_key: imports
    graph_label: Module
    pattern: '(import_statement source: (string) @name)'
  - data_key: imports
    graph_label: Module
    pattern: '(export_statement source: (string) @name)'
  - data_key: exports
    type: relation
    relation_type: EXPORT
    pattern: '(export_statement declaration: (function_declaration name: (identifier) @name))'

  # ═══════════════════════════════════════════════════════════════
  # PARAMETERS & FIELDS
  # ═══════════════════════════════════════════════════════════════
  - data_key: parameters
    graph_label: Parameter
    pattern: '(formal_parameters (identifier) @name)'
  - data_key: fields
    graph_label: Field
    pattern: '(field_definition property: (property_identifier) @name)'

  # ═══════════════════════════════════════════════════════════════
  # RELATIONS
  # ═══════════════════════════════════════════════════════════════
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (identifier) @name)'
  - data_key: calls
    type: relation
    relation_type: CALLS
    pattern: '(call_expression function: (member_expression property: (property_identifier) @name))'
  - data_key: instantiations
    type: relation
    relation_type: INSTANTIATES
    pattern: '(new_expression constructor: (identifier) @name)'
  - data_key: heritage
    type: relation
    relation_type: INHERITS
    pattern: '(class_heritage (identifier) @name)'
  - data_key: field_reads
    type: relation
    relation_type: READS_FIELD
    pattern: '(member_expression property: (property_identifier) @name)'
  - data_key: field_writes
    type: relation
    relation_type: WRITES_FIELD
    pattern: '(assignment_expression left: (member_expression property: (property_identifier) @name))'

# Export detection strategy
exports:
  strategy: export_statement

# JavaScript uses 'this', not 'self'
self_keywords: ["this."]

# tree-sitter-javascript context types (only valid JS node types)
context_types:
  class_declaration: Class
  function_declaration: Function
  method_definition: Method

# Anonymous function types for variable_declarator resolution
anon_func_types:
  - arrow_function
  - function_expression
  - function
  - generator_function

# tree-sitter-javascript declaration types for docstring attachment
declaration_types:
  - function_declaration
  - generator_function_declaration
  - method_definition
  - class_declaration
  - variable_declarator
  - lexical_declaration

# tree-sitter-javascript has a single 'comment' type for both // and /* */
comment_types:
  - comment

# Entry point scoring rules
entry_points:
  names:
    - pattern: main
      score: 80
    - pattern: "test_*"
      score: 60
    - pattern: "*.test"
      score: 60
    - pattern: "*.spec"
      score: 60
    - pattern: init
      score: 40
    - pattern: setup
      score: 40
    - pattern: configure
      score: 40
    - pattern: "*Handler"
      score: 30
    - pattern: "*Controller"
      score: 30
    - pattern: "*Middleware"
      score: 30
    - pattern: "run*"
      score: 20
    - pattern: "start*"
      score: 20

  exported_bonus: 10
  max_score: 100

  # JS has no native decorators in tree-sitter-javascript.
  # Express app.get/app.post are function calls, not decorators.
  decorators: []

# Import detection (framework detection — keep as-is)
import_detection:
  # Web frameworks
  - pattern: express
    match: prefix
    framework: express
    category: web
  - pattern: koa
    match: prefix
    framework: koa
    category: web
  - pattern: fastify
    match: prefix
    framework: fastify
    category: web
  - pattern: hono
    match: prefix
    framework: hono
    category: web

  # UI frameworks
  - pattern: react
    match: prefix
    framework: react
    category: ui
  - pattern: react-dom
    match: prefix
    framework: react
    category: ui
  - pattern: next
    match: prefix
    framework: next
    category: web
  - pattern: vue
    match: prefix
    framework: vue
    category: ui
  - pattern: nuxt
    match: prefix
    framework: nuxt
    category: web
  - pattern: svelte
    match: prefix
    framework: svelte
    category: ui
  - pattern: "@angular/core"
    match: prefix
    framework: angular
    category: ui
  - pattern: "@nestjs/common"
    match: prefix
    framework: nestjs
    category: web

  # ORM / Data
  - pattern: prisma
    match: prefix
    framework: prisma
    category: orm
  - pattern: typeorm
    match: prefix
    framework: typeorm
    category: orm
  - pattern: sequelize
    match: prefix
    framework: sequelize
    category: orm
  - pattern: mongoose
    match: prefix
    framework: mongoose
    category: orm

  # API / GraphQL
  - pattern: graphql
    match: prefix
    framework: graphql
    category: api
  - pattern: apollo
    match: prefix
    framework: apollo
    category: api
  - pattern: trpc
    match: prefix
    framework: trpc
    category: api
  - pattern: socket.io
    match: prefix
    framework: socketio
    category: realtime

  # Testing
  - pattern: jest
    match: prefix
    framework: jest
    category: test
  - pattern: mocha
    match: prefix
    framework: mocha
    category: test
  - pattern: vitest
    match: prefix
    framework: vitest
    category: test
  - pattern: cypress
    match: prefix
    framework: cypress
    category: test
  - pattern: playwright
    match: prefix
    framework: playwright
    category: test

  # CSS / State
  - pattern: tailwindcss
    match: prefix
    framework: tailwind
    category: css
  - pattern: redux
    match: prefix
    framework: redux
    category: state
  - pattern: zustand
    match: prefix
    framework: zustand
    category: state
  - pattern: mobx
    match: prefix
    framework: mobx
    category: state
