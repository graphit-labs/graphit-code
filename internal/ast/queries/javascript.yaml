    category: web

  # ORM / Data
  - pattern: prisma
    match: prefix
    framework: prisma
    category: orm
  - pattern: typeorm
    match: prefix
    framework: typeorm
    category: orm
  - pattern: sequelize
    match: prefix
    framework: sequelize
    category: orm
  - pattern: mongoose
    match: prefix
    framework: mongoose
    category: orm

  # API / GraphQL
  - pattern: graphql
    match: prefix
    framework: graphql
    category: api
  - pattern: apollo
    match: prefix
    framework: apollo
    category: api
  - pattern: trpc
    match: prefix
    framework: trpc
    category: api
  - pattern: socket.io
    match: prefix
    framework: socketio
    category: realtime

  # Testing
  - pattern: jest
    match: prefix
    framework: jest
    category: test
  - pattern: mocha
    match: prefix
    framework: mocha
    category: test
  - pattern: vitest
    match: prefix
    framework: vitest
    category: test
  - pattern: cypress
    match: prefix
