language: protobuf
grammar: tree-sitter-proto
extensions: [".proto"]
queries:
  # === Entity queries ===
  - data_key: services
    graph_label: Service
    pattern: '(service (service_name) @name)'
  - data_key: messages
    graph_label: Message
    pattern: '(message (message_name) @name)'
  - data_key: enums
    graph_label: Enum
    pattern: '(enum (enum_name) @name)'
  - data_key: rpcs
    graph_label: RPC
    pattern: '(rpc (rpc_name) @name)'
  - data_key: fields
    graph_label: MessageField
    pattern: '(field (identifier) @name)'
  - data_key: map_fields
    graph_label: MessageField
    pattern: '(map_field (identifier) @name)'
  - data_key: oneofs
    graph_label: Oneof
    pattern: '(oneof (identifier) @name)'
  - data_key: packages
    graph_label: Package
    pattern: '(package (full_ident) @name)'
  - data_key: enum_values
    graph_label: EnumValue
    pattern: '(enum_field (identifier) @name)'

  # A field's number and an enum's value ARE the wire contract: they are what the two
  # sides of an RPC agree on, and neither was indexed.
  - data_key: fields
    graph_label: MessageField
    pattern: '(field (identifier) @name (field_number (int_lit) @value))'
    value_capture: value
    value_label: Value
  - data_key: enum_values
    graph_label: EnumValue
    pattern: '(enum_field (identifier) @name (int_lit) @value)'
    value_capture: value
    value_label: Value
  - data_key: options
    graph_label: Option
    pattern: '(option (identifier) @name)'

  # === Relation queries ===
  - data_key: import_refs
    type: relation
    relation_type: IMPORTS
    pattern: '(import (string) @name)'

# Protobuf is a schema language — no export system
exports:
  strategy: none

# Protobuf does not use self/this
self_keywords: []

# Parent context type mapping — Protobuf tree-sitter node types
context_types:
  service: Service
  message: Message
  enum: Enum

# Without these all three contexts above are INERT: tree-sitter-proto defines no field
# called "name" anywhere, so the default field lookup finds nothing, nameNodeOf returns
# nil and the container is skipped. Measured before this: an `rpc` inside
# `service Payments` came out with context "" — and so did every field of every message.
context_name_paths:
  service: service_name
  message: message_name
  enum: enum_name

# Protobuf has no anonymous function types
anon_func_types: []

# Declaration node types for docstring attachment
declaration_types:
  - service
  - message
  - enum
  - rpc

# Protobuf tree-sitter uses a single "comment" node type for // and /* */ comments
comment_types:
  - comment

# No cyclomatic complexity: Protocol Buffers is a schema format with no
# control flow.

# Labels of this language that get a vector, so semantic search reaches them and
# not only keyword search. Order decides which label keeps a (path, uid) that two
# of them claim -- earlier wins. Every entity is in the keyword index regardless;
# this list is only about meaning. See docs/specs/ast_module.md.
embed_labels:
  - Service
  - RPC
  - Message
  - MessageField
  - Enum
  - EnumValue
  - Oneof
  - Package
  - Comment
