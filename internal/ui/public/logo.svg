<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100%" height="100%">
  <defs>
    <!-- Background Glow -->
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0" />
    </radialGradient>
    
    <!-- Edge Gradient (Left/Main Path) -->
    <linearGradient id="edgeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6366f1" />
      <stop offset="50%" stop-color="#3b82f6" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Node Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background Glow -->
  <circle cx="50%" cy="50%" r="45%" fill="url(#bgGlow)" />

  <!-- Outer Hexagonal boundary guide (subtle, high-tech grid) -->
  <polygon points="50,8 86,29 86,71 50,92 14,71 14,29" fill="none" stroke="currentColor" stroke-opacity="0.06" stroke-width="1.5" />
  
  <!-- Graph Edges (Connections) -->
  <!-- Main "G" Path -->
  <path d="M 75,25 L 50,15 L 25,25 L 25,75 L 50,85 L 75,75 L 75,50 L 50,50" 
        fill="none" 
        stroke="url(#edgeGrad)" 
        stroke-width="4" 
        stroke-linecap="round" 
        stroke-linejoin="round" />
        
  <!-- Auxiliary Edges (making it a complex graph) -->
  <!-- Center internal tree -->
  <line x1="50" y1="15" x2="50" y2="35" stroke="#6366f1" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="2,2" />
  <line x1="50" y1="35" x2="50" y2="50" stroke="#3b82f6" stroke-width="2" stroke-opacity="0.5" stroke-dasharray="2,2" />
  
  <!-- Left web -->
  <line x1="14" y1="50" x2="25" y2="25" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="14" y1="50" x2="25" y2="75" stroke="#3b82f6" stroke-width="1.5" stroke-opacity="0.4" />
  
  <!-- Right web -->
  <line x1="86" y1="50" x2="75" y2="25" stroke="#6366f1" stroke-width="1.5" stroke-opacity="0.4" />
  <line x1="86" y1="50" x2="75" y2="50" stroke="#06b6d4" stroke-width="1.5" stroke-opacity="0.4" />

  <!-- Graph Nodes -->
  <!-- Main "G" path nodes -->
  <circle cx="75" cy="25" r="3.5" fill="#6366f1" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="50" cy="15" r="4.5" fill="#4f46e5" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
  <circle cx="25" cy="25" r="3.5" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="25" cy="75" r="3.5" fill="#3b82f6" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="50" cy="85" r="4" fill="#06b6d4" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="75" cy="75" r="3.5" fill="#0ea5e9" stroke="#ffffff" stroke-width="1.5" filter="url(#glow)" />
  <circle cx="75" cy="50" r="4.5" fill="#06b6d4" stroke="#ffffff" stroke-width="2" filter="url(#glow)" />
  <circle cx="50" cy="50" r="5" fill="#10b981" stroke="#ffffff" stroke-width="2" filter="url(#glow)" /> <!-- Center/Core node -->

  <!-- Auxiliary Nodes -->
  <circle cx="50" cy="35" r="2.5" fill="#818cf8" stroke="#ffffff" stroke-width="1" />
  <circle cx="14" cy="50" r="2.5" fill="#60a5fa" stroke="#ffffff" stroke-width="1" />
  <circle cx="86" cy="50" r="2.5" fill="#38bdf8" stroke="#ffffff" stroke-width="1" />
</svg>
