nextest-version = "0.9.151"

# This case uses a 120-second request deadline; retain the normal slow warning
# and fail the isolated test process instead of hiding an unresponsive lifecycle.
[[profile.default.overrides]]
platform = 'cfg(target_os = "linux")'
filter = 'binary_id(=graphit-app::integration) & test(=foreground_ast_semantic::ast_only_publishes_current_graph_without_native_nn)'
slow-timeout = { period = "60s", terminate-after = 2, on-timeout = "fail" }
