# PL/SQL grammar build configuration.
#
# PL/SQL is one of the largest ANTLR grammars (~338k lines of generated parser).
# The ATN tables consume ~2.1MB in the WASM data section, and parsing deeply
# nested SQL (CTEs, subqueries, CASE expressions) requires deep recursion.
#
# For simpler grammars, the Makefile defaults are fine (4 / 64 / 2).

# WASM memory limits (in MB) — sandbox size, not physical RAM.
INITIAL_MEMORY_MB=32
MAX_MEMORY_MB=512
STACK_SIZE_MB=8
