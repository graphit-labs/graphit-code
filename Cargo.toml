[workspace]
members = ["crates/graphit-core", "crates/graphit-process", "crates/graphit-http", "crates/graphit-fs", "crates/graphit-hub", "crates/graphit-auth", "crates/graphit-data", "crates/graphit-ast", "crates/graphit-records", "crates/graphit-ai", "crates/graphit-runtime", "crates/graphit-knowledge", "crates/graphit-app", "crates/graphit-daemon", "xtask"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.98"
license = "MIT"

[workspace.dependencies]
path-clean = "1.0.1"
broker-now-wire = { git = "https://github.com/graphit-labs/graphit-broker.git", rev = "7ce8c3d6050b18756377c4adf54aeb2971d394d0", version = "=0.1.0" }
broker-control = { git = "https://github.com/graphit-labs/graphit-broker.git", rev = "7ce8c3d6050b18756377c4adf54aeb2971d394d0", version = "=0.1.0" }
broker-presence = { git = "https://github.com/graphit-labs/graphit-broker.git", rev = "7ce8c3d6050b18756377c4adf54aeb2971d394d0", version = "=0.1.0" }
broker-security = { git = "https://github.com/graphit-labs/graphit-broker.git", rev = "7ce8c3d6050b18756377c4adf54aeb2971d394d0", version = "=0.1.0" }
tree-sitter = "=0.27.0"
tree-sitter-language = "=0.1.8"
protobuf = "=3.7.2"
scip = "=0.10.0"
rustix = { version = "=1.1.5", default-features = false, features = ["std", "process"] }
ioprio = { version = "=0.2.0", default-features = false }
winsafe = { version = "=0.0.29", default-features = false, features = ["kernel"] }
windows-sys = { version = "=0.61.2", default-features = false, features = ["Win32_Foundation", "Win32_Storage_FileSystem"] }
http = "=1.5.0"
tower-http = { version = "=0.7.1", default-features = false, features = ["cors"] }
tower = { version = "=0.5.3", default-features = false, features = ["util"] }
reqwest = { version = "=0.13.5", default-features = false, features = ["rustls", "http2"] }
reqwest-websocket = { version = "=0.6.0", default-features = false }
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
url = "=2.5.8"
oauth2 = { version = "=5.0.0", default-features = false }
tracing = { version = "=0.1.44", default-features = false, features = ["std"] }
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["registry", "std"] }
anstyle = { version = "=1.0.14", default-features = false }
unicode-width = { version = "=0.2.2", default-features = false }
unicode-segmentation = "=1.13.3"
base64 = "0.22"
getrandom = "=0.4.3"
ignore = "=0.4.33"
walkdir = "=2.5.0"
regex = "1.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["float_roundtrip", "raw_value"] }
toon-format = { version = "=0.6.1", default-features = false }
secrecy = "=0.10.3"
subtle = "=2.6.1"
sha2 = "0.11"
tempfile = { version = "=3.27.0", default-features = false }
ulid = "=3.0.0"
process-wrap = { version = "=10.0.1", default-features = false, features = ["process-session", "tokio1", "process-group", "job-object", "kill-on-drop"] }
tokio = { version = "=1.53.2", features = ["process", "io-util", "rt", "rt-multi-thread", "time", "macros", "sync"] }
tokio-util = { version = "=0.7.19", features = ["rt"] }

# Joint Broker tests use the current workspace's shared libraries.
[patch."https://github.com/graphit-labs/graphit-code.git"]
graphit-ai = { path = "crates/graphit-ai" }
graphit-auth = { path = "crates/graphit-auth" }
graphit-core = { path = "crates/graphit-core" }
graphit-fs = { path = "crates/graphit-fs" }
graphit-http = { path = "crates/graphit-http" }

[workspace.lints.rust]
unsafe_code = "forbid"

# Argument counts and type spelling are not correctness gates. Do not add
# parameter wrappers merely to satisfy a numeric or syntactic style threshold.
[workspace.lints.clippy]
too_many_arguments = "allow"
type_complexity = "allow"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

# Keep LLVM generation parallel in the application crate; ThinLTO still
# optimizes across units. Native/dependency artifacts retain their profile.
[profile.release.package.graphit-app]
codegen-units = 16

# Match CI without retaining large dependency debug archives. Assertions and
# release settings are unchanged.
[profile.dev]
debug = 0

[profile.test]
debug = 0
strip = "debuginfo"
