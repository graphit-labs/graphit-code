version: "2"
run:
  build-tags:
    - fts5
linters:
  enable:
    - gosec
    - errorlint
    - gocritic
    # unused is the only automated guard against dead code here, and it covers
    # exactly half the problem: staticcheck's unused reports UNEXPORTED
    # identifiers only. Every package in this repository is internal/, so an
    # export nobody references is unreachable too — and for that half there is no
    # linter at all, only a query against the AST graph, run by hand.
    #
    # Turning it on cost 0 issues, so the half that CAN be automated is now kept
    # clean between one manual sweep and the next. A false positive — a struct
    # field read only through encoding/json reflection, a method satisfying an
    # interface by duck typing — takes a //nolint:unused at the site with its
    # reason on the same line, never a second blanket disable.
  settings:
    govet:
      disable-all: false
    gosec:
      excludes:
        - G104  # Unhandled errors in defers — project convention: _ = f.Close()
        - G110  # Decompression bomb — controlled model extraction in launcher
        - G112  # Slow body reads — CLI tool, not a public server
        - G115  # Integer overflow — architecture-safe int→uint64 conversions
        - G118  # tls.Listen — internal-only dev servers
        - G120  # URL handling — CLI operates on user-provided URLs
        - G122  # Net/http URL — internal-only dev servers
        - G204  # Subprocess via variable — CLI tool spawns processes by design
        - G304  # File inclusion via variable — CLI tool operates on user-provided paths
        - G305  # File traversal in archive — controlled extraction in launcher
        - G306  # File permissions > 0600 — executables require 0755
        - G404  # Weak random — used for non-crypto purposes (IDs, temp names)
        - G602  # Slice bounds — false positive on controlled loops
        - G702  # Command injection — CLI tool executes commands by design
        - G703  # Path traversal — CLI tool operates on user-provided paths
        - G705  # Map range mutation — false positive on controlled patterns
        - G101  # Hardcoded credentials — false positive on HuggingFace model URLs
    gocritic:
      disabled-checks:
        - ifElseChain      # Too noisy for command routing patterns
        - singleCaseSwitch # Intentional in some places for future extensibility
  exclusions:
    generated: strict
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    rules:
      - linters:
          - errcheck
          - govet
          - staticcheck
        path: node_modules/
      - linters:
          - gosec
        path: _test\.go
    paths:
      - node_modules
      - third_party
      - third_party$
      - builtin$
      - examples$
      - internal/ast/antlr
      - internal/ast/treesitter
formatters:
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
